name: AI Image Quality Enhancer

on:
  workflow_dispatch:
    inputs:
      IMAGE_DATA:
        description: 'Base64 encoded input image string'
        required: false
        default: ''
      UPSCALE_FACTOR:
        description: 'Upscale factor (2, 4, 8)'
        required: false
        default: '2'
      CUSTOM_WIDTH:
        description: 'Target custom width in pixels'
        required: false
        default: '0'
      CUSTOM_HEIGHT:
        description: 'Target custom height in pixels'
        required: false
        default: '0'
      FACE_ENHANCE:
        description: 'Enable face enhancement (true/false)'
        required: false
        default: 'true'
      DENOISE:
        description: 'Enable noise reduction (true/false)'
        required: false
        default: 'true'
      SHARPEN:
        description: 'Enable detail sharpening (true/false)'
        required: false
        default: 'true'
      SHARPEN_STRENGTH:
        description: 'Sharpen strength percentage (0-200)'
        required: false
        default: '120'
      SMOOTH_STRENGTH:
        description: 'Surface smoothness percentage (0-100)'
        required: false
        default: '60'
      CONTRAST_STRENGTH:
        description: 'Color and contrast strength percentage (50-180)'
        required: false
        default: '110'
      AI_MODEL:
        description: 'AI Model style (crystal_hd, codeformer_face, anime_art, hdr_vivid)'
        required: false
        default: 'crystal_hd'
      OUTPUT_FORMAT:
        description: 'Output format (png, webp, jpg)'
        required: false
        default: 'png'
      JOB_ID:
        description: 'Unique Job Identifier'
        required: false
        default: 'job_latest'

permissions:
  contents: write

jobs:
  enhance-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python & Pip Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'image-enhancer/requirements.txt'

      - name: Install Dependencies (Cached)
        run: |
          python -m pip install --upgrade pip
          pip install -r image-enhancer/requirements.txt

      - name: Run AI Image Processing
        env:
          IMAGE_DATA: ${{ github.event.inputs.IMAGE_DATA }}
          UPSCALE_FACTOR: ${{ github.event.inputs.UPSCALE_FACTOR }}
          CUSTOM_WIDTH: ${{ github.event.inputs.CUSTOM_WIDTH }}
          CUSTOM_HEIGHT: ${{ github.event.inputs.CUSTOM_HEIGHT }}
          FACE_ENHANCE: ${{ github.event.inputs.FACE_ENHANCE }}
          DENOISE: ${{ github.event.inputs.DENOISE }}
          SHARPEN: ${{ github.event.inputs.SHARPEN }}
          SHARPEN_STRENGTH: ${{ github.event.inputs.SHARPEN_STRENGTH }}
          SMOOTH_STRENGTH: ${{ github.event.inputs.SMOOTH_STRENGTH }}
          CONTRAST_STRENGTH: ${{ github.event.inputs.CONTRAST_STRENGTH }}
          AI_MODEL: ${{ github.event.inputs.AI_MODEL }}
          OUTPUT_FORMAT: ${{ github.event.inputs.OUTPUT_FORMAT }}
          JOB_ID: ${{ github.event.inputs.JOB_ID }}
        run: |
          python image-enhancer/process_image.py

      - name: Commit and Push Output Image Result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add image-enhancer/output/

          if git diff-index --quiet HEAD --; then
            echo "No output changes to commit."
          else
            git commit -m "chore(ai-enhancer): process image result for job ${{ github.event.inputs.JOB_ID }}"
            git push origin HEAD
            echo "Successfully pushed enhanced output image to GitHub repository."
          fi
