name: Run Compressed File Extractor Server

concurrency:
  group: zip-extractor-server
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      GH_PAT:
        description: 'GitHub Personal Access Token'
        required: false
        default: ''
      ZIP_URL:
        description: 'Compressed File URL (Zip/Rar/7z/Anonfiles/etc.)'
        required: false
        default: ''
      TELEGRAM_LINK:
        description: 'Telegram Message or Fallback Link'
        required: false
        default: ''
      TARGET_CHANNEL:
        description: 'Target Telegram Channel ID for folder contents'
        required: false
        default: '-1004498823531'
      API_ID:
        description: 'Telegram API ID'
        required: false
        default: ''
      API_HASH:
        description: 'Telegram API HASH'
        required: false
        default: ''
      BOT_TOKEN:
        description: 'Telegram BOT TOKEN'
        required: false
        default: ''
      SESSION_STRING:
        description: 'Telegram Pyrogram Session String'
        required: false
        default: ''
      OWNER_ID:
        description: 'Telegram Owner Chat ID'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-zip-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'restricted/bot/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full unrar aria2 wget curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r restricted/bot/requirements.txt
          pip install rarfile py7zr requests

      - name: Run Compressed File Extractor
        env:
          API_ID: ${{ github.event.inputs.API_ID }}
          API_HASH: ${{ github.event.inputs.API_HASH }}
          BOT_TOKEN: ${{ github.event.inputs.BOT_TOKEN }}
          SESSION: ${{ github.event.inputs.SESSION_STRING }}
          SESSION_STRING: ${{ github.event.inputs.SESSION_STRING }}
          OWNER_ID: ${{ github.event.inputs.OWNER_ID }}
          ZIP_URL: ${{ github.event.inputs.ZIP_URL || github.event.inputs.TELEGRAM_LINK }}
          TARGET_CHANNEL: ${{ github.event.inputs.TARGET_CHANNEL || '-1004498823531' }}
          AUTH: ${{ github.event.inputs.OWNER_ID }}
        run: |
          cd restricted/bot
          echo "Starting compressed file extraction and folder transfer process..."
          python3 zip_extractor.py

      - name: Auto-commit updated persistent tracking and stats
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add restricted/bot/restricted_zip_sent.json restricted/bot/restricted_zip_stats.json restricted/restricted_zip_sent.json restricted/restricted_zip_stats.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(zip): update persistent tracking and zip extraction stats [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi
