name: Run Restricted Bot Server

concurrency:
  group: restricted-bot-server
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      TELEGRAM_LINK:
        description: 'Telegram Message Link to download'
        required: false
        default: ''
      API_ID:
        description: 'Telegram API ID'
        required: false
        default: ''
      API_HASH:
        description: 'Telegram API HASH'
        required: false
        default: ''
      BOT_TOKEN:
        description: 'Telegram BOT TOKEN'
        required: false
        default: ''
      SESSION_STRING:
        description: 'Telegram Pyrogram Session String'
        required: false
        default: ''
      OWNER_ID:
        description: 'Telegram Owner Chat ID'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r restricted/bot/requirements.txt

      - name: Run Restricted Bot or Single Download
        env:
          API_ID: ${{ github.event.inputs.API_ID }}
          API_HASH: ${{ github.event.inputs.API_HASH }}
          BOT_TOKEN: ${{ github.event.inputs.BOT_TOKEN }}
          SESSION: ${{ github.event.inputs.SESSION_STRING }}
          OWNER_ID: ${{ github.event.inputs.OWNER_ID }}
          TELEGRAM_LINK: ${{ github.event.inputs.TELEGRAM_LINK }}
          AUTH: ${{ github.event.inputs.OWNER_ID }}
        run: |
          cd restricted/bot
          if [ -n "$TELEGRAM_LINK" ]; then
            echo "Processing single link download..."
            python3 download_single.py
          else
            echo "Starting continuous bot server..."
            python3 bot.py
          fi
