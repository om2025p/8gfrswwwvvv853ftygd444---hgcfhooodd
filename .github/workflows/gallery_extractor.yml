name: Run Gallery Extractor Server

concurrency:
  group: gallery-extractor-server
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      GALLERY_URL:
        description: 'Gallery Webpage URL to extract photos from'
        required: false
        default: ''
      TELEGRAM_LINK:
        description: 'Telegram Message or Fallback Link'
        required: false
        default: ''
      TARGET_CHANNEL:
        description: 'Target Telegram Channel ID for archive photos'
        required: false
        default: '-1004389912148'
      API_ID:
        description: 'Telegram API ID'
        required: false
        default: ''
      API_HASH:
        description: 'Telegram API HASH'
        required: false
        default: ''
      BOT_TOKEN:
        description: 'Telegram BOT TOKEN'
        required: false
        default: ''
      SESSION_STRING:
        description: 'Telegram Pyrogram Session String'
        required: false
        default: ''
      OWNER_ID:
        description: 'Telegram Owner Chat ID'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-gallery-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'restricted/bot/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r restricted/bot/requirements.txt

      - name: Run Deep 6-Hour Gallery Extractor
        env:
          API_ID: ${{ github.event.inputs.API_ID }}
          API_HASH: ${{ github.event.inputs.API_HASH }}
          BOT_TOKEN: ${{ github.event.inputs.BOT_TOKEN }}
          SESSION: ${{ github.event.inputs.SESSION_STRING }}
          SESSION_STRING: ${{ github.event.inputs.SESSION_STRING }}
          OWNER_ID: ${{ github.event.inputs.OWNER_ID }}
          TELEGRAM_LINK: ${{ github.event.inputs.GALLERY_URL || github.event.inputs.TELEGRAM_LINK }}
          TARGET_CHANNEL: ${{ github.event.inputs.TARGET_CHANNEL }}
          AUTH: ${{ github.event.inputs.OWNER_ID }}
        run: |
          cd restricted/bot
          echo "Starting continuous 6-hour deep gallery extraction server..."
          python3 download_single.py

      - name: Auto-commit updated persistent stats & sent photo history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add restricted/bot/restricted_sent_photos.json restricted/bot/restricted_gallery_stats.json restricted/restricted_sent_photos.json restricted/restricted_gallery_stats.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(gallery): update persistent photo history and gallery stats [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi
