name: Generate Zarin Monthly PDF Report

on:
  workflow_dispatch:
    inputs:
      JALALI_YEAR:
        description: 'Jalali Year (e.g. 1405)'
        required: true
        default: '1405'
      JALALI_MONTH:
        description: 'Jalali Month Index (1-12)'
        required: true
        default: '5'
      BOT_TOKEN:
        description: 'Telegram Bot Token'
        required: true
      CHAT_ID:
        description: 'Telegram Chat ID'
        required: true
      DATA_JSON:
        description: 'JSON history data'
        required: false
        default: '{}'

permissions:
  contents: read

jobs:
  build-and-send-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run PDF Generator Script
        env:
          JALALI_YEAR: ${{ github.event.inputs.JALALI_YEAR }}
          JALALI_MONTH: ${{ github.event.inputs.JALALI_MONTH }}
          BOT_TOKEN: ${{ github.event.inputs.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.CHAT_ID }}
          DATA_JSON: ${{ github.event.inputs.DATA_JSON }}
        run: |
          python generate_zarin_pdf.py
