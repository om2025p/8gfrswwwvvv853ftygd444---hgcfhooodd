name: Daily EasyTrader 5 Sync (Synergy)

on:
  schedule:
    # 22:00 Tehran Time is exactly 18:30 UTC (Tehran is permanently UTC+3:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger for testing

permissions:
  contents: write # Allows committing back updated gold5_backup.json to branch 50

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Browsers and System Deps
        run: |
          playwright install chromium --with-deps

      - name: Run EasyTrader Automation
        env:
          EASYTRADER_USER: ${{ secrets.EASYTRADER_USER }}
          EASYTRADER_PASS: ${{ secrets.EASYTRADER_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANTLE_FINGERPRINT: ${{ secrets.MANTLE_FINGERPRINT }}
        run: |
          python easytrader_automation.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if there are changes in gold5_backup.json to avoid empty commit errors
          git add gold5/gold5_backup.json

          if git diff-index --quiet HEAD --; then
            echo "No changes in backup file. Skipping commit."
          else
            git commit -m "chore(sync): automated update of daily percent and base number"
            git push origin HEAD
            echo "Successfully pushed updated backup to GitHub repository."
          fi
