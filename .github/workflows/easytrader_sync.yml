name: Daily EasyTrader 5 Sync (Synergy)

on:
  schedule:
    # 15:30 Tehran Time (UTC+3:30) = 12:00 UTC
    # Saturday to Wednesday in Tehran = Saturday to Wednesday in UTC (Days 6,0,1,2,3)
    # Excludes Thursday (Day 4 in UTC) and Friday (Day 5 in UTC)
    - cron: '0 12 * * 0,1,2,3,6'
  workflow_dispatch: # Allows 1-click manual trigger

permissions:
  contents: write # Allows committing back updated backup and session states to branch 50

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Browsers and System Deps
        run: |
          playwright install chromium --with-deps

      - name: Run EasyTrader Automation
        env:
          EASYTRADER_USER: ${{ secrets.EASYTRADER_USER }}
          EASYTRADER_PASS: ${{ secrets.EASYTRADER_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANTLE_FINGERPRINT: ${{ secrets.MANTLE_FINGERPRINT }}
        run: |
          python easytrader_automation.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if there are changes in backup or session files to commit
          git add gold5/gold5_backup.json
          if [ -f "gold5/easytrader_session.json" ]; then
            git add gold5/easytrader_session.json
          fi

          if git diff-index --quiet HEAD --; then
            echo "No changes in files. Skipping commit."
          else
            git commit -m "chore(sync): automated update of daily percent, history and session cookies"
            git push origin HEAD
            echo "Successfully pushed updated files to GitHub repository."
          fi
