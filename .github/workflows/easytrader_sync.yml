name: Daily EasyTrader Sync (Funds 4 & 5)

on:
  schedule:
    # 15:30 Tehran Time:
    # Tehran Standard Time (UTC+3:30) => 12:00 UTC ('0 12 * * *')
    # Tehran Daylight Saving Time (UTC+4:30) => 11:00 UTC ('0 11 * * *')
    - cron: '0 12 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows 1-click manual trigger

permissions:
  contents: read  # هیچ کامیتی به این مخزن نمی‌شود

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Browsers and System Deps
        run: |
          playwright install chromium --with-deps

      - name: Run EasyTrader Automation
        env:
          EASYTRADER_USER: ${{ secrets.EASYTRADER_USER }}
          EASYTRADER_PASS: ${{ secrets.EASYTRADER_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANTLE_FINGERPRINT: ${{ secrets.MANTLE_FINGERPRINT }}
        run: |
          python easytrader_automation.py

      # بکاپ‌ها مستقیم به مخزن خصوصی می‌روند (این مخزن عمومی است).
      # فایل نشست عمداً آپلود نمی‌شود: شامل کوکی‌های زندهٔ Identity.Application است.
      - name: Upload Backups to Private Repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: python scripts/upload_backups_private.py

      - name: Remove Session State (never leave credentials on disk)
        if: always()
        run: rm -f gold5/easytrader_session.json