<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت آرامش | مینیمال و ساده</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="theme-color" content="#e0eafc">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            direction: rtl;
            background: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255,255,255,0.5) inset;
            padding: 24px;
            position: relative;
        }

        /* منوی همبرگری */
        .menu-container {
            position: absolute;
            left: 24px;
            top: 24px;
            z-index: 20;
        }
        .menu-btn {
            background: rgba(255,255,240,0.7);
            backdrop-filter: blur(4px);
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 60px;
            transition: 0.2s;
        }
        .menu-btn:hover { background: rgba(255,245,220,0.9); transform: scale(0.96);}
        .dropdown-menu {
            display: none;
            position: absolute;
            left: 0;
            top: 58px;
            background: rgba(255, 255, 245, 0.98);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 190px;
            overflow: hidden;
            border: 1px solid rgba(255,215,180,0.6);
        }
        .dropdown-menu button {
            width: 100%;
            padding: 12px 18px;
            text-align: right;
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            border-bottom: 1px solid #ffe0cc;
        }
        .dropdown-menu button:last-child { border-bottom: none; }
        .dropdown-menu button:hover { background: #fff2e6; }
        .menu-container.show .dropdown-menu { display: block; }

        /* شمارنده بدون پس‌زمینه */
        .counter-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .counter-card {
            background: transparent;
            padding: 6px 20px;
            border-radius: 80px;
            display: inline-flex;
            align-items: baseline;
            gap: 12px;
        }
        .counter-label {
            color: #5a7a76;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .counter-number {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3e6b67, #c97e5a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            transition: transform 0.2s;
            display: inline-block;
        }
        .counter-number.animate { animation: bouncePop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1); }
        @keyframes bouncePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(1); }
        }

        header h1 {
            text-align: center;
            color: #3b5c5a;
            margin-bottom: 8px;
            font-size: 1.7rem;
            font-weight: 600;
        }

        /* ===== دکمه ثبت آرامش ساده و بی‌انیمیشن ===== */
        .record-button {
            background: #7fc1c5;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 500;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px auto 30px auto;
            cursor: pointer;
            transition: background 0.2s;
            width: fit-content;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .record-button:hover {
            background: #5fa3a7;
        }
        .record-button:active {
            transform: scale(0.97);
        }
        .record-button i {
            font-size: 1.3rem;
        }

        .records-section, .trash-section {
            background: rgba(255, 251, 245, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .day-box {
            background: #ffffffdd;
            border-radius: 24px;
            margin-bottom: 18px;
            border: 1px solid #ffe4ce;
            overflow: hidden;
        }
        .day-header {
            background: #fef1e2;
            padding: 10px 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .peace-records-list-day {
            list-style: none;
            max-height: 330px;
            overflow-y: auto;
        }
        .peace-records-list-day::-webkit-scrollbar { width: 5px; }
        .peace-records-list-day::-webkit-scrollbar-track { background: #f1dfd0; border-radius: 10px; }
        .peace-records-list-day::-webkit-scrollbar-thumb { background: #c09b7a; border-radius: 10px; }
        .peace-records-list-day li {
            padding: 14px 18px;
            border-bottom: 1px solid #f5e4d4;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .record-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-left-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .record-time {
            background: #f4e8dc;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
        }
        .note-text {
            font-size: 0.8rem;
            color: #7b5e4a;
            background: #fff7ef;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            max-width: 100%;
            word-break: break-word;
            margin-top: 6px;
        }
        .note-preview {
            font-size: 0.7rem;
            color: #a07a5c;
            margin-right: 8px;
            font-style: italic;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .edit-note-btn, .delete-button {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
        }
        .edit-note-btn { color: #a07652; }
        .edit-note-btn:hover { color: #e07a5f; }
        .delete-button { color: #bc8f7a; }
        .delete-button:hover { color: #c54c38; }

        .time-infos {
            display: flex;
            gap: 14px;
            font-size: 0.7rem;
            flex-wrap: wrap;
        }
        .badge-since-last, .badge-since-now {
            padding: 3px 12px;
            border-radius: 50px;
        }
        .badge-since-last { background: #e2efea; color: #3f6b5e; }
        .badge-since-now { background: #fff0e2; }
        .fun-message { color: #b9623c; margin-right: 6px; }
        .load-more-btn {
            background: #ebe0d0;
            border: none;
            padding: 8px 18px;
            border-radius: 50px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .trash-section { display: none; }
        .no-data-message { text-align: center; color: #99b7ac; padding: 28px; }
        footer { text-align: center; font-size: 0.7rem; margin-top: 25px; color: #87aca0; }
        #restore-file-input { display: none; }

        /* مودال یادداشت */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fffef7;
            border-radius: 36px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.15);
            text-align: center;
        }
        .modal-content textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-family: inherit;
            border-radius: 24px;
            border: 1px solid #f0dbc8;
            margin: 15px 0;
            resize: vertical;
            font-size: 0.9rem;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .modal-buttons button {
            padding: 8px 24px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .save-note-btn { background: #e07a5f; color: white; }
        .cancel-note-btn { background: #e0d6ca; }
    </style>
</head>
<body>
<div class="container">
    <div class="menu-container" id="menuContainer">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="dropdown-menu">
            <button id="trash-button-main">🗑️ سطل زباله</button>
            <button id="backup-button">📥 بکاپ گرفتن</button>
            <button id="restore-button-main">📤 بازیابی اطلاعات</button>
        </div>
    </div>

    <header><h1>🌸 آرامش‌سنج</h1></header>

    <div class="counter-wrapper">
        <div class="counter-card">
            <span class="counter-label">کل آرامش‌ها</span>
            <span class="counter-number" id="totalCounter">0</span>
        </div>
    </div>

    <main>
        <!-- دکمه ساده و بدون انیمیشن -->
        <button id="record-button" class="record-button">
            🌸 ثبت آرامش جدید
        </button>

        <section id="records-section" class="records-section">
            <h2 style="margin-bottom:14px;">📦 محفظه روزها</h2>
            <div id="peace-records-container"></div>
            <div id="no-records-message" class="no-data-message" style="display:none;">هنوز آرامشی ثبت نشده 🌱</div>
            <button id="load-more-btn" class="load-more-btn" style="display: none;">⬇️ نمایش بیشتر (۱۰ تای بعدی)</button>
        </section>

        <section id="trash-section" class="trash-section">
            <h2>🗑️ سطل زباله</h2>
            <ul id="trash-list" style="list-style:none;"></ul>
            <div id="no-trash-message" class="no-data-message" style="display:none;">خالی 🕊️</div>
            <button id="toggle-trash-button" class="load-more-btn">↩️ برگشت</button>
        </section>
        <input type="file" id="restore-file-input" accept=".json">
    </main>
    <footer>✍️ هر ثبت قابلیت یادداشت دارد | بدون انیمیشن اضافی</footer>
</div>

<div id="noteModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:10px;">✍️ یادداشت آرامش</h3>
        <textarea id="noteInput" placeholder="مثلاً: کنار پنجره بودم، بارون می‌بارید..."></textarea>
        <div class="modal-buttons">
            <button class="save-note-btn" id="saveNoteBtn">ذخیره</button>
            <button class="cancel-note-btn" id="cancelNoteBtn">انصراف</button>
        </div>
    </div>
</div>

<script>
    (function(){
        let peaceRecords = [], trashRecords = [];
        let visibleCount = 10;
        let currentEditingTimestamp = null;

        function normalizeRecords(records) {
            return records.filter(r => r && r.dateTime).map(r => ({
                dateTime: r.dateTime,
                timestamp: r.timestamp || new Date().getTime() - Math.floor(Math.random()*100000000),
                note: r.note || ""
            }));
        }
        function loadFromStorage() {
            let p = localStorage.getItem('peaceRecords');
            let t = localStorage.getItem('trashRecords');
            peaceRecords = p ? normalizeRecords(JSON.parse(p)) : [];
            trashRecords = t ? normalizeRecords(JSON.parse(t)) : [];
        }
        function saveAll() {
            localStorage.setItem('peaceRecords', JSON.stringify(peaceRecords));
            localStorage.setItem('trashRecords', JSON.stringify(trashRecords));
            updateTotalCounter();
        }

        function updateTotalCounter() {
            const counterSpan = document.getElementById('totalCounter');
            if(!counterSpan) return;
            const newVal = peaceRecords.length;
            const oldVal = parseInt(counterSpan.innerText);
            counterSpan.innerText = newVal;
            if(newVal !== oldVal) {
                counterSpan.classList.remove('animate');
                void counterSpan.offsetWidth;
                counterSpan.classList.add('animate');
                setTimeout(() => counterSpan.classList.remove('animate'), 300);
            }
        }

        function toPersianFull(date) {
            let persianDate = date.toLocaleDateString('fa-IR-u-ca-persian', { year:'numeric', month:'2-digit', day:'2-digit' });
            let time = date.toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
            return { full: `${persianDate} ${time}` };
        }
        function timeAgo(timestamp) {
            let diff = (Date.now() - timestamp) / 1000;
            if(diff < 0) return "همین الان";
            if(diff < 60) return `${Math.floor(diff)} ثانیه پیش`;
            let m = Math.floor(diff/60);
            if(m < 60) return `${m} دقیقه پیش`;
            let h = Math.floor(m/60);
            if(h < 24) return `${h} ساعت پیش`;
            let d = Math.floor(h/24);
            if(d < 7) return `${d} روز پیش`;
            let w = Math.floor(d/7);
            if(w < 4) return `${w} هفته پیش`;
            let mon = Math.floor(d/30);
            return `${mon} ماه پیش`;
        }
        function funMessageBasedOnNow(timestamp) {
            let diffDays = (Date.now() - timestamp) / (1000*3600*24);
            if(diffDays < 0.04) return "همون الان آرامش گرفتی 😌";
            if(diffDays < 1) return "امروز یادت بود 🌙";
            if(diffDays < 2) return "دیروز آرامش بود 🌼";
            if(diffDays < 7) return `${Math.floor(diffDays)} روز پیش، هنوز قشنگه 🫀`;
            if(diffDays < 30) return `${Math.floor(diffDays)} روز گذشته... داری بهش فکر می‌کنی؟ 🤔`;
            return "چند ماه پیش... آرامش همیشه با توست ✨";
        }
        function sincePrevText(prevTs, currentTs) {
            let diffSec = Math.abs(prevTs - currentTs) / 1000;
            if(diffSec < 60) return `${Math.floor(diffSec)} ثانیه بعد`;
            let m = Math.floor(diffSec/60);
            if(m < 60) return `${m} دقیقه بعد`;
            let h = Math.floor(m/60);
            if(h < 24) return `${h} ساعت بعد`;
            let d = Math.floor(h/24);
            return `${d} روز بعد`;
        }
        function groupByDate(records){
            let groups = {};
            records.forEach(r => { let date = r.dateTime.split(' ')[0]; if(!groups[date]) groups[date]=[]; groups[date].push(r); });
            return groups;
        }

        function openNoteModal(timestamp, currentNote) {
            currentEditingTimestamp = timestamp;
            document.getElementById('noteInput').value = currentNote || "";
            document.getElementById('noteModal').style.display = 'flex';
        }
        function closeNoteModal() { document.getElementById('noteModal').style.display = 'none'; currentEditingTimestamp = null; }
        function saveCurrentNote() {
            if(currentEditingTimestamp === null) return;
            const newNote = document.getElementById('noteInput').value;
            const record = peaceRecords.find(r => r.timestamp === currentEditingTimestamp);
            if(record) { record.note = newNote; saveAll(); renderLimitedPeaceList(); }
            closeNoteModal();
        }

        function renderLimitedPeaceList() {
            const container = document.getElementById('peace-records-container');
            const noMsg = document.getElementById('no-records-message');
            const loadMoreBtn = document.getElementById('load-more-btn');
            if(!container) return;
            container.innerHTML = '';
            if(!peaceRecords.length) { noMsg.style.display='block'; loadMoreBtn.style.display='none'; return; }
            noMsg.style.display='none';
            const limited = peaceRecords.slice(0, visibleCount);
            const grouped = groupByDate(limited);
            for(let [date, items] of Object.entries(grouped)) {
                const dayBox = document.createElement('div'); dayBox.className='day-box';
                const header = document.createElement('div'); header.className='day-header';
                header.innerHTML = `<span>📆 ${date}</span><span>${items.length} لحظه</span>`;
                const ul = document.createElement('ul'); ul.className='peace-records-list-day';
                items.forEach(item => {
                    const globalIdx = peaceRecords.findIndex(r => r.timestamp === item.timestamp);
                    let sincePrevHtml = '';
                    if(globalIdx > 0 && peaceRecords[globalIdx-1]?.timestamp){
                        sincePrevHtml = `<span class="badge-since-last">⏪ ${sincePrevText(peaceRecords[globalIdx-1].timestamp, item.timestamp)}</span>`;
                    }
                    let nowAgo = timeAgo(item.timestamp);
                    let funMsg = funMessageBasedOnNow(item.timestamp);
                    const notePreview = item.note ? `<div class="note-text">📝 ${item.note.length > 50 ? item.note.substring(0,50)+'...' : item.note}</div>` : '';
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="record-main-row">
                            <div class="record-left-info">
                                <span class="record-time">🕊️ ${item.dateTime.split(' ')[1]}</span>
                                ${item.note ? '<span class="note-preview">📌 یادداشت</span>' : ''}
                            </div>
                            <div class="action-buttons">
                                <button class="edit-note-btn" data-ts="${item.timestamp}" title="افزودن/ویرایش یادداشت">✏️</button>
                                <button class="delete-button" data-ts="${item.timestamp}" title="حذف">🗑️</button>
                            </div>
                        </div>
                        ${notePreview}
                        <div class="time-infos">
                            <span class="badge-since-now">📅 نسبت به الان: ${nowAgo} <span class="fun-message">${funMsg}</span></span>
                            ${sincePrevHtml}
                        </div>
                    `;
                    ul.appendChild(li);
                });
                dayBox.appendChild(header); dayBox.appendChild(ul);
                container.appendChild(dayBox);
            }
            if(peaceRecords.length > visibleCount) loadMoreBtn.style.display = 'flex';
            else loadMoreBtn.style.display = 'none';
            attachEvents();
        }

        function attachEvents() {
            document.querySelectorAll('.delete-button').forEach(btn => {
                btn.removeEventListener('click', handleDelete);
                btn.addEventListener('click', handleDelete);
            });
            document.querySelectorAll('.edit-note-btn').forEach(btn => {
                btn.removeEventListener('click', handleEditNote);
                btn.addEventListener('click', handleEditNote);
            });
        }
        function handleDelete(e) {
            let ts = parseInt(e.currentTarget.dataset.ts);
            let idx = peaceRecords.findIndex(r => r.timestamp === ts);
            if(idx !== -1){
                let moved = peaceRecords.splice(idx,1)[0];
                trashRecords.unshift(moved);
                saveAll();
                if(visibleCount > peaceRecords.length) visibleCount = peaceRecords.length;
                renderLimitedPeaceList();
                renderTrashList();
            }
        }
        function handleEditNote(e) {
            let ts = parseInt(e.currentTarget.dataset.ts);
            let record = peaceRecords.find(r => r.timestamp === ts);
            if(record) openNoteModal(ts, record.note);
        }

        function loadMore() {
            if(visibleCount + 10 <= peaceRecords.length) visibleCount += 10;
            else visibleCount = peaceRecords.length;
            renderLimitedPeaceList();
        }

        function renderTrashList() {
            const trashUl = document.getElementById('trash-list');
            const noTrash = document.getElementById('no-trash-message');
            trashUl.innerHTML = '';
            if(!trashRecords.length){ noTrash.style.display='block'; return; }
            noTrash.style.display='none';
            trashRecords.forEach((rec, idx) => {
                let li = document.createElement('li');
                li.style.padding='12px'; li.style.borderBottom='1px solid #f0e0ce';
                li.style.display='flex'; li.style.justifyContent='space-between';
                li.innerHTML = `<span>📌 ${rec.dateTime} ${rec.note ? `📝 ${rec.note.substring(0,30)}` : ''}</span>
                    <div><button class="restore-btn" data-idx="${idx}">↩️</button>
                    <button class="perm-delete-btn" data-idx="${idx}" style="margin-right:15px;">✖️</button></div>`;
                trashUl.appendChild(li);
            });
            document.querySelectorAll('.restore-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let i = parseInt(btn.dataset.idx);
                    let restored = trashRecords.splice(i,1)[0];
                    peaceRecords.unshift(restored);
                    saveAll();
                    visibleCount = Math.min(10, peaceRecords.length);
                    renderLimitedPeaceList();
                    renderTrashList();
                });
            });
            document.querySelectorAll('.perm-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let i = parseInt(btn.dataset.idx);
                    trashRecords.splice(i,1);
                    saveAll(); renderTrashList();
                });
            });
        }

        function addPeace() {
            let now = new Date();
            let { full } = toPersianFull(now);
            peaceRecords.unshift({ dateTime: full, timestamp: now.getTime(), note: "" });
            saveAll();
            visibleCount = Math.min(10, peaceRecords.length);
            renderLimitedPeaceList();
        }

        function backup() {
            let data = { peaceRecords, trashRecords };
            let blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `peace_simple_${Date.now()}.json`;
            a.click(); URL.revokeObjectURL(a.href);
        }
        function restore(file){
            let reader = new FileReader();
            reader.onload = e => {
                try{
                    let json = JSON.parse(e.target.result);
                    if(json.peaceRecords && json.trashRecords){
                        peaceRecords = normalizeRecords(json.peaceRecords);
                        trashRecords = normalizeRecords(json.trashRecords);
                        saveAll();
                        visibleCount = Math.min(10, peaceRecords.length);
                        renderLimitedPeaceList();
                        renderTrashList();
                        alert('🎉 بازیابی موفق');
                    } else alert('فایل بکاپ نامعتبر');
                }catch(e){ alert('خطا در باز کردن فایل');}
                document.getElementById('restore-file-input').value = '';
            };
            reader.readAsText(file);
        }

        // منو و UI
        const menuContainer = document.getElementById('menuContainer');
        const menuBtn = document.getElementById('menuBtn');
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menuContainer.classList.toggle('show'); });
        document.addEventListener('click', (e) => { if(!menuContainer.contains(e.target)) menuContainer.classList.remove('show'); });
        const recordsSec = document.getElementById('records-section');
        const trashSec = document.getElementById('trash-section');
        const trashMain = document.getElementById('trash-button-main');
        const toggleTrash = document.getElementById('toggle-trash-button');
        function showTrash() { recordsSec.style.display='none'; trashSec.style.display='block'; menuContainer.classList.remove('show');}
        function hideTrash() { recordsSec.style.display='block'; trashSec.style.display='none'; }

        loadFromStorage();
        visibleCount = Math.min(10, peaceRecords.length);
        renderLimitedPeaceList(); renderTrashList(); hideTrash();
        updateTotalCounter();

        document.getElementById('record-button').onclick = addPeace;
        trashMain.onclick = showTrash;
        toggleTrash.onclick = hideTrash;
        document.getElementById('backup-button').onclick = backup;
        document.getElementById('restore-button-main').onclick = () => document.getElementById('restore-file-input').click();
        document.getElementById('restore-file-input').onchange = (e) => e.target.files[0] && restore(e.target.files[0]);
        document.getElementById('load-more-btn').onclick = loadMore;
        document.getElementById('saveNoteBtn').onclick = saveCurrentNote;
        document.getElementById('cancelNoteBtn').onclick = closeNoteModal;
        window.onclick = (e) => { if(e.target === document.getElementById('noteModal')) closeNoteModal(); };
    })();
</script>
</body>
</html>
