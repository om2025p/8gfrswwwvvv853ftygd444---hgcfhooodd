<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت آرامش</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="theme-color" content="#f8f8f8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* استایل‌های CSS (style.css) */
        /* Reset پایه‌ای برای سازگاری بیشتر مرورگرها */
        body, h1, h2, h3, p, ul, li, button, input, div, section {
            margin: 0;
            padding: 0;
            border: 0;
            font-size: 100%;
            font: inherit;
            vertical-align: baseline;
            list-style: none;
            box-sizing: border-box; /* برای اینکه padding و border در اندازه عنصر لحاظ شوند */
        }

        body {
            font-family: 'Vazirmatn', sans-serif; /* فونت خوانا و زیبا. فونت وزیرمتن را اضافه کنید */
            direction: rtl; /* راست به چپ برای فارسی */
            background-color: #f8f8f8; /* خاکستری روشن */
            color: #333; /* متن تیره */
            line-height: 1.6;
            min-height: 100vh; /* حداقل ارتفاع 100% صفحه نمایش */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            padding-bottom: 60px; /* فضا برای فوتر */
        }

        .container {
            width: 100%;
            max-width: 600px; /* حداکثر عرض برای موبایل */
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05); /* سایه ظریف */
            display: flex;
            flex-direction: column;
            align-items: stretch; /* عناصر به عرض ظرف کشیده شوند */
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #555;
            font-weight: bold;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 20px; /* فاصله بین بخش‌های اصلی */
        }

        .record-button {
            background-color: #a8dadc; /* آبی روشن */
            color: #fff;
            font-size: 1.2em;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            align-self: center; /* دکمه در مرکز افقی */
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .record-button:hover {
            background-color: #457b9d; /* آبی تیره‌تر در هاور */
        }

        .records-section, .trash-section {
            background-color: #f0f0f0; /* خاکستری خیلی روشن برای پس‌زمینه بخش‌ها */
            padding: 20px;
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.03); /* سایه داخلی ظریف */
        }

        .records-section h2, .trash-section h2 {
            color: #555;
            font-size: 1.4em;
            margin-bottom: 15px;
            text-align: center;
        }

        .peace-records-list-container {
            max-height: 300px; /* ارتفاع حداکثر برای لیست */
            overflow-y: auto; /* اسکرول عمودی در صورت نیاز */
            padding-right: 10px; /* برای جلوگیری از پوشیده شدن اسکرول‌بار توسط سایه داخلی */
        }

        .day-box {
            margin-bottom: 15px;
            border: 1px solid #ddd; /* بوردر خاکستری روشن برای باکس روزانه */
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03); /* سایه ظریف برای باکس روزانه */
            overflow: hidden; /* برای جلوگیری از بیرون زدن بوردر-ردیوس از محتوا */
        }

        .day-header {
            background-color: #e0e0e0; /* پس‌زمینه روشن‌تر برای هدر روزانه */
            color: #555;
            padding: 10px 15px;
            text-align: right;
            border-bottom: 1px solid #ddd; /* بوردر پایین برای جدا کردن هدر از لیست */
            font-weight: bold;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex; /* برای چیدمان تاریخ و تعداد در یک خط */
            justify-content: space-between; /* فاصله بین تاریخ و تعداد */
            align-items: center; /* مرکز عمودی آیتم‌ها */
        }

        .day-header-count {
            font-size: 0.9em; /* اندازه فونت کوچکتر برای تعداد */
            color: #777; /* رنگ خاکستری ملایم برای تعداد */
        }

        .peace-records-list-day {
            padding-left: 0; /* حذف تورفتگی پیش‌فرض لیست */
        }

        .peace-records-list-day li {
            background-color: #fff;
            padding: 10px 15px;
            margin-bottom: 0; /* حذف margin-bottom از li در لیست روزانه */
            border-radius: 0; /* حذف border-radius از li در لیست روزانه */
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: none; /* حذف box-shadow از li در لیست روزانه */
            border-bottom: 1px solid #eee; /* خط جداکننده بین آیتم‌های لیست روزانه */
            flex-direction: column; /* تغییر به ستونی برای تاریخ و زمان و زمان سپری شده */
            align-items: flex-end; /* راست‌چین کردن محتوا در آیتم لیست */
        }

        .peace-records-list-day li:last-child {
            border-bottom: none; /* حذف بوردر پایین برای آخرین آیتم لیست روزانه */
            border-bottom-left-radius: 10px; /* ردیوس پایین چپ برای آخرین آیتم لیست روزانه */
            border-bottom-right-radius: 10px; /* ردیوس پایین راست برای آخرین آیتم لیست روزانه */
        }

        .trash-list li:last-child {
            border-bottom-left-radius: 10px; /* ردیوس پایین چپ برای آخرین آیتم لیست روزانه */
            border-bottom-right-radius: 10px; /* ردیوس پایین راست برای آخرین آیتم لیست روزانه */
        }

        .record-item-date-time {
            flex-grow: 1; /* تاریخ و زمان فضای بیشتری بگیرند */
            text-align: right; /* راست‌چین کردن متن */
            margin-bottom: 5px; /* فاصله از زمان سپری شده */
        }

        .record-item-elapsed-time-between {
            font-size: 0.9em; /* اندازه فونت کوچکتر برای زمان سپری شده */
            color: #777; /* رنگ خاکستری ملایم برای زمان سپری شده */
            text-align: left; /* چپ‌چین کردن متن زمان سپری شده */
            direction: ltr; /* چپ به راست برای اعداد انگلیسی در زمان سپری شده */
        }

        .record-item-actions, .trash-item-actions {
            display: flex;
            gap: 10px;
            align-self: flex-start; /* دکمه‌های اکشن در بالا سمت راست */
        }

        .delete-button, .restore-button, .permanent-delete-button {
            background: none;
            border: none;
            cursor: pointer;
            color: #aaa; /* خاکستری ملایم برای آیکون‌ها */
            font-size: 1em;
            transition: color 0.3s ease;
        }

        .delete-button:hover {
            color: #e63946; /* قرمز برای حذف در هاور */
        }

        .restore-button:hover {
            color: #1d3557; /* آبی تیره برای بازیابی در هاور */
        }

        .permanent-delete-button:hover {
            color: #c23b22; /* قرمز تیره‌تر برای حذف دائمی در هاور */
        }

        .no-data-message {
            color: #777;
            font-style: italic;
            text-align: center;
            padding: 15px;
        }

        .trash-button-main, .toggle-trash-button, .backup-button, .restore-button-main {
            background-color: #ffedd1; /* زرد ملایم برای دکمه سطل زباله و بکاپ/بازیابی */
            color: #555;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            align-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            font-size: 1em;
            margin-bottom: 10px; /* فاصله از پایین */
        }

        .trash-button-main:hover, .toggle-trash-button:hover, .backup-button:hover, .restore-button-main:hover {
            background-color: #ffe0b2; /* زرد تیره‌تر در هاور */
        }

        .trash-section {
            display: none; /* به صورت پیش‌فرض مخفی */
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            margin-top: auto; /* فوتر به پایین صفحه بچسبد */
        }

        /* واکنش‌گرا برای صفحه‌های کوچک‌تر */
        @media (max-width: 500px) {
            .container {
                border-radius: 0; /* حذف گردی لبه‌ها در صفحه‌های خیلی کوچک */
                box-shadow: none; /* حذف سایه در صفحه‌های خیلی کوچک */
                padding: 10px;
            }

            .record-button {
                font-size: 1em;
                padding: 12px 25px;
            }

            .records-section h2, .trash-section h2 {
                font-size: 1.2em;
            }

            .peace-records-list-day li, .trash-list li {
                padding: 8px 12px;
                font-size: 0.95em;
            }

            .trash-button-main, .toggle-trash-button, .backup-button, .restore-button-main {
                font-size: 0.9em;
                padding: 8px 15px;
            }
        }

        /* استایل‌های اضافی برای دکمه‌های بکاپ و بازیابی */
        .backup-restore-buttons-container {
            display: flex;
            justify-content: center; /* مرکز افقی دکمه‌ها */
            gap: 10px; /* فاصله بین دکمه‌ها */
            margin-bottom: 20px; /* فاصله از پایین */
        }

        #restore-file-input {
            display: none; /* مخفی کردن input file پیش‌فرض */
        }
        .restore-button-main {
            cursor: pointer; /* اطمینان از نمایش نشانگر pointer */
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ثبت آرامش</h1>
        </header>

        <main>
            <button id="record-button" class="record-button">
                <i class="fa-solid fa-heart-circle-plus"></i> ثبت آرامش
            </button>

            <section id="records-section" class="records-section">
                <h2>لیست ثبت‌ها</h2>
                <div class="peace-records-list-container">
                    <ul id="peace-records-list" class="peace-records-list">
                        <li id="no-records-message" style="display: none;" class="no-data-message">هنوز آرامشی ثبت نشده.</li>
                    </ul>
                </div>
            </section>

            <section id="trash-section" class="trash-section" style="display: none;">
                <h2>سطل زباله</h2>
                <ul id="trash-list" class="trash-list">
                    <li id="no-trash-message" style="display: none;" class="no-data-message">سطل زباله خالی است.</li>
                </ul>
                <button id="toggle-trash-button" class="toggle-trash-button">بازگشت به لیست ثبت‌ها</button>
            </section>

            <div class="backup-restore-buttons-container">
                <button id="backup-button" class="backup-button">
                    <i class="fa-solid fa-download"></i> بکاپ اطلاعات
                </button>
                <button id="restore-button-main" class="restore-button-main">
                    <i class="fa-solid fa-upload"></i> بازیابی اطلاعات
                </button>
                <input type="file" id="restore-file-input" accept=".json">
            </div>

            <button id="trash-button-main" class="trash-button-main">
                <i class="fa-solid fa-trash-can"></i> سطل زباله
            </button>
        </main>

        <footer>
            <p>&copy; 1403 پلتفرم ثبت آرامش</p>
        </footer>
    </div>

    <script>
        // کدهای JavaScript (script.js)
        document.addEventListener('DOMContentLoaded', function() {
            const recordButton = document.getElementById('record-button');
            const peaceRecordsList = document.getElementById('peace-records-list');
            const noRecordsMessage = document.getElementById('no-records-message');
            const recordsSection = document.getElementById('records-section');
            const trashSection = document.getElementById('trash-section');
            const trashButtonMain = document.getElementById('trash-button-main');
            const toggleTrashButton = document.getElementById('toggle-trash-button');
            const trashList = document.getElementById('trash-list');
            const noTrashMessage = document.getElementById('no-trash-message');
            const backupButton = document.getElementById('backup-button');
            const restoreButtonMain = document.getElementById('restore-button-main');
            const restoreFileInput = document.getElementById('restore-file-input');

            let peaceRecords = loadRecords('peaceRecords') || [];
            let trashRecords = loadRecords('trashRecords') || [];

            renderPeaceRecordsList();
            renderTrashList();

            recordButton.addEventListener('click', recordPeace);
            trashButtonMain.addEventListener('click', showTrashSection);
            toggleTrashButton.addEventListener('click', hideTrashSection);
            backupButton.addEventListener('click', backupData);
            restoreButtonMain.addEventListener('click', function() {
                restoreFileInput.click(); // باز کردن پنجره انتخاب فایل با کلیک روی دکمه "بازیابی اطلاعات"
            });
            restoreFileInput.addEventListener('change', restoreData);

            function recordPeace() {
                const now = new Date();
                const persianDate = toPersianDate(now);
                const timeString = toPersianTime(now);
                const dateTimeString = `${persianDate} ${timeString}`;
                const timestamp = now.getTime(); // ذخیره timestamp

                peaceRecords.unshift({ dateTime: dateTimeString, timestamp: timestamp }); // ذخیره هم dateTime و هم timestamp
                saveRecords('peaceRecords', peaceRecords);
                renderPeaceRecordsList();
            }

            function renderPeaceRecordsList() {
                peaceRecordsList.innerHTML = ''; // پاک کردن لیست قبلی

                if (peaceRecords.length === 0) {
                    noRecordsMessage.style.display = 'block';
                } else {
                    noRecordsMessage.style.display = 'none';

                    const groupedRecords = groupByDate(peaceRecords); // گروه‌بندی رکوردها بر اساس روز

                    for (const date in groupedRecords) {
                        if (groupedRecords.hasOwnProperty(date)) {
                            const dayRecords = groupedRecords[date];
                            const dayBox = document.createElement('div');
                            dayBox.classList.add('day-box');

                            const dayHeader = document.createElement('div');
                            dayHeader.classList.add('day-header');
                            dayHeader.textContent = date; // نمایش تاریخ به عنوان هدر باکس روزانه

                            const dayRecordCountSpan = document.createElement('span'); // ایجاد span برای نمایش تعداد
                            dayRecordCountSpan.classList.add('day-header-count');
                            dayRecordCountSpan.textContent = `(${dayRecords.length} ثبت)`; // تعداد ثبت‌ها در هدر
                            dayHeader.appendChild(dayRecordCountSpan); // اضافه کردن span تعداد به هدر

                            dayBox.appendChild(dayHeader);

                            const dayRecordList = document.createElement('ul');
                            dayRecordList.classList.add('peace-records-list-day'); // کلاس جدید برای لیست روزانه

                            dayRecords.forEach((record, indexInDay) => { // استفاده از indexInDay برای پیمایش رکوردهای روزانه
                                const listItem = document.createElement('li');
                                let elapsedTimeBetween = '';

                                // محاسبه زمان سپری شده نسبت به ثبت قبلی در کل لیست peaceRecords
                                const recordIndexInPeaceRecords = peaceRecords.findIndex(r => r === record); // پیدا کردن اندیس رکورد جاری در آرایه اصلی peaceRecords
                                if (recordIndexInPeaceRecords > 0) { // اگر رکورد، اولین رکورد نباشد
                                    const previousRecord = peaceRecords[recordIndexInPeaceRecords - 1];
                                    elapsedTimeBetween = calculateElapsedTimeBetween(record.timestamp, previousRecord.timestamp);
                                }

                                listItem.innerHTML = `
                                    <div class="record-item-actions">
                                        <button class="delete-button" data-index="${indexInDay}" data-date="${date}" title="حذف">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                    <span class="record-item-date-time">${record.dateTime.split(' ')[1]}</span>
                                    ${elapsedTimeBetween ? `<p class="record-item-elapsed-time-between">${elapsedTimeBetween}</p>` : ''}
                                `;
                                dayRecordList.appendChild(listItem);
                            });
                            dayBox.appendChild(dayRecordList);
                            peaceRecordsList.appendChild(dayBox); // اضافه کردن باکس روزانه به لیست اصلی
                        }
                    }

                    // اضافه کردن event listener برای دکمه‌های حذف بعد از ایجاد لیست روزانه
                    document.querySelectorAll('.peace-records-list-day .delete-button').forEach(button => {
                        button.addEventListener('click', function() {
                            const indexToDelete = parseInt(this.dataset.index);
                            const dateToDelete = this.dataset.date;
                            moveToTrash(indexToDelete, dateToDelete); // ارسال تاریخ به تابع moveToTrash
                        });
                    });
                }
            }

            function groupByDate(records) {
                const grouped = {};
                records.forEach(record => {
                    const date = record.dateTime.split(' ')[0]; // جدا کردن تاریخ از dateTimeString
                    if (!grouped[date]) {
                        grouped[date] = [];
                    }
                    grouped[date].push(record);
                });
                return grouped;
            }

            function moveToTrash(index, date) {
                const dayRecords = peaceRecords.filter(record => record.dateTime.startsWith(date)); // فیلتر کردن رکوردهای روز مورد نظر
                const recordIndexInDay = dayRecords.length - 1 - index; // محاسبه اندیس در آرایه فیلتر شده (چون لیست روزانه برعکس است)
                const recordToTrash = dayRecords[recordIndexInDay]; // پیدا کردن رکورد برای حذف
                const recordGlobalIndex = peaceRecords.indexOf(recordToTrash); // پیدا کردن اندیس رکورد در آرایه اصلی

                if (recordGlobalIndex > -1) {
                    peaceRecords.splice(recordGlobalIndex, 1); // حذف از لیست اصلی
                    trashRecords.unshift(recordToTrash); // اضافه کردن به سطل زباله
                    saveRecords('peaceRecords', peaceRecords);
                    saveRecords('trashRecords', trashRecords);
                    renderPeaceRecordsList();
                    renderTrashList();
                }
            }

            function showTrashSection() {
                trashSection.style.display = 'block';
                recordsSection.style.display = 'none';
                trashButtonMain.style.display = 'none';
            }

            function hideTrashSection() {
                trashSection.style.display = 'none';
                recordsSection.style.display = 'block';
                trashButtonMain.style.display = 'block';
            }

            function renderTrashList() {
                trashList.innerHTML = ''; // پاک کردن لیست قبلی

                if (trashRecords.length === 0) {
                    noTrashMessage.style.display = 'block';
                } else {
                    noTrashMessage.style.display = 'none';
                    trashRecords.forEach((record, index) => {
                        const listItem = document.createElement('li');
                        listItem.innerHTML = `
                            <span class="record-item-date-time">${record.dateTime}</span>
                            <div class="trash-item-actions">
                                <button class="restore-button" data-index="${index}" title="بازیابی">
                                    <i class="fa-solid fa-arrow-rotate-left"></i>
                                </button>
                                <button class="permanent-delete-button" data-index="${index}" title="حذف دائمی">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;
                        trashList.appendChild(listItem);
                    });

                    // اضافه کردن event listener برای دکمه‌های سطل زباله بعد از ایجاد لیست
                    trashList.querySelectorAll('.restore-button').forEach(button => {
                        button.addEventListener('click', function() {
                            const indexToRestore = parseInt(this.dataset.index);
                            restoreFromTrash(indexToRestore);
                        });
                    });
                    trashList.querySelectorAll('.permanent-delete-button').forEach(button => {
                        button.addEventListener('click', function() {
                            const indexToDeletePermanently = parseInt(this.dataset.index);
                            permanentlyDelete(indexToDeletePermanently);
                        });
                    });
                }
            }

            function restoreFromTrash(index) {
                const recordToRestore = trashRecords.splice(index, 1)[0]; // حذف از سطل زباله و دریافت آیتم
                peaceRecords.unshift(recordToRestore); // اضافه کردن به لیست اصلی
                saveRecords('peaceRecords', peaceRecords);
                saveRecords('trashRecords', trashRecords);
                renderPeaceRecordsList();
                renderTrashList();
            }

            function permanentlyDelete(index) {
                trashRecords.splice(index, 1); // حذف دائمی از سطل زباله
                saveRecords('trashRecords', trashRecords);
                renderTrashList();
            }

            function saveRecords(key, records) {
                localStorage.setItem(key, JSON.stringify(records));
            }

            function loadRecords(key) {
                const recordsJson = localStorage.getItem(key);
                return recordsJson ? JSON.parse(recordsJson) : null;
            }

            function toPersianDate(date) {
                const year = date.toLocaleDateString('fa-IR-u-ca-persian', { year: 'numeric' });
                const month = date.toLocaleDateString('fa-IR-u-ca-persian', { month: '2-digit' });
                const day = date.toLocaleDateString('fa-IR-u-ca-persian', { day: '2-digit' });
                return `${year}/${month}/${day}`;
            }

            function toPersianTime(date) {
                const hours = date.toLocaleTimeString('fa-IR', { hour: '2-digit', hour12: false, timeZone: 'Asia/Tehran' }); // وقت ایران
                const minutes = date.toLocaleTimeString('fa-IR', { minute: '2-digit', timeZone: 'Asia/Tehran' });
                return `${hours}:${minutes}`; // فرمت HH:mm
            }

            function backupData() {
                const backup = {
                    peaceRecords: peaceRecords,
                    trashRecords: trashRecords
                };
                const backupJson = JSON.stringify(backup);
                const blob = new Blob([backupJson], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = 'peace-records-backup.json'; // نام فایل بکاپ
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(url); // آزادسازی منابع
            }

            function restoreData(event) {
                const file = event.target.files[0];
                if (!file) {
                    return; // اگر فایلی انتخاب نشد
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const backupJson = e.target.result;
                        const backup = JSON.parse(backupJson);
                        if (backup.peaceRecords && backup.trashRecords) {
                            peaceRecords = backup.peaceRecords;
                            trashRecords = backup.trashRecords;
                            saveRecords('peaceRecords', peaceRecords);
                            saveRecords('trashRecords', trashRecords);
                            renderPeaceRecordsList();
                            renderTrashList();
                            alert('بازیابی اطلاعات با موفقیت انجام شد!');
                        } else {
                            alert('فایل بکاپ نامعتبر است.');
                        }
                    } catch (error) {
                        alert('خطا در خواندن یا پردازش فایل بکاپ.');
                        console.error('خطا در بازیابی اطلاعات:', error);
                    } finally {
                        restoreFileInput.value = ''; // ریست کردن input file برای رویداد change بعدی
                    }
                };
                reader.readAsText(file);
            }

            function calculateElapsedTimeBetween(currentTimestamp, nextTimestamp) {
                const diffInSeconds = Math.floor((nextTimestamp - currentTimestamp) / 1000);
                if (diffInSeconds < 60) {
                    return `${diffInSeconds} ثانیه گذشت`;
                }
                const diffInMinutes = Math.floor(diffInSeconds / 60);
                if (diffInMinutes < 60) {
                    return `${diffInMinutes} دقیقه گذشت`;
                }
                const diffInHours = Math.floor(diffInMinutes / 60);
                if (diffInHours < 24) {
                    return `${diffInHours} ساعت گذشت`;
                }
                const diffInDays = Math.floor(diffInHours / 24);
                return `${diffInDays} روز گذشت`;
            }
        });
    </script>
</body>
