    <script>
        // Decimal.js محلی برای کار آفلاین
        class EnhancedDecimal {
            constructor(value) {
                if (value instanceof EnhancedDecimal) {
                    this.value = parseFloat(value.value);
                } else if (typeof value === 'object' && value !== null && 'value' in value) {
                    this.value = parseFloat(value.value);
                } else {
                    this.value = parseFloat(value) || 0;
                }
            }

            plus(other) {
                return new EnhancedDecimal(this.value + new EnhancedDecimal(other).value);
            }

            minus(other) {
                return new EnhancedDecimal(this.value - new EnhancedDecimal(other).value);
            }

            times(other) {
                return new EnhancedDecimal(this.value * new EnhancedDecimal(other).value);
            }

            div(other) {
                const divisor = new EnhancedDecimal(other).value;
                return new EnhancedDecimal(divisor !== 0 ? this.value / divisor : 0);
            }

            pow(exponent) {
                return new EnhancedDecimal(Math.pow(this.value, new EnhancedDecimal(exponent).value));
            }

            isNegative() {
                return this.value < 0;
            }

            greaterThan(other) {
                return this.value > new EnhancedDecimal(other).value;
            }

            toNumber() {
                return this.value;
            }

            toFixed(decimals) {
                return this.value.toFixed(decimals);
            }

            static pow(base, exponent) {
                return new EnhancedDecimal(Math.pow(new EnhancedDecimal(base).value, new EnhancedDecimal(exponent).value));
            }

            ceil() {
                return new EnhancedDecimal(Math.ceil(this.value));
            }
        }

        // برای سازگاری با کد قبلی
        window.Decimal = EnhancedDecimal;
    </script>
    <style>

<body>

    <!-- دکمه جادویی برای باز کردن صفحه مجموع کل در تب جدید -->

    <div id="tabs-bar">
        <!-- منوی شیشه‌ای دسته‌بندی کشویی تب‌ها با تغییر جهت به بالا (Bottom-up Drawer) -->
        <div id="group-dropdown-container" style="position: relative; display: inline-block; flex-shrink: 0; margin-left: 5px; z-index: 1004;">
            <button id="group-dropdown-btn" style="background-color: #007bff; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 14px; width: auto; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; gap: 4px;">
                <span>📁 دسته‌ها</span>
                <span style="font-size: 0.7rem;">▲</span>
            </button>
            <div id="group-dropdown-menu" style="display: none; position: absolute; bottom: calc(100% + 10px); right: 0; width: 260px; background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(0,0,0,0.15); border-radius: 12px; box-shadow: 0 -10px 25px rgba(0,0,0,0.15); max-height: 350px; overflow-y: auto; z-index: 1005;">

    <script>
        // متغیرهای جهانی
        let tabCounter = 0;
        let activeTabId = null;
        const calculatorInstances = new Map();

        // تابع کمکی برای دریافت عناصر
        function getCalculatorElements(instanceElement) {
            return {
                watchSource: instanceElement.querySelector('.watchSource'),
                initialAmount: instanceElement.querySelector('.initialAmount'),
                years: instanceElement.querySelector('.years'),
                rate: instanceElement.querySelector('.rate'),
                rateType: instanceElement.querySelector('.rateType'),
                compoundFrequency: instanceElement.querySelector('.compoundFrequency'),
                customFrequency: instanceElement.querySelector('.customFrequency'),
                monthlyDeposit: instanceElement.querySelector('.monthlyDeposit'),
                annualIncreaseMonthlyDeposit: instanceElement.querySelector('.annualIncreaseMonthlyDeposit'),
                biMonthlyDeposit: instanceElement.querySelector('.biMonthlyDeposit'),
                calculateButton: instanceElement.querySelector('.calculateButton'),
                resetButton: instanceElement.querySelector('.resetButton'),
                historyButton: instanceElement.querySelector('.historyButton'),
                backupButton: instanceElement.querySelector('.backupButton'),
                restoreButton: instanceElement.querySelector('.restoreButton'),
                exportButton: instanceElement.querySelector('.exportButton'),
                importButton: instanceElement.querySelector('.importButton'),
                advancedOptionsButton: instanceElement.querySelector('.advancedOptionsButton'),
                result: instanceElement.querySelector('.result'),
                profit: instanceElement.querySelector('.profit'),
                netProfit: instanceElement.querySelector('.netProfit'),
                totalDeposits: instanceElement.querySelector('.totalDeposits'),
                effectiveRate: instanceElement.querySelector('.effectiveRate'),
                monthlyIncome: instanceElement.querySelector('.monthlyIncome'),
            };
        }

        // نمایش تاریخچه
        function showHistory() {
            const modal = document.getElementById('historyModal');
            const historyList = document.getElementById('historyList');

            let history = JSON.parse(localStorage.getItem("history")) || [];

            if (history.length === 0) {
                historyList.innerHTML = "<p>هیچ تاریخچه‌ای موجود نیست.</p>";
            } else {
                historyList.innerHTML = history.map((record, index) => `
                    <div class="history-record">
                        <strong>${record.date}</strong><br>
                        مبلغ اولیه: ${parseInt(record.initial).toLocaleString('fa-IR')} تومان<br>
                        مدت: ${record.years} سال<br>
                        نرخ سود: ${record.rate}%<br>
                        مبلغ نهایی: ${parseInt(record.final).toLocaleString('fa-IR')} تومان<br>
                        سود مرکب واقعی: ${record.effRate}%
                    </div>
                `).join('');
            }

            modal.style.display = "block";
        }

        // بستن مودال تاریخچه
        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = "none";
        }

        // اعمال تم
        function applyTheme() {
            const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.body.classList.toggle('dark', isDarkMode);

            calculatorInstances.forEach((instanceData, tabId) => {
                const container = instanceData.element;
                const buttons = container.querySelectorAll('button');

                container.classList.toggle('dark', isDarkMode);
                buttons.forEach(button => button.classList.toggle('dark', isDarkMode));
            });

            const tabsBar = document.getElementById('tabs-bar');
            if (tabsBar) {
                tabsBar.classList.toggle('dark', isDarkMode);
            }
        }

        // مدیریت نمایش فیلد فرکانس دلخواه
        function setupFrequencyField(instanceElement) {
            const elements = getCalculatorElements(instanceElement);
            if (!elements.customFrequency) return;

            const handleFrequencyChange = () => {
                if (elements.compoundFrequency.value === 'custom') {
                    elements.customFrequency.style.display = 'block';
                } else {
                    elements.customFrequency.style.display = 'none';
                }
            };

            elements.compoundFrequency.addEventListener('change', handleFrequencyChange);
            handleFrequencyChange();
        }

        // دریافت مقدار فرکانس ترکیب (تعداد بار در سال)
        function getCompoundFrequencyValue(elements) {
            if (elements.compoundFrequency.value === 'custom') {
                let customVal = parseInt(elements.customFrequency.value);
                if (isNaN(customVal) || customVal <= 0) {
                    customVal = 12; // پیش‌فرض ماهانه
                }
                return customVal;
            }
            return parseInt(elements.compoundFrequency.value);
        }

        // تابع کمکی جهت محاسبه سود میانگین روزانه از کلیدهای دیدبان درصدها
        function calculateWatchDailyAverage(watchKey) {
            let percentsList = [];
            try {
                let raw = localStorage.getItem(watchKey);
                if (raw) {
                    let parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        percentsList = parsed;
                    } else if (parsed && Array.isArray(parsed.percents)) {
                        percentsList = parsed.percents;
                    }
                } else if (watchKey === 'stock____________tas9yl_new_unified') {
                    let legacy = localStorage.getItem("stock____________tas9ylpercents");
                    if (legacy) percentsList = JSON.parse(legacy) || [];
                }
            } catch (e) {
                console.error("Error parsing watch source:", e);
            }

            if (!percentsList || percentsList.length === 0) return 0;

            let totalProfit = percentsList.reduce((s, p) => s + p.value, 0);
            let firstDate = new Date(percentsList[0].timestamp);
            let lastDate = new Date(percentsList[percentsList.length - 1].timestamp);

            let daysDiff = Math.max(1, Math.ceil((lastDate - firstDate) / (1000 * 60 * 60 * 24)));

            // محاسبه سود واقعی میانگین روزانه ثبت درصد بدون تقسیم بر ۵
            return (totalProfit / daysDiff);
        }

        // ذخیره ورودی‌ها
        function saveInputs(instanceElement, tabId) {
            const elements = getCalculatorElements(instanceElement);
            const data = {
                watchSource: elements.watchSource.value,
                initialAmount: elements.initialAmount.value,
                years: elements.years.value,
                rate: elements.rate.value,
                rateType: elements.rateType ? elements.rateType.value : 'annual',
                compoundFrequency: elements.compoundFrequency.value,
                customFrequency: elements.customFrequency ? elements.customFrequency.value : '',
                monthlyDeposit: elements.monthlyDeposit.value,
                annualIncreaseMonthlyDeposit: elements.annualIncreaseMonthlyDeposit.value,
                biMonthlyDeposit: elements.biMonthlyDeposit.value,
            };
            localStorage.setItem(`calculatorTab_${tabId}`, JSON.stringify(data));
        }

        // بارگذاری ورودی‌ها
        function loadInputs(instanceElement, tabId) {
            const elements = getCalculatorElements(instanceElement);
            const data = JSON.parse(localStorage.getItem(`calculatorTab_${tabId}`)) || {};

            elements.watchSource.value = data.watchSource || "none";
            elements.initialAmount.value = data.initialAmount || "";
            elements.years.value = data.years || "";
            elements.rate.value = data.rate || "";
            if (elements.rateType) {
                elements.rateType.value = data.rateType || "annual";
            }
            elements.compoundFrequency.value = data.compoundFrequency || "365";
            if (elements.customFrequency) {
                elements.customFrequency.value = data.customFrequency || "";
                setupFrequencyField(instanceElement);
            }
            elements.monthlyDeposit.value = data.monthlyDeposit || "";
            elements.annualIncreaseMonthlyDeposit.value = data.annualIncreaseMonthlyDeposit || "";
            elements.biMonthlyDeposit.value = data.biMonthlyDeposit || "";

            formatNumber(elements.initialAmount);
            formatNumber(elements.monthlyDeposit);
            formatNumber(elements.annualIncreaseMonthlyDeposit);
            formatNumber(elements.biMonthlyDeposit);

            // به روز رسانی قفل بودن فیلد سود و نوع نرخ سود در صورت اتصال به دیدبان
            handleWatchSync(instanceElement, tabId, false);
        }

        // اعمال پویای سود دیدبان بر ماشین‌حساب و قفل/باز کردن فیلدها
        function handleWatchSync(instanceElement, tabId, recalculate = true) {
            const elements = getCalculatorElements(instanceElement);
            const source = elements.watchSource.value;

            if (source && source !== 'none') {
                const avgDaily = calculateWatchDailyAverage(source);
                elements.rate.value = avgDaily.toFixed(3);
                if (elements.rateType) {
                    elements.rateType.value = 'daily';
                    elements.rateType.disabled = true;
                }
                elements.rate.disabled = true;
                elements.rate.style.backgroundColor = 'rgba(0, 123, 255, 0.08)';
                elements.rate.style.fontWeight = 'bold';
            } else {
                elements.rate.disabled = false;
                if (elements.rateType) {
                    elements.rateType.disabled = false;
                }
                elements.rate.style.backgroundColor = '';
                elements.rate.style.fontWeight = '';
            }

            if (recalculate) {
                saveInputs(instanceElement, tabId);
                updateCumulativeTotal();
                updateTabName(tabId, instanceElement);
                updateGroupDropdown();
            }
        }

        // قالب‌بندی عدد
        function formatNumber(input) {
            let value = input.value.replace(/,/g, "").replace(/\D/g, "");
            input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            const instanceElement = input.closest('.calculator-instance');
            const tabId = instanceElement ? instanceElement.dataset.tabId : null;
            if (tabId) saveInputs(instanceElement, tabId);
        }

        // تابع مشترک برای انجام محاسبات سود مرکب برای یک تب در یک دوره زمانی خاص
        function runCompoundingCalculation(data, targetYears) {
            let P_initial_principal = new Decimal(data.initialAmount.replace(/,/g, "") || 0);
            let t_years = new Decimal(targetYears || 0);
            let r_annual_rate_percent = new Decimal(data.rate || 0);

            // اگر سود روزانه وارد شده باشد، آن را ضرب در ۳۶۵ می‌کنیم تا به سود سالانه معادل تبدیل شود
            if (data.rateType === 'daily') {
                r_annual_rate_percent = r_annual_rate_percent.times(365);
            }

            let r_annual_rate_decimal = r_annual_rate_percent.div(100);

            let freqVal = 12; // پیش‌فرض ماهانه
            if (data.compoundFrequency !== 'custom') {
                freqVal = parseInt(data.compoundFrequency) || 12;
            } else {
                freqVal = parseInt(data.customFrequency) || 12;
                if (freqVal <= 0) freqVal = 12;
            }
            let n_compound_freq_per_year = new Decimal(freqVal);

            let Dm_initial_monthly_deposit = new Decimal(data.monthlyDeposit.replace(/,/g, "") || 0);
            let Dm_annual_increase = new Decimal(data.annualIncreaseMonthlyDeposit.replace(/,/g, "") || 0);
            let Db_bimonthly_deposit = new Decimal(data.biMonthlyDeposit.replace(/,/g, "") || 0);

            // نرخ سالانه موثر
            let effective_annual_rate = Decimal.pow(new Decimal(1).plus(r_annual_rate_decimal.div(n_compound_freq_per_year)), n_compound_freq_per_year).minus(1).times(100);
            let effective_annual_rate_decimal = effective_annual_rate.div(100);

            // 1. مقدار آتی سرمایه اولیه
            let A_final_amount = P_initial_principal.times(
                Decimal.pow(new Decimal(1).plus(r_annual_rate_decimal.div(n_compound_freq_per_year)), n_compound_freq_per_year.times(t_years))
            );

            let profit_earned_over_initial_P = A_final_amount.minus(P_initial_principal);

            // --- واریزهای ماهیانه ---
            let total_months_of_investment = t_years.times(12);
            let sum_of_actual_monthly_deposits_made = new Decimal(0);

            for (let k = 1; k <= total_months_of_investment.toNumber(); k++) {
                let current_year_of_deposit = new Decimal(k).div(12).ceil();

                let actual_monthly_deposit_this_period = Dm_initial_monthly_deposit;
                if (current_year_of_deposit.greaterThan(1) && Dm_annual_increase.greaterThan(0)) {
                     actual_monthly_deposit_this_period = actual_monthly_deposit_this_period.plus(
                        Dm_annual_increase.times(current_year_of_deposit.minus(1))
                    );
                }

                sum_of_actual_monthly_deposits_made = sum_of_actual_monthly_deposits_made.plus(actual_monthly_deposit_this_period);

                let time_of_deposit_in_years_tk = new Decimal(k).div(12);
                let compounding_periods_for_this_deposit = n_compound_freq_per_year.times(t_years).minus(n_compound_freq_per_year.times(time_of_deposit_in_years_tk));

                if (compounding_periods_for_this_deposit.isNegative()) {
                    compounding_periods_for_this_deposit = new Decimal(0);
                }

                let fv_of_this_monthly_deposit = actual_monthly_deposit_this_period.times(
                    Decimal.pow(new Decimal(1).plus(r_annual_rate_decimal.div(n_compound_freq_per_year)), compounding_periods_for_this_deposit)
                );

                A_final_amount = A_final_amount.plus(fv_of_this_monthly_deposit);
                profit_earned_over_initial_P = profit_earned_over_initial_P.plus(fv_of_this_monthly_deposit);
            }

            // --- واریزهای دو ماه یکبار ---
            let total_bimonthly_periods_in_investment = t_years.times(6);
            let sum_of_actual_bimonthly_deposits_made = new Decimal(0);

            for (let k = 1; k <= total_bimonthly_periods_in_investment.toNumber(); k++) {
                sum_of_actual_bimonthly_deposits_made = sum_of_actual_bimonthly_deposits_made.plus(Db_bimonthly_deposit);

                let time_of_deposit_in_years_tk = new Decimal(k).times(2).div(12);
                let compounding_periods_for_this_deposit = n_compound_freq_per_year.times(t_years).minus(n_compound_freq_per_year.times(time_of_deposit_in_years_tk));

                if (compounding_periods_for_this_deposit.isNegative()) {
                    compounding_periods_for_this_deposit = new Decimal(0);
                }

                let fv_of_this_bimonthly_deposit = Db_bimonthly_deposit.times(
                    Decimal.pow(new Decimal(1).plus(r_annual_rate_decimal.div(n_compound_freq_per_year)), compounding_periods_for_this_deposit)
                );

                A_final_amount = A_final_amount.plus(fv_of_this_bimonthly_deposit);
                profit_earned_over_initial_P = profit_earned_over_initial_P.plus(fv_of_this_bimonthly_deposit);
            }

            // --- محاسبات نهایی ---
            let total_periodic_deposits_made = sum_of_actual_monthly_deposits_made.plus(sum_of_actual_bimonthly_deposits_made);
            let net_total_profit = A_final_amount.minus(P_initial_principal).minus(total_periodic_deposits_made);

            // محاسبه درآمد ماهیانه
            let monthly_income = new Decimal(0);
            if (t_years.greaterThan(0)) {
                monthly_income = A_final_amount.times(effective_annual_rate_decimal.div(12));
            }

            return {
                finalAmount: A_final_amount,
                profitEarned: profit_earned_over_initial_P,
                netProfit: net_total_profit,
                totalDeposits: total_periodic_deposits_made,
                effectiveAnnualRate: effective_annual_rate,
                effectiveAnnualRateDecimal: effective_annual_rate_decimal,
                monthlyIncome: monthly_income,
                annualRatePercent: r_annual_rate_percent
            };
        }

        // محاسبه سود مرکب
        function calculateCompoundInterest(instanceElement, tabId) {
            const elements = getCalculatorElements(instanceElement);

            const inputData = {
                initialAmount: elements.initialAmount.value,
                rate: elements.rate.value,
                rateType: elements.rateType ? elements.rateType.value : 'annual',
                compoundFrequency: elements.compoundFrequency.value,
                customFrequency: elements.customFrequency ? elements.customFrequency.value : '',
                monthlyDeposit: elements.monthlyDeposit.value,
                annualIncreaseMonthlyDeposit: elements.annualIncreaseMonthlyDeposit.value,
                biMonthlyDeposit: elements.biMonthlyDeposit.value
            };

            const t_years_val = elements.years.value || 0;
            const res = runCompoundingCalculation(inputData, t_years_val);

            elements.result.innerText = `📌 مبلغ نهایی: ${res.finalAmount.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")} تومان`;
            elements.profit.innerText = `💵 سود کسب‌شده: ${res.profitEarned.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")} تومان`;
            elements.netProfit.innerText = `💸 سود خالص: ${res.netProfit.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")} تومان`;
            elements.totalDeposits.innerText = `💵 کل واریزی در مدت سرمایه‌گذاری: ${res.totalDeposits.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")} تومان`;
            elements.effectiveRate.innerText = `📈 سود مرکب واقعی: ${res.effectiveAnnualRate.toFixed(2)}%`;
            elements.monthlyIncome.innerText = `💰 درآمد ماهیانه (با نرخ مؤثر): ${res.monthlyIncome.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ",")} تومان`;

            let P_initial_principal = new Decimal(inputData.initialAmount.replace(/,/g, "") || 0);
            saveToHistory(
                P_initial_principal.toFixed(0),
                new Decimal(t_years_val).toFixed(0),
                res.annualRatePercent.toFixed(1),
                res.finalAmount.toFixed(0),
                res.effectiveAnnualRate.toFixed(2)
            );
            saveInputs(instanceElement, tabId);

            // هر زمان که یک تب را محاسبه می‌کنیم، مجموع کل را هم بروزرسانی می‌کنیم
            if (typeof updateCumulativeTotal === 'function') {
                updateCumulativeTotal();
            }
        }

        // محاسبه مجموع کل تب‌های علامت‌گذاری شده
        function updateCumulativeTotal() {
            const btnWrapper = document.getElementById('cumulative-total-btn-wrapper');
            if (!btnWrapper) return;

            let markedTabsCount = 0;

            // پیدا کردن تمام تب‌های علامت‌گذاری شده معتبر
            calculatorInstances.forEach((instanceData, tabId) => {
                const isMarked = localStorage.getItem(`tabMarked_${tabId}`) === 'true';
                if (isMarked) {
                    markedTabsCount++;
                }
            });

            // دکمه فقط در صورتی نمایش داده می‌شود که حداقل ۲ تب علامت‌گذاری شده باشد
            if (markedTabsCount >= 2) {
                btnWrapper.style.display = 'block';
            } else {
                btnWrapper.style.display = 'none';
            }
        }

        // ذخیره تاریخچه
        function saveToHistory(P, t, r_percent, A, effRate) {
            let تاریخ = new Date().toLocaleDateString("fa-IR");
            let record = { date: تاریخ, initial: P, years: t, rate: r_percent, final: A, effRate: effRate };

            let history = JSON.parse(localStorage.getItem("history")) || [];
            history.unshift(record);
            if (history.length > 5) history.pop();
            localStorage.setItem("history", JSON.stringify(history));
        }

                    }
                }
            }, false);
        }

        // تولید یا به‌روزرسانی منوی کشویی دسته‌بندی تب‌ها
        function updateGroupDropdown() {
            const menu = document.getElementById('group-dropdown-menu');
            if (!menu) return;

            // تعریف عناوین گروه‌ها بر اساس منبع ثبت درصد
            const groupTitles = {
                'favorites': '⭐ تب‌های مورد علاقه (نشانه‌گذاری شده)',
                'none': '💼 تب‌های عمومی (ورود دستی)',
                'percents': '📈 ثبت درصد 1 (صندوق طلا)',
                'kian_percents': '📈 ثبت درصد 2',
                'stock____________tas9yl_new_unified': '📈 ثبت درصد 3',
                'mofid_atie_percents': '📈 ثبت درصد 4',
                'energy_fund_synergy': '📈 ثبت درصد 5',
                'cement_factory_percents': '📈 ثبت درصد 6',
                'ahang_kian_percents': '📈 ثبت درصد 7 (آهنگ سهام کیان)'
            };

            // دسته‌بندی تب‌های فعال
            const groups = {
                'favorites': [],
                'none': [],
                'percents': [],
                'kian_percents': [],
                'stock____________tas9yl_new_unified': [],
                'mofid_atie_percents': [],
                'energy_fund_synergy': [],
                'cement_factory_percents': [],
                'ahang_kian_percents': []
            };

            calculatorInstances.forEach((instanceData, tabId) => {
                const elements = getCalculatorElements(instanceData.element);
                const source = elements.watchSource.value || 'none';

                // بازیابی نام تب (دلخواه یا پیش‌فرض)
                const customName = localStorage.getItem(`tabCustomName_${tabId}`);
                let tabName = customName || `تب ${tabId}`;

                if (!customName) {
                    const initialAmountValue = elements.initialAmount.value.replace(/,/g, "");
                    const yearsValue = elements.years.value;
                    const rateValue = elements.rate.value;
                    let nameParts = [];

                    if (initialAmountValue && parseFloat(initialAmountValue) > 0) {
                        nameParts.push(`مبلغ: ${parseFloat(initialAmountValue).toLocaleString('fa-IR').split(',')[0]}`);
                    }
                    if (yearsValue && parseFloat(yearsValue) > 0) {
                        nameParts.push(`سال: ${yearsValue}`);
                    }
                    if (rateValue && parseFloat(rateValue) > 0) {
                        const isDaily = elements.rateType && elements.rateType.value === 'daily';
                        nameParts.push(`سود: ${rateValue}%${isDaily ? ' روزانه' : ''}`);
                    }
                    if (nameParts.length > 0) {
                        tabName = nameParts.join(' | ');
                    }
                }

                // بررسی نشانه‌گذاری شده (مورد علاقه) بودن تب
                const isMarked = localStorage.getItem(`tabMarked_${tabId}`) === 'true';

                if (isMarked) {
                    groups['favorites'].push({ tabId, name: tabName });
                } else if (groups[source]) {
                    groups[source].push({ tabId, name: tabName });
                } else {
                    groups['none'].push({ tabId, name: tabName });
                }
            });

            // رندر دسته‌ها در منو
            let html = '';
            for (const [key, list] of Object.entries(groups)) {
                if (list.length > 0) {
                    const groupTitle = groupTitles[key] || 'سایر گروه‌ها';
                    html += `<div class="group-menu-category">${groupTitle} (${list.length} تب)</div>`;
                    list.forEach(item => {
                        const isCurrentActive = item.tabId === activeTabId;
                        const activeStyle = isCurrentActive ? 'font-weight: bold; color: #007bff; background: rgba(0,123,255,0.08);' : '';
                        html += `
                            <div class="group-menu-item" style="${activeStyle}" onclick="switchTab('${item.tabId}'); toggleGroupDropdown(false);">
                                <span>🔹 ${item.name}</span>
                                <span style="font-size: 0.8rem; color: #888;">#${item.tabId}</span>
                            </div>
                        `;
                    });
                }
            }

            menu.innerHTML = html || '<div style="padding: 15px; text-align: center; color: #888;">هیچ تبی یافت نشد.</div>';
        }

        // باز و بسته کردن منوی کشویی دسته‌بندی
        function toggleGroupDropdown(forceState = null) {
            const menu = document.getElementById('group-dropdown-menu');
            if (!menu) return;

            if (forceState !== null) {
                menu.style.display = forceState ? 'block' : 'none';
            } else {
                menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
            }
        }

        // ایجاد نمونه ماشین حساب
        function createCalculatorInstance(initialTabId = null) {
            tabCounter++;
            const tabId = initialTabId || tabCounter;
            const template = document.getElementById('calculator-template');
            const calculatorApp = document.getElementById('calculator-app');
            const tabsContainer = document.getElementById('tabs-container');

            const newInstance = template.content.cloneNode(true).firstElementChild;
            newInstance.dataset.tabId = tabId;
            calculatorApp.appendChild(newInstance);

            calculatorInstances.set(tabId.toString(), { element: newInstance });

            loadInputs(newInstance, tabId);
            setupFrequencyField(newInstance);

            const elements = getCalculatorElements(newInstance);

            elements.watchSource.addEventListener('change', () => {
                handleWatchSync(newInstance, tabId, true);
            });
            elements.initialAmount.addEventListener('input', () => { formatNumber(elements.initialAmount); saveInputs(newInstance, tabId); updateCumulativeTotal(); updateGroupDropdown(); });
            elements.years.addEventListener('input', () => { saveInputs(newInstance, tabId); updateCumulativeTotal(); updateGroupDropdown(); });
            elements.rate.addEventListener('input', () => { saveInputs(newInstance, tabId); updateCumulativeTotal(); updateGroupDropdown(); });
            elements.compoundFrequency.addEventListener('change', () => {
                saveInputs(newInstance, tabId);
                updateTabName(tabId, newInstance);
                if (elements.customFrequency) {
                    setupFrequencyField(newInstance);
                }
                updateCumulativeTotal();
                updateGroupDropdown();
            });
            if (elements.customFrequency) {
                elements.customFrequency.addEventListener('input', () => { saveInputs(newInstance, tabId); updateCumulativeTotal(); updateGroupDropdown(); });
            }
            elements.monthlyDeposit.addEventListener('input', () => { formatNumber(elements.monthlyDeposit); saveInputs(newInstance, tabId); updateCumulativeTotal(); updateGroupDropdown(); });
            elements.annualIncreaseMonthlyDeposit.addEventListener('input', () => { formatNumber(elements.annualIncreaseMonthlyDeposit); saveInputs(newInstance, tabId); updateCumulativeTotal(); updateGroupDropdown(); });
            elements.biMonthlyDeposit.addEventListener('input', () => { formatNumber(elements.biMonthlyDeposit); saveInputs(newInstance, tabId); updateCumulativeTotal(); updateGroupDropdown(); });

            elements.rateType.addEventListener('change', () => {
                saveInputs(newInstance, tabId);
                updateTabName(tabId, newInstance);
                updateCumulativeTotal();
                updateGroupDropdown();
            });
            elements.calculateButton.addEventListener('click', () => { calculateCompoundInterest(newInstance, tabId); updateTabName(tabId, newInstance); updateGroupDropdown(); });
            elements.resetButton.addEventListener('click', () => { resetForm(newInstance, tabId); updateGroupDropdown(); });
            elements.historyButton.addEventListener('click', showHistory);

            showHiddenFeatures(newInstance);

            const tabButton = document.createElement('button');
            tabButton.classList.add('tab-button');
            tabButton.dataset.tabId = tabId;

            // بازیابی وضعیت علامت‌گذاری تب
            const isMarked = localStorage.getItem(`tabMarked_${tabId}`) === 'true';

            tabButton.innerHTML = `
                <input type="checkbox" class="tab-mark-checkbox" data-tab-id="${tabId}" ${isMarked ? 'checked' : ''} style="margin: 0 0 0 6px; width: 16px; height: 16px; cursor: pointer; flex-shrink: 0;" onclick="event.stopPropagation();">
                <span>تب ${tabId}</span>
                <span class="close-tab" style="margin-right: auto; margin-left: 0;">x</span>
            `;

            tabButton.addEventListener('click', (event) => {
                if (!event.target.classList.contains('close-tab') && !event.target.classList.contains('tab-mark-checkbox')) {
                    switchTab(tabId.toString());
                }
            });

            tabButton.addEventListener('dblclick', (event) => {
                event.stopPropagation();
                const currentName = localStorage.getItem(`tabCustomName_${tabId}`) || `تب ${tabId}`;
                const newName = prompt("✍️ نام دلخواه خود را برای این تب وارد کنید:", currentName);
                if (newName !== null) {
                    const trimmed = newName.trim();
                    if (trimmed) {
                        localStorage.setItem(`tabCustomName_${tabId}`, trimmed);
                    } else {
                        localStorage.removeItem(`tabCustomName_${tabId}`);
                    }
                    updateTabName(tabId, newInstance);
                }
            });

            const markCheckbox = tabButton.querySelector('.tab-mark-checkbox');
            markCheckbox.addEventListener('change', (event) => {
                localStorage.setItem(`tabMarked_${tabId}`, event.target.checked);
                if (typeof updateCumulativeTotal === 'function') {
                    updateCumulativeTotal();
                }
                updateGroupDropdown();
            });

            tabButton.querySelector('.close-tab').addEventListener('click', (event) => {
                event.stopPropagation();
                closeTab(tabId.toString());
            });
            tabsContainer.appendChild(tabButton);

            applyTheme();
            updateTabName(tabId, newInstance);
            return tabId.toString();
        }

        function switchTab(tabId) {
            if (activeTabId === tabId) return;

            if (activeTabId) {
                const currentActiveInstance = calculatorInstances.get(activeTabId)?.element;
                if (currentActiveInstance) currentActiveInstance.classList.remove('active');
                const currentActiveTabButton = document.querySelector(`.tab-button[data-tab-id="${activeTabId}"]`);
                if (currentActiveTabButton) currentActiveTabButton.classList.remove('active-tab');
            }

            const newActiveInstance = calculatorInstances.get(tabId)?.element;
            if (newActiveInstance) {
                newActiveInstance.classList.add('active');
            }
            const newActiveTabButton = document.querySelector(`.tab-button[data-tab-id="${tabId}"]`);
            if (newActiveTabButton) newActiveTabButton.classList.add('active-tab');

            activeTabId = tabId;
            localStorage.setItem('activeTabId', tabId);

            if (newActiveTabButton) {
                newActiveTabButton.scrollIntoView({ behavior: 'smooth', inline: 'center' });
            }

            updateGroupDropdown();
        }

        function closeTab(tabId) {
            if (calculatorInstances.size === 1) {
                alert("نمی‌توانید تنها تب موجود را حذف کنید.");
                return;
            }

            const instanceData = calculatorInstances.get(tabId);
            if (instanceData) {
                instanceData.element.remove();
                localStorage.removeItem(`calculatorTab_${tabId}`);
                localStorage.removeItem(`tabMarked_${tabId}`);
                localStorage.removeItem(`tabCustomName_${tabId}`);
                calculatorInstances.delete(tabId);
            }

            const tabButton = document.querySelector(`.tab-button[data-tab-id="${tabId}"]`);
            if (tabButton) tabButton.remove();

            if (typeof updateCumulativeTotal === 'function') {
                updateCumulativeTotal();
            }

            if (activeTabId === tabId) {
                const remainingTabIds = Array.from(calculatorInstances.keys());
                if (remainingTabIds.length > 0) {
                    switchTab(remainingTabIds[0]);
                } else {
                    activeTabId = null;
                    localStorage.removeItem('activeTabId');
                }
            }
            localStorage.setItem('tabCounter', tabCounter);
            saveTabsState();
            updateGroupDropdown();
        }

        function updateTabName(tabId, instanceElement) {
            const elements = getCalculatorElements(instanceElement);
            const tabButtonSpan = document.querySelector(`.tab-button[data-tab-id="${tabId}"] span:nth-child(2)`);

            if (tabButtonSpan) {
                // اگر کاربر نام دلخواه برای این تب ذخیره کرده باشد، از آن استفاده می‌کنیم
                const customName = localStorage.getItem(`tabCustomName_${tabId}`);
                if (customName) {
                    tabButtonSpan.textContent = customName;
                    return;
                }

                let nameParts = [];
                const initialAmountValue = elements.initialAmount.value.replace(/,/g, "");
                const yearsValue = elements.years.value;
                const rateValue = elements.rate.value;

                if (initialAmountValue && parseFloat(initialAmountValue) > 0) {
                    nameParts.push(`مبلغ: ${parseFloat(initialAmountValue).toLocaleString('fa-IR').split(',')[0]}`);
                }
                if (yearsValue && parseFloat(yearsValue) > 0) {
                    nameParts.push(`سال: ${yearsValue}`);
                }
                if (rateValue && parseFloat(rateValue) > 0) {
                    const isDaily = elements.rateType && elements.rateType.value === 'daily';
                    nameParts.push(`سود: ${rateValue}%${isDaily ? ' روزانه' : ''}`);
                }

                if (nameParts.length > 0) {
                    tabButtonSpan.textContent = nameParts.join(' | ');
                } else {
                    tabButtonSpan.textContent = `تب ${tabId}`;
                }
            }
        }

        function saveTabsState() {
            localStorage.setItem('savedTabs', JSON.stringify(Array.from(calculatorInstances.keys())));
            localStorage.setItem('activeTabId', activeTabId);
            localStorage.setItem('tabCounter', tabCounter);
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();

            document.querySelector('.close-history').addEventListener('click', closeHistoryModal);
            window.addEventListener('click', (event) => {
                if (event.target == document.getElementById('historyModal')) {
                    closeHistoryModal();
                }
            });

            // مدیریت کلیک خارج از منوی کشویی دسته‌بندی برای بستن آن
            window.addEventListener('click', (event) => {
                const dropdownBtn = document.getElementById('group-dropdown-btn');
                const dropdownMenu = document.getElementById('group-dropdown-menu');
                if (dropdownBtn && dropdownMenu && !dropdownBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                    toggleGroupDropdown(false);
                }
            });

            // لیسنر دکمه منوی کشویی دسته‌بندی
            const groupDropdownBtn = document.getElementById('group-dropdown-btn');
            if (groupDropdownBtn) {
                groupDropdownBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleGroupDropdown();
                });
            }

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
            }

            // لیسنر کلیک برای باز کردن صفحه مجموع کل مستقل
            const openCumBtn = document.getElementById('open-cumulative-total-btn');
            if (openCumBtn) {
                openCumBtn.addEventListener('click', () => {
                    // ذخیره کردن زنده اطلاعات قبل از هدایت
                    calculatorInstances.forEach((instanceData, tabId) => {
                        saveInputs(instanceData.element, tabId);
                    });
                    window.open('total.html', '_blank');
                });
            }

            const addTabButton = document.getElementById('add-tab-button');
            addTabButton.addEventListener('click', () => {
                const newTabId = createCalculatorInstance();
                switchTab(newTabId);
                saveTabsState();
            });

            let savedTabs = JSON.parse(localStorage.getItem('savedTabs')) || [];
            let savedActiveTabId = localStorage.getItem('activeTabId');
            tabCounter = parseInt(localStorage.getItem('tabCounter') || '0');

            if (savedTabs.length > 0) {
                savedTabs.forEach(id => {
                    if (parseInt(id) > tabCounter) tabCounter = parseInt(id);
                    const createdTabId = createCalculatorInstance(id);
                    updateTabName(createdTabId, calculatorInstances.get(createdTabId).element);
                });
                if (savedActiveTabId && calculatorInstances.has(savedActiveTabId)) {
                    switchTab(savedActiveTabId);
                } else {
                    switchTab(savedTabs[0]);
                }
            } else {
                const newTabId = createCalculatorInstance("1");
                switchTab(newTabId);
                saveTabsState();
            }

            // فراخوانی بروزرسانی نهایی مجموع کل پس از بارگذاری تمامی تب‌ها
            setTimeout(() => {
                updateCumulativeTotal();
                updateGroupDropdown();
            }, 100);
        });
    </script>
</body>
</html>
