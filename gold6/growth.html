<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <!-- این فایل ۲۴۰مین فایلی است که از اپلیکیشن نمایشگر کد پلتفرم عمارت دانلود شده است -->
<meta name="platform-download-sequence" content="۲۴۰">
<meta name="download-source" content="اپلیکیشن نمایشگر کد - پلتفرم عمارت">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت رشد</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 12px;
    color: #222;
  }

  .container {
    max-width: 100%;
    margin: 0 auto;
    background: #fff;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    position: relative;
  }

  .header h1 {
    font-size: 20px;
    margin: 0;
    color: #0d5c9c;
    font-weight: bold;
    flex: 1;
    text-align: center;
  }

  .menu-toggle {
    background: linear-gradient(180deg, #42a5f5 0%, #1976d2 100%);
    color: #fff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 3px 0 #0d47a1, 0 4px 6px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.05s, box-shadow 0.05s;
    flex-shrink: 0;
  }

  .menu-toggle:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #0d47a1;
  }

  .dropdown-menu {
    position: absolute;
    top: 52px;
    right: 0;
    background: #fff;
    border: 1px solid #dfe3e8;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    padding: 8px;
    z-index: 5000;
    min-width: 200px;
    display: none;
    animation: dropIn 0.15s ease-out;
  }

  .dropdown-menu.show { display: block; }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    color: #222;
    font-family: inherit;
    border: none;
    background: transparent;
    width: 100%;
    text-align: right;
    transition: background 0.15s, transform 0.05s;
    margin-bottom: 4px;
  }

  .dropdown-item:last-child { margin-bottom: 0; }
  .dropdown-item:hover { background: #e3f2fd; transform: translateX(-2px); }
  .dropdown-item:active { transform: scale(0.98); }

  .dropdown-item.danger { color: #c62828; }
  .dropdown-item.danger:hover { background: #ffebee; }

  .capital-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding: 10px 12px;
    background: #eef7ff;
    border: 1px solid #cfe4f7;
    border-radius: 8px;
    flex-wrap: wrap;
  }

  .capital-box label {
    font-weight: bold;
    color: #0d5c9c;
    white-space: nowrap;
    font-size: 14px;
  }

  .capital-box input {
    flex: 1;
    min-width: 100px;
    padding: 6px 8px;
    border: 1px solid #b8d4ec;
    border-radius: 6px;
    font-size: 14px;
    text-align: left;
    direction: ltr;
    font-family: inherit;
  }

  .delete-actions {
    display: none;
    gap: 6px;
    margin-bottom: 12px;
  }

  .delete-actions.show { display: flex; }

  .delete-action-btn {
    flex: 1;
    padding: 9px 10px;
    font-size: 13px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    color: #fff;
    transition: opacity 0.2s;
  }

  .delete-action-btn.confirm-delete { background: #b71c1c; }
  .delete-action-btn.cancel-delete { background: #757575; }
  .delete-action-btn:hover { opacity: 0.88; }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 14px;
    border-radius: 8px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 380px;
  }

  th, td {
    border: 1px solid #dfe3e8;
    padding: 4px;
    text-align: center;
    vertical-align: middle;
  }

  th {
    background: #f0f3f7;
    font-size: 11px;
    color: #333;
    padding: 6px 3px;
    white-space: nowrap;
    font-weight: bold;
  }

  th.check-col { width: 36px; }
  th.col-main { width: calc((100% - 36px) / 3); }

  td input[type="text"] {
    border: none;
    outline: none;
    background: transparent;
    padding: 6px 2px;
    font-size: 13px;
    text-align: center;
    font-family: inherit;
    min-width: 0;
  }

  td input[type="text"].num {
    direction: ltr;
    text-align: center;
    min-width: 0;
  }

  .check-col input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #1976d2;
  }

  .check-col input.del-check {
    accent-color: #e53935;
    transform: scale(1.15);
  }

  body.delete-mode tr.main-row td input[type="text"] {
    pointer-events: none;
    opacity: 0.55;
  }

  body.delete-mode tr.main-row td.check-col input[type="checkbox"]:not(.del-check) {
    pointer-events: none;
  }

  tr.marked-for-delete,
  tr.row-header.marked-for-delete,
  tr.marked-for-delete + tr.desc-row {
    background: #ffcdd2 !important;
  }

  tr.row-header th {
    background: #eef7ff;
    color: #0d5c9c;
    font-size: 12px;
    padding: 6px 3px;
    border-bottom: 2px solid #b8d4ec;
  }

    .mini-calc-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    vertical-align: middle;
    transition: transform 0.15s;
    line-height: 1;
  }
  .mini-calc-btn:active {
    transform: scale(1.25);
  }

/* ============================================
     برچسب سه‌بعدی — بدون هیچ پس‌زمینه/سایه
     ============================================ */
  .txt-3d {
    font-family: inherit;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 14px 32px;
    border: none;
    border-radius: 14px;
    background: none !important;
    background-color: transparent !important;
    cursor: default;
    position: relative;
    user-select: none;
    text-align: center;
    width: 100%;
    display: inline-block;
    line-height: 1.3;
    min-height: 56px;
    box-shadow: none !important;
  }

  .txt-3d.buy {
    background-image: linear-gradient(180deg, #c8e6c9 0%, #81c784 45%, #66bb6a 55%, #388e3c 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent;
    color: transparent;
    -webkit-text-stroke: 1.5px #2e7d32;
    paint-order: stroke fill;
  }

  .txt-3d.sell {
    background-image: linear-gradient(180deg, #ef5350 0%, #c62828 45%, #b71c1c 55%, #7f0e0e 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent;
    color: transparent;
    -webkit-text-stroke: 1.5px #b71c1c;
    paint-order: stroke fill;
  }

  .txt-3d.withdraw {
    background-image: linear-gradient(180deg, #ffa726 0%, #ef6c00 45%, #e65100 55%, #a63a00 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent;
    color: transparent;
    -webkit-text-stroke: 1.5px #e65100;
    paint-order: stroke fill;
  }

  .txt-3d.note {
    background-image: linear-gradient(180deg, #b0bec5 0%, #607d8b 45%, #455a64 55%, #263238 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent;
    color: transparent;
    -webkit-text-stroke: 1.5px #37474f;
    paint-order: stroke fill;
  }

  .shine-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    flex: 1;
    min-width: 0;
    display: flex;
    background: transparent;
  }

  .shine-wrap::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(255,255,255,0) 30%,
      rgba(255,255,255,0.9) 50%,
      rgba(255,255,255,0) 70%,
      transparent 100%
    );
    transform: translateX(-150%);
    pointer-events: none;
    will-change: transform;
    z-index: 2;
  }

  .shine-wrap:hover::after {
    transform: translateX(250%);
    transition: transform 0.7s ease-out;
  }

  @keyframes pulse-white-red {
    0%, 100% { background-color: transparent; }
    25% { background-color: #ff5252; }
    50% { background-color: #fff; }
    75% { background-color: #ff5252; }
  }

  tr.pulse-flash,
  tr.pulse-flash + tr.desc-row {
    animation: pulse-white-red 0.5s ease-in-out 3;
  }

  tr.checked-yellow {
    background: #fff59d !important;
  }

  tr.checked-blue {
    background: #bbdefb !important;
  }

  tr.desc-row td {
    padding: 8px;
  }

  .desc-row-content {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .desc-row-content .desc-cell {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .action-btn {
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.05s, box-shadow 0.05s;
    padding: 0;
  }

  .action-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.3) !important;
  }

  .hamburger-btn {
    width: 56px;
    height: 56px;
    background: linear-gradient(180deg, #42a5f5 0%, #1976d2 100%);
    box-shadow: 0 3px 0 #0d47a1, 0 4px 6px rgba(0,0,0,0.15);
    font-size: 24px;
    flex-shrink: 0;
  }

  .hamburger-btn:hover {
    background: linear-gradient(180deg, #4dafff 0%, #1e88e5 100%);
  }

  .add-btn {
    display: block;
    width: 100%;
    padding: 10px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: #2196f3;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .add-btn:hover { background: #1976d2; }

  .desc-menu {
    position: fixed;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    padding: 6px;
    z-index: 10000;
    min-width: 150px;
    font-family: Tahoma, Arial, sans-serif;
    direction: rtl;
  }

  .desc-menu-item {
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    transition: transform 0.1s;
  }

  .desc-menu-item:last-child { margin-bottom: 0; }
  .desc-menu-item:hover { transform: scale(1.03); }

  .desc-menu-item.buy {
    background: linear-gradient(180deg, #a5d6a7 0%, #388e3c 100%);
    color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  .desc-menu-item.sell {
    background: linear-gradient(180deg, #ef5350 0%, #c62828 100%);
    color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  .desc-menu-item.withdraw {
    background: linear-gradient(180deg, #ffa726 0%, #ef6c00 100%);
    color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  .desc-menu-item.note {
    background: linear-gradient(180deg, #b0bec5 0%, #455a64 100%);
    color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 20000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeIn 0.2s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-box {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    text-align: center;
    font-family: Tahoma, Arial, sans-serif;
    direction: rtl;
    animation: popIn 0.25s;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-box.wide {
    max-width: 500px;
  }

  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-icon { font-size: 42px; margin-bottom: 8px; }
  .modal-title { font-size: 17px; font-weight: bold; color: #d32f2f; margin-bottom: 10px; }
  .modal-title.note { color: #37474f; }
  .modal-title.calendar { color: #0d5c9c; }
  .modal-text { font-size: 14px; color: #555; margin-bottom: 16px; line-height: 1.6; }

  .modal-code {
    font-size: 30px;
    font-weight: bold;
    color: #0d5c9c;
    background: #eef7ff;
    border: 2px dashed #2196f3;
    border-radius: 10px;
    padding: 12px;
    letter-spacing: 6px;
    margin: 10px 0 16px;
    direction: ltr;
    user-select: none;
  }

  .modal-input {
    width: 100%;
    padding: 10px;
    font-size: 18px;
    text-align: center;
    direction: ltr;
    border: 2px solid #b8d4ec;
    border-radius: 8px;
    font-family: inherit;
    margin-bottom: 14px;
    outline: none;
    letter-spacing: 4px;
  }

  .modal-input:focus { border-color: #2196f3; }

  .modal-input.error {
    border-color: #e53935;
    animation: shake 0.3s;
  }

  .note-textarea {
    width: 100%;
    min-height: 180px;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    direction: rtl;
    text-align: right;
    border: 2px solid #b8d4ec;
    border-radius: 10px;
    outline: none;
    resize: vertical;
    margin-bottom: 14px;
    line-height: 1.7;
  }

  .note-textarea:focus { border-color: #607d8b; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .modal-buttons { display: flex; gap: 8px; }

  .modal-btn {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s;
  }

  .modal-btn:hover { opacity: 0.88; }
  .modal-btn.cancel { background: #eceff1; color: #37474f; }
  .modal-btn.confirm { background: #ff5252; color: #fff; }
  .modal-btn.confirm-step1 { background: #ff9800; color: #fff; }
  .modal-btn.confirm-step2 { background: #f44336; color: #fff; }
  .modal-btn.save-note { background: #607d8b; color: #fff; }

  .modal-progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
  }

  .modal-progress span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #dfe3e8;
    transition: background 0.3s;
  }

  .modal-progress span.active { background: #2196f3; }

  .big-calendar {
    background: #fff;
    border-radius: 12px;
    padding: 8px;
  }

  .big-cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 8px;
  }

  .big-cal-title {
    font-weight: bold;
    font-size: 20px;
    color: #0d5c9c;
    flex: 1;
    text-align: center;
  }

  .big-cal-nav {
    background: #2196f3;
    color: #fff;
    border: none;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
    box-shadow: 0 3px 0 #0d47a1;
    transition: transform 0.05s;
  }

  .big-cal-nav:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #0d47a1;
  }

  .big-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .big-cal-dayname {
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    color: #666;
    padding: 8px 0;
  }

  .big-cal-day, .big-cal-empty {
    text-align: center;
    padding: 14px 0;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .big-cal-day {
    cursor: pointer;
    background: #f5f7fa;
    transition: background 0.15s, transform 0.1s;
    color: #37474f;
  }

  .big-cal-day:hover {
    transform: scale(1.05);
    filter: brightness(1.05);
  }

  .big-cal-day.today {
    border: 2px solid #2196f3;
  }

  .big-cal-day.has-data {
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    box-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  .big-cal-day.has-buy {
    background: linear-gradient(180deg, #66bb6a 0%, #388e3c 100%);
  }

  .big-cal-day.has-sell {
    background: linear-gradient(180deg, #ef5350 0%, #c62828 100%);
  }

  .big-cal-day.has-withdraw {
    background: linear-gradient(180deg, #ffa726 0%, #ef6c00 100%);
  }

  .big-cal-day.has-note {
    background: linear-gradient(180deg, #90a4ae 0%, #455a64 100%);
  }

  .big-cal-day.has-buy.has-sell {
    background: linear-gradient(180deg, #66bb6a 0%, #66bb6a 50%, #ef5350 50%, #c62828 100%);
  }

  .big-cal-day.has-buy.has-withdraw {
    background: linear-gradient(180deg, #66bb6a 0%, #66bb6a 50%, #ffa726 50%, #ef6c00 100%);
  }

  .big-cal-day.has-sell.has-withdraw {
    background: linear-gradient(180deg, #ef5350 0%, #ef5350 50%, #ffa726 50%, #ef6c00 100%);
  }

  .big-cal-day.has-buy.has-note {
    background: linear-gradient(180deg, #66bb6a 0%, #66bb6a 50%, #90a4ae 50%, #455a64 100%);
  }

  .big-cal-day.has-sell.has-note {
    background: linear-gradient(180deg, #ef5350 0%, #ef5350 50%, #90a4ae 50%, #455a64 100%);
  }

  .big-cal-day.has-withdraw.has-note {
    background: linear-gradient(180deg, #ffa726 0%, #ffa726 50%, #90a4ae 50%, #455a64 100%);
  }

  .big-cal-day.has-buy.has-sell.has-withdraw {
    background: linear-gradient(180deg, #66bb6a 0%, #66bb6a 33%, #ef5350 33%, #ef5350 66%, #ffa726 66%, #ef6c00 100%);
  }

  .big-cal-day.has-buy.has-sell.has-note {
    background: linear-gradient(180deg, #66bb6a 0%, #66bb6a 33%, #ef5350 33%, #ef5350 66%, #90a4ae 66%, #455a64 100%);
  }

  .big-cal-empty { visibility: hidden; }

  .day-rows-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
    max-height: 50vh;
    overflow-y: auto;
  }

  .day-row-item {
    padding: 12px 14px;
    border-radius: 10px;
    background: #f5f7fa;
    border: 1px solid #dfe3e8;
    cursor: pointer;
    text-align: right;
    font-family: inherit;
    font-size: 14px;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .day-row-item:hover {
    background: #e3f2fd;
    transform: translateX(-3px);
  }

  .day-row-item .row-type {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    color: #fff;
  }

  .day-row-item .row-type.buy {
    background: linear-gradient(180deg, #66bb6a 0%, #388e3c 100%);
  }
  .day-row-item .row-type.sell {
    background: linear-gradient(180deg, #ef5350 0%, #c62828 100%);
  }
  .day-row-item .row-type.withdraw {
    background: linear-gradient(180deg, #ffa726 0%, #ef6c00 100%);
  }
  .day-row-item .row-type.note {

  }

  .day-row-item .row-amount {
    color: #0d5c9c;

</style>

<script>
/* ============================================================
   1) IndexedDB
   ============================================================ */
const DB_NAME = "GrowthDB_gold6";
const DB_VERSION = 1;
const STORE_NAME = "rows";
const CAPITAL_STORE = "settings";
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
      }
      if (!database.objectStoreNames.contains(CAPITAL_STORE)) {
        database.createObjectStore(CAPITAL_STORE, { keyPath: "key" });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function addRowToDB(row) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).add(row);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function updateRowInDB(row) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put(row);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function deleteRowFromDB(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function getAllRows() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function clearAllRows() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function saveCapital(value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CAPITAL_STORE, "readwrite");
    const req = tx.objectStore(CAPITAL_STORE).put({ key: "capital", value: value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function loadCapital() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CAPITAL_STORE, "readonly");
    const req = tx.objectStore(CAPITAL_STORE).get("capital");
    req.onsuccess = () => resolve(req.result ? req.result.value : "");
    req.onerror = () => reject(req.error);
  });
}

/* ============================================================
   2) ابزار اعداد
   ============================================================ */
function toEnglishDigits(str) {
  if (!str) return "";
  return str
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function cleanNumber(str) {
  return toEnglishDigits(str).replace(/[^0-9.]/g, "");
}

function formatWithCommas(numStr) {
  if (!numStr) return "";
  const parts = numStr.split(".");
  let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  if (parts.length > 1) return intPart + "." + parts[1];
  return intPart;
}

function removeCommas(str) {
  return (str || "").replace(/,/g, "");
}

/* ============================================================
   3) محاسبه پهنای متن
   ============================================================ */
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

const fontCache = new WeakMap();
function getFont(input) {
  let font = fontCache.get(input);
  if (!font) {
    const style = window.getComputedStyle(input);
    font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    fontCache.set(input, font);
  }
  return font;
}

const widthCache = new Map();
function measureTextWidth(text, font) {
  const key = font + "|" + text;
  let w = widthCache.get(key);
  if (w === undefined) {
    ctx.font = font;
    w = ctx.measureText(text || " ").width;
    widthCache.set(key, w);
    if (widthCache.size > 2000) widthCache.clear();
  }
  return w;
}

const pendingInputs = new Set();
let rafScheduled = false;

function scheduleAutoSize(input) {
  pendingInputs.add(input);
  if (!rafScheduled) {
    rafScheduled = true;
    requestAnimationFrame(processPending);
  }
}

function processPending() {
  rafScheduled = false;
  pendingInputs.forEach(input => {
    if (document.contains(input)) autoSizeInputNow(input);
  });
  pendingInputs.clear();
}

function autoSizeInputNow(input, max = 600) {
  const font = getFont(input);
  const baseWidth = measureTextWidth("mmm", font);
  const text = input.value || input.placeholder || "";
  const textWidth = measureTextWidth(text, font);
  let w = Math.max(baseWidth, textWidth) + 16;
  if (w > max) w = max;
  const px = Math.ceil(w) + "px";
  if (input.style.width !== px) input.style.width = px;
}

function autoSizeInput(input, max = 600) {
  scheduleAutoSize(input);
}

/* ============================================================
   4) تقویم شمسی
   ============================================================ */
function div(a, b) { return ~~(a / b); }
function mod(a, b) { return a - ~~(a / b) * b; }

function jalCal(jy) {
  const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210,
                  1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  let bl = breaks.length, gy = jy + 621, leapJ = -14, jp = breaks[0], jm, jump = 0, leap, n, i;
  if (jy < jp || jy >= breaks[bl - 1]) throw new Error("Invalid Jalaali year " + jy);
  for (i = 1; i < bl; i += 1) {
    jm = breaks[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  leap = mod(mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap: leap, gy: gy, march: march };
}

function j2d(jy, jm, jd) {
  const r = jalCal(jy);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}

function d2j(jdn) {
  let gy = d2g(jdn).gy, jy = gy - 621, r = jalCal(jy), jdn1f = g2d(gy, 3, r.march), jd, jm, k;
  k = jdn - jdn1f;
  if (k >= 0) {
    if (k <= 185) {
      jm = 1 + div(k, 31);
      jd = mod(k, 31) + 1;
      return { jy: jy, jm: jm, jd: jd };
    } else k -= 186;
  } else {
    jy -= 1;
    k += 179;
    if (r.leap === 1) k += 1;
  }
  jm = 7 + div(k, 30);
  jd = mod(k, 30) + 1;
  return { jy: jy, jm: jm, jd: jd };
}

function g2d(gy, gm, gd) {
  let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
        + div(153 * mod(gm + 9, 12) + 2, 5)
        + gd - 34840408;
  d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}

function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = div(mod(j, 1461), 4) * 5 + 308;
  const gd = div(mod(i, 153), 5) + 1;
  const gm = mod(div(i, 153), 12) + 1;
  const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
  return { gy: gy, gm: gm, gd: gd };
}

function toJalaali(date) {
  return d2j(g2d(date.getFullYear(), date.getMonth() + 1, date.getDate()));
}

function toGregorian(jy, jm, jd) {
  const g = d2g(j2d(jy, jm, jd));
  return new Date(g.gy, g.gm - 1, g.gd);
}

const MONTHS_FA = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",
                   "مهر","آبان","آذر","دی","بهمن","اسفند"];

function isLeapJalaali(jy) { return jalCal(jy).leap === 0; }
function jalaaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalaali(jy) ? 30 : 29;
}

function formatJalaliDate(date) {
  const j = toJalaali(date);
  return j.jy + "/" + String(j.jm).padStart(2, "0") + "/" + String(j.jd).padStart(2, "0");
}

function formatTime(date) {
  return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
}

/* ============================================================
   5) منوی کشویی
   ============================================================ */
const menuToggle = document.getElementById("menuToggle");
const dropdownMenu = document.getElementById("dropdownMenu");

menuToggle.onclick = (e) => {
  e.stopPropagation();
  dropdownMenu.classList.toggle("show");
};

document.addEventListener("click", (e) => {
  if (!dropdownMenu.contains(e.target) && e.target !== menuToggle) {
    dropdownMenu.classList.remove("show");
  }
});

function closeDropdown() {
  dropdownMenu.classList.remove("show");
}

/* ============================================================
   6) منوی همبرگری توضیح
   ============================================================ */
let activeDescMenu = null;

const DESC_TYPES = {
  buy:      { label: "خرید",    cls: "buy",      menuCls: "buy" },
  sell:     { label: "فروش",    cls: "sell",     menuCls: "sell" },
  withdraw: { label: "برداشت",  cls: "withdraw", menuCls: "withdraw" },
  note:     { label: "یادداشت", cls: "note",     menuCls: "note" }
};

function detectDescType(text) {
  if (text === "خرید") return "buy";
  if (text === "فروش") return "sell";
  if (text === "برداشت") return "withdraw";
  if (text === "یادداشت") return "note";
  return "";
}

function applyLabelStyle(label, type) {
  label.classList.remove("buy", "sell", "withdraw", "note");
  label.classList.add("txt-3d");
  if (type && DESC_TYPES[type]) {
    label.classList.add(type);
    label.textContent = DESC_TYPES[type].label;
  } else {
    label.textContent = "";
  }
}

function openDescMenu(btn, label, row) {
  closeDescMenu();

  const rect = btn.getBoundingClientRect();
  const menu = document.createElement("div");
  menu.className = "desc-menu";
  menu.style.visibility = "hidden";

  const items = [
    { key: "buy",      icon: "🟢", text: "خرید" },
    { key: "sell",     icon: "🔴", text: "فروش" },
    { key: "withdraw", icon: "🟠", text: "برداشت" },
    { key: "note",     icon: "📝", text: "یادداشت" }
  ];

  items.forEach(it => {
    const el = document.createElement("div");
    el.className = "desc-menu-item " + DESC_TYPES[it.key].menuCls;
    el.innerHTML = `<span>${it.icon}</span><span>${it.text}</span>`;
    el.onclick = (e) => {
      e.stopPropagation();
      if (it.key === "note") {
        openNoteModal(row, label);
      } else {
        applyLabelStyle(label, it.key);
        row.desc = it.text;
        row.descType = it.key;
        saveRow(row);
      }
      closeDescMenu();
    };
    menu.appendChild(el);
  });

  document.body.appendChild(menu);

  const mr = menu.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight, gap = 6;

  let left = rect.right - mr.width;
  if (left < gap) left = gap;
  if (left + mr.width > vw - gap) left = vw - mr.width - gap;

  let top = rect.bottom + gap;
  if (top + mr.height > vh - gap) top = rect.top - mr.height - gap;
  if (top < gap) top = gap;

  menu.style.left = left + "px";
  menu.style.top = top + "px";
  menu.style.visibility = "visible";

  activeDescMenu = menu;

  setTimeout(() => {
    document.addEventListener("click", outsideDescClose);
    document.addEventListener("scroll", closeDescMenu, true);
  }, 0);
}

function outsideDescClose(e) {
  if (activeDescMenu && !activeDescMenu.contains(e.target)) closeDescMenu();
}

function closeDescMenu() {
  if (activeDescMenu) {
    activeDescMenu.remove();
    activeDescMenu = null;
    document.removeEventListener("click", outsideDescClose);
    document.removeEventListener("scroll", closeDescMenu, true);
  }
}

/* ============================================================
   7) مودال یادداشت
   ============================================================ */
function openNoteModal(row, label) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  document.body.appendChild(overlay);

  const currentNote = row.note || "";

  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-icon">📝</div>
      <div class="modal-title note">یادداشت این ردیف</div>
      <div class="modal-text">هر چی می‌خوای بنویس — خودکار ذخیره می‌شه</div>
      <textarea class="note-textarea" id="noteText" placeholder="یادداشت خود را بنویسید...">${escapeHtml(currentNote)}</textarea>
      <div class="modal-buttons">
        <button class="modal-btn cancel" id="noteCancel">بستن</button>
        <button class="modal-btn save-note" id="noteSave">💾 ذخیره</button>
      </div>
    </div>
  `;

  const ta = overlay.querySelector("#noteText");
  setTimeout(() => ta.focus(), 100);

  function close() { overlay.remove(); }

  function saveNote() {
    const text = ta.value.trim();
    row.note = text;
    if (text) {
      row.desc = "یادداشت";
      row.descType = "note";
      applyLabelStyle(label, "note");
    } else {
      row.desc = "";
      row.descType = "";
      applyLabelStyle(label, "");
    }
    saveRow(row);
    showToast("✅ یادداشت ذخیره شد", "success");
    close();
  }

  overlay.querySelector("#noteCancel").onclick = close;
  overlay.querySelector("#noteSave").onclick = saveNote;

  ta.onkeydown = (e) => {
    if (e.ctrlKey && e.key === "Enter") saveNote();
  };
}

function escapeHtml(str) {
  return (str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* ============================================================
   8) مودال تقویم بزرگ
   ============================================================ */
function openBigCalendar() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  document.body.appendChild(overlay);

  let today = new Date();
  let current = toJalaali(today);
  let viewYear = current.jy;
  let viewMonth = current.jm;
  let rows = [];

  overlay.innerHTML = `
    <div class="modal-box wide">
      <div class="modal-title calendar">📅 تقویم ثبت‌ها</div>
      <div class="big-calendar">
        <div class="big-cal-header">
          <button class="big-cal-nav" id="calPrev">‹</button>
          <div class="big-cal-title" id="calTitle"></div>
          <button class="big-cal-nav" id="calNext">›</button>
        </div>
        <div class="big-cal-grid" id="calGrid"></div>
      </div>
      <div style="margin-top: 16px;">
        <button class="modal-btn cancel" id="calClose" style="width: 100%;">بستن</button>
      </div>
    </div>
  `;

  const titleEl = overlay.querySelector("#calTitle");
  const gridEl = overlay.querySelector("#calGrid");

  function getRowsByDate() {
    const map = {};
    rows.forEach(r => {
      if (r.date) {
        if (!map[r.date]) map[r.date] = [];
        map[r.date].push(r);
      }
    });
    return map;
  }

  function render() {
    titleEl.textContent = MONTHS_FA[viewMonth - 1] + " " + viewYear;
    gridEl.innerHTML = "";
    ["ش","ی","د","س","چ","پ","ج"].forEach(d => {
      const el = document.createElement("div");
      el.className = "big-cal-dayname";
      el.textContent = d;
      gridEl.appendChild(el);
    });
    const firstDay = toGregorian(viewYear, viewMonth, 1).getDay();
    const offset = (firstDay + 1) % 7;
    for (let i = 0; i < offset; i++) {
      const el = document.createElement("div");
      el.className = "big-cal-empty";
      gridEl.appendChild(el);
    }

    const rowsByDate = getRowsByDate();
    const len = jalaaliMonthLength(viewYear, viewMonth);

    for (let d = 1; d <= len; d++) {
      const el = document.createElement("div");
      el.className = "big-cal-day";
      el.textContent = d;

      const dateKey = viewYear + "/" + String(viewMonth).padStart(2,"0") + "/" + String(d).padStart(2,"0");

      if (viewYear === current.jy && viewMonth === current.jm && d === current.jd) {
        el.classList.add("today");
      }

      if (rowsByDate[dateKey] && rowsByDate[dateKey].length > 0) {
        el.classList.add("has-data");
        const types = new Set();
        rowsByDate[dateKey].forEach(r => {
          if (r.descType) types.add(r.descType);
        });
        types.forEach(t => {
          el.classList.add("has-" + t);
        });
      }

      let clickCount = 0;
      let clickTimer = null;

      el.onclick = () => {
        clickCount++;
        if (clickCount === 1) {
          clickTimer = setTimeout(() => {
            clickCount = 0;
            if (rowsByDate[dateKey] && rowsByDate[dateKey].length > 0) {
              overlay.remove();
              openDayRows(dateKey, rowsByDate[dateKey]);
            }
          }, 450);
        } else if (clickCount >= 3) {
          clearTimeout(clickTimer);
          clickCount = 0;
          openAssignRowToDateModal(dateKey, rows, overlay);
        }
      };

      gridEl.appendChild(el);
    }
  }

  async function loadAndRender() {
    rows = await getAllRows();
    render();
  }

  overlay.querySelector("#calPrev").onclick = () => {
    viewMonth--;
    if (viewMonth < 1) { viewMonth = 12; viewYear--; }
    render();
  };
  overlay.querySelector("#calNext").onclick = () => {
    viewMonth++;
    if (viewMonth > 12) { viewMonth = 1; viewYear++; }
    render();
  };
  overlay.querySelector("#calClose").onclick = () => overlay.remove();

  loadAndRender();
}

/* ============================================================
   8.5) مودال تغییر تاریخ ردیف به روز انتخاب‌شده تقویم
   ============================================================ */
function openAssignRowToDateModal(targetDateKey, allRows, calOverlay) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  document.body.appendChild(overlay);

  if (!allRows || allRows.length === 0) {
    overlay.innerHTML = `
      <div class="modal-box wide">
        <div class="modal-title calendar">📅 تغییر تاریخ ردیف</div>
        <div class="modal-text">هیچ ردیفی برای تغییر تاریخ پیدا نشد.</div>
        <button class="modal-btn cancel" id="assignClose" style="width: 100%;">بستن</button>
      </div>
    `;
    overlay.querySelector("#assignClose").onclick = () => overlay.remove();
    return;
  }

  let html = `
    <div class="modal-box wide">
      <div class="modal-title calendar">📅 تغییر تاریخ ردیف به ${targetDateKey}</div>
      <div class="modal-text">یک ردیف را انتخاب کنید تا تاریخ آن به ${targetDateKey} تغییر یابد:</div>
      <div class="day-rows-list">
  `;

  allRows.forEach((r, idx) => {
    const typeLabel = r.desc || `ردیف ${idx + 1}`;
    const typeCls = r.descType || "";
    const amount = r.amount ? formatWithCommas(removeCommas(r.amount)) : "—";
    const curDate = r.date ? ` (تاریخ فعلی: ${r.date})` : "";
    html += `
      <button class="day-row-item" data-id="${r.id}">
        <span class="row-type ${typeCls}">${typeLabel}${curDate}</span>
        <span class="row-amount">${amount}</span>
      </button>
    `;
  });

  html += `
      </div>
      <button class="modal-btn cancel" id="assignClose" style="width: 100%;">انصراف</button>
    </div>
  `;

  overlay.innerHTML = html;
  overlay.querySelector("#assignClose").onclick = () => overlay.remove();

  overlay.querySelectorAll(".day-row-item").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id ? Number(btn.dataset.id) : null;
      const targetRow = allRows.find(r => r.id === id);
      if (targetRow) {
        const now = new Date();
        const timeStr = formatTime(now);
        targetRow.date = targetDateKey;
        const stamp = `📅 ${targetDateKey} - ${timeStr}`;
        targetRow.lastStamp = stamp;
        targetRow.note = stamp;

        if (targetRow.id) await updateRowInDB(targetRow);
        showToast(`✅ تاریخ ردیف با موفقیت به ${targetDateKey} تغییر یافت`, "success");
        overlay.remove();
        if (calOverlay) calOverlay.remove();

        tableBody.innerHTML = "";
        const updatedRows = await getAllRows();
        updatedRows.forEach(r => appendRowPair(r));
        recolorCheckedRows();

        scrollToRowAndPulse(targetRow.id);
      }
    };
  });
}

function scrollToRowAndPulse(id) {
  const tr = tableBody.querySelector(`tr.main-row[data-id="${id}"]`);
  if (!tr) {
    showToast("⚠️ ردیف پیدا نشد", "error");
    return;
  }

  tr.scrollIntoView({ behavior: "smooth", block: "center" });

  setTimeout(() => {
    tr.classList.add("pulse-flash");
    const prev = tr.previousElementSibling;
    const next = tr.nextElementSibling;
    if (prev && prev.classList.contains("row-header")) prev.classList.add("pulse-flash");
    if (next && next.classList.contains("desc-row")) next.classList.add("pulse-flash");
    setTimeout(() => {
      tr.classList.remove("pulse-flash");
      if (prev && prev.classList.contains("row-header")) prev.classList.remove("pulse-flash");
      if (next && next.classList.contains("desc-row")) next.classList.remove("pulse-flash");
    }, 1600);
  }, 400);
}

/* ============================================================
   11) رنگ‌بندی متناوب
   ============================================================ */
function recolorCheckedRows() {
  const allRows = tableBody.querySelectorAll("tr.main-row");
  let count = 0;

  allRows.forEach(tr => {
    tr.classList.remove("checked-yellow", "checked-blue");
    const prev = tr.previousElementSibling;
    if (prev && prev.classList.contains("row-header")) {
      prev.classList.remove("checked-yellow", "checked-blue");
    }

    const cb = tr.querySelector(".check-col input.main-check");
    if (cb && cb.checked) {
      const cls = (count % 2 === 0) ? "checked-yellow" : "checked-blue";
      tr.classList.add(cls);
      if (prev && prev.classList.contains("row-header")) {
        prev.classList.add(cls);
      }
      count++;
    }
  });
}

/* ============================================================
   12) حالت حذف
   ============================================================ */
let deleteMode = false;

function enterDeleteMode() {
  deleteMode = true;
  document.body.classList.add("delete-mode");
  deleteActions.classList.add("show");

  tableBody.querySelectorAll("tr.main-row").forEach(tr => {
    const tdCheck = tr.querySelector(".check-col");
    if (!tdCheck) return;
    const mainCheck = tdCheck.querySelector(".main-check");
    if (mainCheck) mainCheck.style.display = "none";

    let delCheck = tdCheck.querySelector(".del-check");
    if (!delCheck) {
      delCheck = document.createElement("input");
      delCheck.type = "checkbox";
      delCheck.className = "del-check";
      delCheck.onchange = () => {
        const isChecked = delCheck.checked;
        tr.classList.toggle("marked-for-delete", isChecked);
        const prev = tr.previousElementSibling;
        if (prev && prev.classList.contains("row-header")) {
          prev.classList.toggle("marked-for-delete", isChecked);
        }
      };
      tdCheck.appendChild(delCheck);
    }
    delCheck.checked = false;
    tr.classList.remove("marked-for-delete");
    const prev = tr.previousElementSibling;
    if (prev && prev.classList.contains("row-header")) {
      prev.classList.remove("marked-for-delete");
    }
  });
}

function exitDeleteMode() {
  deleteMode = false;
  document.body.classList.remove("delete-mode");
  deleteActions.classList.remove("show");

  tableBody.querySelectorAll("tr.main-row").forEach(tr => {
    const tdCheck = tr.querySelector(".check-col");
    if (!tdCheck) return;
    const mainCheck = tdCheck.querySelector(".main-check");
    if (mainCheck) mainCheck.style.display = "";
    const delCheck = tdCheck.querySelector(".del-check");
    if (delCheck) delCheck.remove();
    tr.classList.remove("marked-for-delete");
    const prev = tr.previousElementSibling;
    if (prev && prev.classList.contains("row-header")) {
      prev.classList.remove("marked-for-delete");
    }
  });
}

async function performDeleteSelected() {
  const toDelete = [];
  tableBody.querySelectorAll("tr.main-row").forEach(tr => {
    const delCheck = tr.querySelector(".del-check");
    if (delCheck && delCheck.checked) {
      toDelete.push(tr);
    }
  });

  if (toDelete.length === 0) {
    showToast("⚠️ هیچ ردیفی برای حذف انتخاب نشده", "info");
    return;
  }

  confirmDeleteThreeStep(async () => {
    for (const tr of toDelete) {
      const id = tr.dataset.id ? Number(tr.dataset.id) : null;
      if (id) await deleteRowFromDB(id);
      const prev = tr.previousElementSibling;
      const next = tr.nextElementSibling;
      tr.remove();
      if (prev && prev.classList.contains("row-header")) prev.remove();
      if (next && next.classList.contains("desc-row")) next.remove();
    }
    showToast(`✅ ${toDelete.length} ردیف حذف شد`, "success");
    exitDeleteMode();
    recolorCheckedRows();
  });
}

function confirmDeleteThreeStep(onConfirm) {
  let step = 1;
  let expectedCode = "";

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  document.body.appendChild(overlay);

  function close() { overlay.remove(); }

  function render() {
    if (step === 1) {
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-progress">
            <span class="active"></span><span></span><span></span>
          </div>
          <div class="modal-icon">🗑️</div>
          <div class="modal-title">حذف ردیف‌ها</div>
          <div class="modal-text">آیا مطمئنی می‌خوای ردیف‌های انتخاب‌شده رو حذف کنی؟</div>
          <div class="modal-buttons">
            <button class="modal-btn cancel" id="mCancel">انصراف</button>
            <button class="modal-btn confirm-step1" id="mNext">بله، ادامه</button>
          </div>
        </div>
      `;
      overlay.querySelector("#mCancel").onclick = close;
      overlay.querySelector("#mNext").onclick = () => { step = 2; render(); };
    } else if (step === 2) {
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-progress">
            <span class="active"></span><span class="active"></span><span></span>
          </div>
          <div class="modal-icon">⚠️</div>
          <div class="modal-title">مطمئنی؟</div>
          <div class="modal-text">این کار <b>برگشت‌پذیر نیست</b>.<br>اطلاعات برای همیشه پاک می‌شه.</div>
          <div class="modal-buttons">
            <button class="modal-btn cancel" id="mCancel">انصراف</button>
            <button class="modal-btn confirm-step2" id="mNext">ادامه می‌دم</button>
          </div>
        </div>
      `;
      overlay.querySelector("#mCancel").onclick = close;
      overlay.querySelector("#mNext").onclick = () => {
        step = 3;
        expectedCode = String(Math.floor(Math.random() * 90) + 10);
        render();
      };
    } else if (step === 3) {
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-progress">
            <span class="active"></span><span class="active"></span><span class="active"></span>
          </div>
          <div class="modal-icon">🔐</div>
          <div class="modal-title">تأیید نهایی</div>
          <div class="modal-text">این عدد رو وارد کن تا حذف بشه:</div>
          <div class="modal-code">${expectedCode}</div>
          <input type="text" class="modal-input" id="mCodeInput" inputmode="numeric" placeholder="--" maxlength="2" autocomplete="off">
          <div class="modal-buttons">
            <button class="modal-btn cancel" id="mCancel">انصراف</button>
            <button class="modal-btn confirm" id="mConfirm">حذف کن</button>
          </div>
        </div>
      `;
      const inp = overlay.querySelector("#mCodeInput");
      setTimeout(() => inp.focus(), 100);

      inp.oninput = () => {
        inp.value = toEnglishDigits(inp.value).replace(/[^0-9]/g, "").slice(0, 2);
      };

      inp.onkeydown = (e) => {
        if (e.key === "Enter") overlay.querySelector("#mConfirm").click();
      };

      overlay.querySelector("#mCancel").onclick = close;
      overlay.querySelector("#mConfirm").onclick = () => {
        if (inp.value === expectedCode) {
          close();
          onConfirm();
        } else {
          inp.classList.add("error");
          inp.value = "";
          setTimeout(() => inp.classList.remove("error"), 400);
        }
      };
    }
  }

  render();
}

    if (check.checked) {
      const now = new Date();
      const dateStr = formatJalaliDate(now);

      row.date = dateStr;
      const stamp = `📅 ${dateStr} - ${timeStr}`;

  };
  tdCheck.appendChild(check);

  const tdUnit = document.createElement("td");
  const inpUnit = document.createElement("input");
  inpUnit.type = "text";
  inpUnit.inputMode = "numeric";

  inpAmount.value = formatWithCommas(removeCommas(row.amount || ""));
  inpAmount.placeholder = "0";
  tdAmount.appendChild(inpAmount);
  tr.appendChild(tdAmount);
  autoSizeInput(inpAmount);

  const calculateAutoAmount = () => {
    const u = parseFloat(row.unitPrice) || 0;
    const q = parseFloat(row.quantity) || 0;
    if (u > 0 && q > 0) {
      const calcAmt = Math.round(u * q);
      const rawAmt = String(calcAmt);
      row.amount = rawAmt;
      inpAmount.value = formatWithCommas(rawAmt);
      autoSizeInput(inpAmount);
    }
  };

  inpUnit.oninput = () => {
    const raw = cleanNumber(inpUnit.value);
    const formatted = formatWithCommas(raw);
    const posFromEnd = inpUnit.value.length - inpUnit.selectionStart;
    inpUnit.value = formatted;
    const newPos = Math.max(0, formatted.length - posFromEnd);
    inpUnit.setSelectionRange(newPos, newPos);
    autoSizeInput(inpUnit);
    row.unitPrice = raw;
    calculateAutoAmount();
    saveRow(row);
  };

  inpQty.oninput = () => {
    const raw = cleanNumber(inpQty.value);
    const formatted = formatWithCommas(raw);
    const posFromEnd = inpQty.value.length - inpQty.selectionStart;
    inpQty.value = formatted;
    const newPos = Math.max(0, formatted.length - posFromEnd);
    inpQty.setSelectionRange(newPos, newPos);
    autoSizeInput(inpQty);
    row.quantity = raw;
    calculateAutoAmount();
    saveRow(row);
  };

  inpAmount.oninput = () => {
    const raw = cleanNumber(inpAmount.value);
    const formatted = formatWithCommas(raw);
    const posFromEnd = inpAmount.value.length - inpAmount.selectionStart;
    inpAmount.value = formatted;
    const newPos = Math.max(0, formatted.length - posFromEnd);
    inpAmount.setSelectionRange(newPos, newPos);
    autoSizeInput(inpAmount);
    row.amount = raw;
    saveRow(row);
  };

  const tdDescMain = document.createElement("td");
  tdDescMain.colSpan = 4;

  wrap.className = "desc-row-content";

  const descHalf = document.createElement("div");
  descHalf.className = "desc-cell";

  const shineWrap = document.createElement("div");
  shineWrap.className = "shine-wrap";

  const label = document.createElement("div");
  label.className = "txt-3d";

  const descType = row.descType || detectDescType(row.desc || "");
  if (descType) {
    label.classList.add(descType);
    label.textContent = DESC_TYPES[descType] ? DESC_TYPES[descType].label : "";
  }

  const btnHam = document.createElement("button");
  btnHam.type = "button";
  btnHam.className = "action-btn hamburger-btn";
  btnHam.textContent = "☰";
  btnHam.onclick = (e) => {
    e.stopPropagation();
    openDescMenu(btnHam, label, row);
  };

  shineWrap.appendChild(label);
  descHalf.appendChild(shineWrap);
  descHalf.appendChild(btnHam);

  wrap.appendChild(descHalf);
  tdDescMain.appendChild(wrap);
  trDesc.appendChild(tdDescMain);

  return { headerRow: trHeader, mainRow: tr, descRow: trDesc };
}

async function backupData() {
  const rows = await getAllRows();
  const capital = await loadCapital();

  const backup = {
    app: "GrowthDB",
    version: 1,
    date: new Date().toISOString(),
    capital: capital,
    rows: rows
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const now = new Date();
  const dateStr = formatJalaliDate(now).replace(/\//g, "-");
  const timeStr = String(now.getHours()).padStart(2,"0") + String(now.getMinutes()).padStart(2,"0");
  const filename = `growth-backup-${dateStr}-${timeStr}.json`;

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function restoreData(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || !Array.isArray(data.rows)) {
          reject(new Error("فایل معتبر نیست"));
          return;
        }

        await clearAllRows();

        for (const r of data.rows) {
          const newRow = {
            unitPrice: r.unitPrice || "",
            quantity: r.quantity || "",
            amount: r.amount || "",
            date: r.date || "",
            desc: r.desc || "",
            descType: r.descType || "",
            note: r.note || "",
            lastStamp: r.lastStamp || "",
            checked: !!r.checked
          };
          await addRowToDB(newRow);
        }

        if (data.capital !== undefined) {
          await saveCapital(data.capital || "");
        }

        resolve(data);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

function showToast(msg, type = "info") {

  t.textContent = msg;

    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 14px;
    z-index: 99999;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    animation: fadeIn 0.2s;

  `;

    t.style.transition = "opacity 0.3s";

}

const addRowBtn = document.getElementById("addRowBtn");
const capitalInput = document.getElementById("capital");
const backupBtn = document.getElementById("backupBtn");
const restoreBtn = document.getElementById("restoreBtn");
const restoreInput = document.getElementById("restoreInput");
const deleteModeBtn = document.getElementById("deleteModeBtn");
const deleteActions = document.getElementById("deleteActions");
const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
const calendarBtn = document.getElementById("calendarBtn");

function appendRowPair(row) {
  const pair = createRowElement(row);
  if (pair.headerRow) tableBody.appendChild(pair.headerRow);
  tableBody.appendChild(pair.mainRow);
  tableBody.appendChild(pair.descRow);
}

async function init() {
  await openDB();
  const cap = await loadCapital();
  capitalInput.value = formatWithCommas(cap || "");

  const rows = await getAllRows();
  if (rows.length === 0) {
    await addNewRow();
  } else {
    rows.forEach(r => appendRowPair(r));
    recolorCheckedRows();
  }
}

async function addNewRow() {
  const newRow = {
    unitPrice: "",
    quantity: "",
    amount: "",
    date: "",
    desc: "",
    descType: "",
    note: "",
    lastStamp: "",
    checked: false
  };
  const id = await addRowToDB(newRow);
  newRow.id = id;
  appendRowPair(newRow);
}

addRowBtn.onclick = addNewRow;

capitalInput.addEventListener("input", () => {
  const raw = cleanNumber(capitalInput.value);
  const formatted = formatWithCommas(raw);
  const posFromEnd = capitalInput.value.length - capitalInput.selectionStart;
  capitalInput.value = formatted;
  const newPos = Math.max(0, formatted.length - posFromEnd);
  capitalInput.setSelectionRange(newPos, newPos);
});
let capTimer = null;
capitalInput.addEventListener("change", () => {
  clearTimeout(capTimer);
  capTimer = setTimeout(() => saveCapital(removeCommas(capitalInput.value)), 300);
});

backupBtn.onclick = async () => {
  closeDropdown();
  try {
    await backupData();
    showToast("✅ فایل پشتیبان دانلود شد", "success");
  } catch (e) {
    showToast("❌ خطا در پشتیبان‌گیری: " + e.message, "error");
  }
};

restoreBtn.onclick = () => {
  closeDropdown();
  restoreInput.click();
};

restoreInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const ok = confirm("⚠️ بازیابی همه داده‌های فعلی رو جایگزین می‌کنه.\nادامه می‌دی؟");
  if (!ok) {
    restoreInput.value = "";
    return;
  }

  try {
    await restoreData(file);
    showToast("✅ بازیابی با موفقیت انجام شد", "success");
    tableBody.innerHTML = "";
    const cap = await loadCapital();
    capitalInput.value = formatWithCommas(cap || "");
    const rows = await getAllRows();
    if (rows.length === 0) {
      await addNewRow();
    } else {
      rows.forEach(r => appendRowPair(r));
      recolorCheckedRows();
    }
  } catch (e) {
    showToast("❌ خطا در بازیابی: " + e.message, "error");
  }
  restoreInput.value = "";
};

calendarBtn.onclick = () => {
  closeDropdown();
  openBigCalendar();
};

deleteModeBtn.onclick = () => {
  closeDropdown();
  enterDeleteMode();
};

cancelDeleteBtn.onclick = () => {
  exitDeleteMode();
  showToast("لغو حالت حذف", "info");
};

confirmDeleteBtn.onclick = performDeleteSelected;


init();
</script>

</body>
</html>
