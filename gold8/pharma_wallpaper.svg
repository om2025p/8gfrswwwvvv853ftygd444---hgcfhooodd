<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .icon { fill: none; stroke: #2dd4bf; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.12; }
  </style>

  <!-- Capsule 1 -->
  <g class="icon" transform="translate(25, 25) rotate(35)">
    <rect x="-12" y="-22" width="24" height="44" rx="12" />
    <line x1="-12" y1="0" x2="12" y2="0" />
  </g>

  <!-- Pill 1 -->
  <g class="icon" transform="translate(145, 35)">
    <circle cx="0" cy="0" r="16" />
    <line x1="-12" y1="-12" x2="12" y2="12" />
  </g>

  <!-- Medical Cross -->
  <g class="icon" transform="translate(85, 95)">
    <path d="M -6 -18 H 6 V -6 H 18 V 6 H 6 V 18 H -6 V 6 H -18 V -6 H -6 Z" />
  </g>

  <!-- Medicine Bottle -->
  <g class="icon" transform="translate(155, 145)">
    <rect x="-12" y="-8" width="24" height="6" rx="2" />
    <path d="M -10 -2 H 10 V 22 C 10 25, 8 27, 4 27 H -4 C -8 27, -10 25, -10 22 Z" />
    <line x1="-6" y1="8" x2="6" y2="8" />
    <line x1="-6" y1="15" x2="6" y2="15" />
  </g>

  <!-- Syringe -->
  <g class="icon" transform="translate(35, 145) rotate(-45)">
    <rect x="-5" y="-15" width="10" height="30" rx="1" />
    <line x1="0" y1="-15" x2="0" y2="-24" />
    <line x1="-8" y1="15" x2="8" y2="15" />
    <line x1="0" y1="15" x2="0" y2="22" />
  </g>
</svg>
