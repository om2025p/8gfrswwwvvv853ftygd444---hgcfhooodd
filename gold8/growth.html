<body>

<div class="container">
  <div class="header">
    <h1>💊 مدیریت رشد · فارما کیان</h1>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="dropdown-menu" id="dropdownMenu">
      <button class="dropdown-item" id="addRowBtn">➕ افزودن ردیف جدید</button>
      <button class="dropdown-item" id="backupBtn">💾 پشتیبان‌گیری</button>
      <button class="dropdown-item" id="restoreBtn">📂 بازیابی</button>
      <button class="dropdown-item danger" id="deleteModeBtn">🗑️ حذف گروهی</button>
      <input type="file" id="restoreInput" accept=".json,application/json" style="display:none">
    </div>
  </div>

  <div class="capital-box">
    <label for="capital">سرمایه فعلی:</label>
    <input type="text" id="capital" inputmode="numeric" placeholder="0" autocomplete="off">
  </div>

  <div class="delete-actions" id="deleteActions">
    <button class="delete-action-btn confirm-delete" id="confirmDeleteBtn">✅ تأیید حذف</button>
    <button class="delete-action-btn cancel-delete" id="cancelDeleteBtn">❌ انصراف</button>
  </div>

  <div class="table-wrap">
    <table id="mainTable">
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const DB_NAME = "GrowthDB_gold8";
const DB_VERSION = 1;
const STORE_NAME = "rows";
const CAPITAL_STORE = "settings";
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
      }
      if (!database.objectStoreNames.contains(CAPITAL_STORE)) {
        database.createObjectStore(CAPITAL_STORE, { keyPath: "key" });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function addRowToDB(row) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).add(row);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function updateRowInDB(row) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).put(row);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function deleteRowFromDB(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function getAllRows() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function clearAllRows() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const req = tx.objectStore(STORE_NAME).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function saveCapital(value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CAPITAL_STORE, "readwrite");
    const req = tx.objectStore(CAPITAL_STORE).put({ key: "capital", value: value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function loadCapital() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CAPITAL_STORE, "readonly");
    const req = tx.objectStore(CAPITAL_STORE).get("capital");
    req.onsuccess = () => resolve(req.result ? req.result.value : "");
    req.onerror = () => reject(req.error);
  });
}

function toEnglishDigits(str) {
  if (!str) return "";
  return str.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧۸٩".indexOf(d));
}

function cleanNumber(str) {
  return toEnglishDigits(str).replace(/[^0-9.]/g, "");
}

function formatWithCommas(numStr) {
  if (!numStr) return "";
  const parts = numStr.split(".");
  let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  if (parts.length > 1) return intPart + "." + parts[1];
  return intPart;
}

function removeCommas(str) {
  return (str || "").replace(/,/g, "");
}

const menuToggle = document.getElementById("menuToggle");
const dropdownMenu = document.getElementById("dropdownMenu");

menuToggle.onclick = (e) => {
  e.stopPropagation();
  dropdownMenu.classList.toggle("show");
};

document.addEventListener("click", (e) => {
  if (!dropdownMenu.contains(e.target) && e.target !== menuToggle) {
    dropdownMenu.classList.remove("show");
  }
});

function closeDropdown() { dropdownMenu.classList.remove("show"); }

const tableBody = document.getElementById("tableBody");
const addRowBtn = document.getElementById("addRowBtn");
const capitalInput = document.getElementById("capital");
const backupBtn = document.getElementById("backupBtn");
const restoreBtn = document.getElementById("restoreBtn");
const restoreInput = document.getElementById("restoreInput");

async function init() {
  await openDB();
  const cap = await loadCapital();
  capitalInput.value = formatWithCommas(cap || "");

  const rows = await getAllRows();
  if (rows.length === 0) {
    await addNewRow();
  } else {
    rows.forEach(r => prependRowPair(r));
  }
}

function createRowElement(row) {
  const trHeader = document.createElement("tr");
  trHeader.className = "row-header";

  const thCheck = document.createElement("th");
  thCheck.textContent = "✔";

  const thUnit = document.createElement("th");
  thUnit.textContent = "قیمت واحد";

  const thQty = document.createElement("th");
  thQty.textContent = "تعداد واحد";

  const thAmount = document.createElement("th");
  thAmount.textContent = "مقدار واحد";

  trHeader.appendChild(thCheck);
  trHeader.appendChild(thUnit);
  trHeader.appendChild(thQty);
  trHeader.appendChild(thAmount);

  const tr = document.createElement("tr");
  tr.className = "main-row";
  tr.dataset.id = row.id || "";

  const tdCheck = document.createElement("td");
  const check = document.createElement("input");
  check.type = "checkbox";
  check.className = "main-check";
  check.checked = !!row.checked;
  check.onchange = async () => {
    row.checked = check.checked;
    if (row.id) await updateRowInDB(row);
  };
  tdCheck.appendChild(check);
  tr.appendChild(tdCheck);

  const tdUnit = document.createElement("td");
  const inpUnit = document.createElement("input");
  inpUnit.type = "text";
  inpUnit.className = "num";
  inpUnit.value = formatWithCommas(removeCommas(row.unitPrice || ""));
  inpUnit.placeholder = "0";
  tdUnit.appendChild(inpUnit);
  tr.appendChild(tdUnit);

  const tdQty = document.createElement("td");
  const inpQty = document.createElement("input");
  inpQty.type = "text";
  inpQty.className = "num";
  inpQty.value = formatWithCommas(removeCommas(row.quantity || ""));
  inpQty.placeholder = "0";
  tdQty.appendChild(inpQty);
  tr.appendChild(tdQty);

  const tdAmount = document.createElement("td");
  const inpAmount = document.createElement("input");
  inpAmount.type = "text";
  inpAmount.className = "num";
  inpAmount.value = formatWithCommas(removeCommas(row.amount || ""));
  inpAmount.placeholder = "0";
  tdAmount.appendChild(inpAmount);
  tr.appendChild(tdAmount);

  const calculateAutoAmount = () => {
    const u = parseFloat(row.unitPrice) || 0;
    const q = parseFloat(row.quantity) || 0;
    if (u > 0 && q > 0) {
      const calcAmt = Math.round(u * q);
      row.amount = String(calcAmt);
      inpAmount.value = formatWithCommas(row.amount);
    }
  };

  inpUnit.oninput = () => {
    const raw = cleanNumber(inpUnit.value);
    inpUnit.value = formatWithCommas(raw);
    row.unitPrice = raw;
    calculateAutoAmount();
    saveRow(row);
  };

  inpQty.oninput = () => {
    const raw = cleanNumber(inpQty.value);
    inpQty.value = formatWithCommas(raw);
    row.quantity = raw;
    calculateAutoAmount();
    saveRow(row);
  };

  inpAmount.oninput = () => {
    const raw = cleanNumber(inpAmount.value);
    inpAmount.value = formatWithCommas(raw);
    row.amount = raw;
    saveRow(row);
  };

  return { headerRow: trHeader, mainRow: tr };
}

function saveRow(row) {
  if (!row.id) return;
  updateRowInDB(row);
}

function prependRowPair(row) {
  const pair = createRowElement(row);
  const first = tableBody.firstChild;
  if (first) {
    tableBody.insertBefore(pair.headerRow, first);
    tableBody.insertBefore(pair.mainRow, first);
  } else {
    tableBody.appendChild(pair.headerRow);
    tableBody.appendChild(pair.mainRow);
  }
}

async function addNewRow() {
  const newRow = { unitPrice: "", quantity: "", amount: "", checked: false };
  const id = await addRowToDB(newRow);
  newRow.id = id;
  prependRowPair(newRow);
}

addRowBtn.onclick = async () => {
  closeDropdown();
  await addNewRow();
};

backupBtn.onclick = async () => {
  closeDropdown();
  const rows = await getAllRows();
  const capital = await loadCapital();
  const backup = { app: "GrowthDB_gold8", version: 1, capital, rows };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `pharma_kian_growth_backup_${Date.now()}.json`;
  a.click();
};

restoreBtn.onclick = () => {
  closeDropdown();
  restoreInput.click();
};

restoreInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data && Array.isArray(data.rows)) {
        await clearAllRows();
        for (const r of data.rows) await addRowToDB(r);
        if (data.capital) await saveCapital(data.capital);
        tableBody.innerHTML = "";
        await init();
        alert("✅ بازیابی انجام شد");
      }
    } catch(err) { alert("فایل معتبر نیست"); }
  };
  reader.readAsText(file);
};

init();
</script>
</body>
</html>
