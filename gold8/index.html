<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d9488">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="../cloud-sync.js"></script>
    <title>ثبت درصد 8</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
            background-color: #042f2e;
        }
        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .tabs {
            display: flex;
            background: linear-gradient(135deg, #0d9488, #0284c7, #10b981, #06b6d4, #14b8a6);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
            z-index: 100;
            transition: background 0.3s;
        }
        .tab {
            flex: 1;
            padding: 14px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            font-size: 0.82rem;
            border-bottom: 3px solid transparent;
            opacity: 0.85;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .tab.active {
            opacity: 1;
            background: rgba(255,255,255,0.22);
            border-bottom: 3px solid #ffffff;
        }
        .tab-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .tab-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: none;
            border: none;
        }
        .tab-content.active {
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">📊 ثبت درصد</div>
            <div class="tab" onclick="switchTab(1)">🏆 محاسبه تغییرات</div>
            <div class="tab" onclick="switchTab(2)">🏷️ ثبت ابطال</div>
            <div class="tab" onclick="switchTab(3)">📈 مدیریت رشد</div>
        </div>
        <div class="tab-container">
            <div id="content0" class="tab-content active">
                <iframe src="percent.html"></iframe>
            </div>
            <div id="content1" class="tab-content">
                <iframe src="calculator.html"></iframe>
            </div>
            <div id="content2" class="tab-content">
                <iframe src="price.html"></iframe>
            </div>
            <div id="content3" class="tab-content">
                <iframe src="growth.html"></iframe>
            </div>
        </div>
    </div>

    <script>
        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((c, i) => {
                c.classList.toggle('active', i === index);
            });

            const themeColor = document.querySelector('meta[name="theme-color"]');
            const tabsHeader = document.querySelector('.tabs');

            if (index === 0) {
                themeColor.setAttribute('content', '#0d9488');
                tabsHeader.style.background = 'linear-gradient(135deg, #0d9488, #0284c7, #10b981, #06b6d4, #14b8a6)';
            } else if (index === 1) {
                themeColor.setAttribute('content', '#0284c7');
                tabsHeader.style.background = 'linear-gradient(135deg, #0284c7, #06b6d4, #0d9488, #10b981, #14b8a6)';
            } else if (index === 2) {
                themeColor.setAttribute('content', '#10b981');
                tabsHeader.style.background = 'linear-gradient(135deg, #10b981, #14b8a6, #0d9488, #0284c7, #06b6d4)';
            } else if (index === 3) {
                themeColor.setAttribute('content', '#06b6d4');
                tabsHeader.style.background = 'linear-gradient(135deg, #06b6d4, #0d9488, #10b981, #14b8a6, #0284c7)';
            }
        }
    </script>
</body>
</html>
