<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#d32f2f">

    <!-- تکنیک‌های بهینه‌سازی سرعت و اتصال پیش‌فرض -->
    <link rel="preconnect" href="https://yandex.com" crossorigin>
    <link rel="preconnect" href="https://yastatic.net" crossorigin>
    <link rel="dns-prefetch" href="https://yandex.com">
    <link rel="dns-prefetch" href="https://yastatic.net">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>جستجوگر عکس یاندکس</title>
    <style>
        :root {
            --bg-color: #0d0606;
            --primary-red: #d32f2f;
            --primary-gradient: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a0808 0%, #050101 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
        }

        /* هدر اپلیکیشن همراه با دکمه بازگشت و انتقال ساطع‌کننده سرعت */
        header {
            height: 54px;
            background: rgba(18, 5, 5, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-badge {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 2px 8px rgba(211, 47, 47, 0.4);
        }

        h1 {
            font-size: 1.05rem;
            margin: 0;
            font-weight: 700;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 6px 14px;
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .action-btn:hover, .action-btn:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.97);
        }

        /* اسپلش لودینگ هایپراسپید */
        .splash-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .y-icon-large {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.8rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 12px 35px rgba(211, 47, 47, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            animation: pulseGlow 1.8s infinite ease-in-out;
            user-select: none;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 35px rgba(211, 47, 47, 0.5); }
            50% { transform: scale(1.04); box-shadow: 0 18px 45px rgba(229, 57, 53, 0.7); }
        }

        .loader-bar {
            width: 180px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--primary-gradient);
            border-radius: 4px;
            animation: loadProgress 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 75%; }
            100% { width: 100%; }
        }

        .status-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .launch-direct-btn {
            background: var(--primary-gradient);
            border: none;
            border-radius: 16px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            transition: transform 0.2s ease;
        }

        .launch-direct-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <a href="../index.html" class="action-btn">
                <span>◀ بازگشت</span>
            </a>
            <h1>جستجوگر عکس یاندکس</h1>
        </div>
        <div class="app-badge">Y</div>
    </header>

    <div class="splash-screen" id="splash">
        <div class="y-icon-large">Y</div>
        <div style="font-size: 1.25rem; font-weight: 800;">در حال ورود به یاندکس عکس...</div>
        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>
        <div class="status-text" id="statusMsg">در حال بارگذاری سریع با بالاترین سرعت ⚡</div>

        <button class="launch-direct-btn" onclick="openYandexDirect()">
            <span>🔍 ورود فوری به موتور عکس</span>
        </button>
    </div>

    <script>
        const YANDEX_TARGET_URL = "https://yandex.com/images";

        function openYandexDirect() {
            window.location.href = YANDEX_TARGET_URL;
        }

        // انتقال فوق‌سریع اتوماتیک
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                openYandexDirect();
            }, 500);
        });
    </script>
</body>
</html>
