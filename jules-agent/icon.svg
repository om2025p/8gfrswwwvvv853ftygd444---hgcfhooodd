<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.5" />

  <circle cx="256" cy="256" r="180" fill="url(#primaryGrad)" opacity="0.25" filter="url(#glow)" />

  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentCyan)" stroke-width="6" stroke-dasharray="24 12" opacity="0.6" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2" />

  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="130" fill="url(#primaryGrad)" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 290 160 L 290 280 C 290 330 250 360 210 335 C 180 310 185 270 205 260 C 220 250 240 265 235 280 C 230 295 210 290 220 305 C 230 315 255 310 255 280 L 255 160 Z" fill="#FFFFFF" />
    <path d="M 180 180 L 220 180 L 195 230 L 230 230 L 170 300 L 185 245 L 155 245 Z" fill="url(#accentCyan)" filter="url(#glow)" />
  </g>

  <circle cx="120" cy="140" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="390" cy="130" r="8" fill="#818cf8" filter="url(#glow)" />
  <circle cx="400" cy="370" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="110" cy="380" r="5" fill="#ffffff" opacity="0.8" />
</svg>