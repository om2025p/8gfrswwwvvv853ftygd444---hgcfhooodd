<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script src="../storage-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روند میانگین روزانه · محاسبه رشد</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link href="../vendor/inter/inter.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: linear-gradient(145deg, #f0f4fa 0%, #dce3ed 100%);
            --bg-card: #ffffff;
            --bg-amount: #f8faff;
            --text-primary: #0b1a33;
            --text-secondary: #5b6e8c;
            --text-muted: #8a9bb5;
            --border-color: #eef2f8;
            --shadow: 0 20px 60px rgba(0, 20, 50, 0.12);
            --accent: #2563eb;
            --green: #10b981;
            --red: #ef4444;
        }
        [data-theme="dark"] {
            --bg-body: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            --bg-card: #1e293b;
            --bg-amount: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--bg-body);
            padding: 14px;
            color: var(--text-primary);
            transition: background 0.3s ease;
        }
        .wrap { max-width: 560px; margin: 0 auto; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .title { font-size: 16px; font-weight: 800; color: var(--text-primary); }
        .back-btn {
            min-height: 44px; padding: 8px 14px; border-radius: 40px;
            border: 1px solid var(--border-color); background: var(--bg-card);
            color: var(--text-primary); font-family: inherit; font-size: 12px;
            font-weight: 700; cursor: pointer;
        }
        .back-btn:hover { border-color: var(--accent); }
        .card {
            background: var(--bg-card); border-radius: 22px; padding: 16px;
            box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }
        .card-title { font-size: 12px; font-weight: 800; color: var(--text-primary); }
        .symbol-card {
            background: var(--bg-card); border-radius: 22px; padding: 16px;
            box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }
        .symbol-card .sym { font-size: 22px; font-weight: 900; color: var(--accent); }
        .symbol-card .name { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .symbol-card .meta { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.8; }
        .period-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
        .period-card {
            min-height: 68px; border: 1.5px solid var(--border-color); border-radius: 14px;
            background: var(--bg-amount); color: var(--text-primary); padding: 8px 6px;
            font-family: inherit; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 2px;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }
        .period-card:hover { border-color: var(--accent); transform: translateY(-1px); }
        .period-card.active { border-color: var(--accent); background: rgba(37, 99, 235, 0.1); box-shadow: 0 0 0 1px var(--accent) inset; }
        .period-label { font-size: 10px; color: var(--text-muted); font-weight: 700; }
        .period-value { font-size: 15px; font-weight: 900; direction: ltr; unicode-bidi: isolate; }
        .period-value.green { color: var(--green); }
        .period-value.red { color: var(--red); }
        .period-value.muted { color: var(--text-muted); }
        .period-sub { font-size: 8.5px; color: var(--text-muted); }
        .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .chart-period { font-size: 10px; font-weight: 800; color: var(--accent); background: rgba(37, 99, 235, 0.1); border-radius: 999px; padding: 3px 8px; }
        .chart-wrap { width: 100%; overflow: hidden; }
        #trendCanvas { display: block; width: 100%; height: 230px; }
        .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 8px 0 10px; font-size: 9.5px; color: var(--text-muted); }
        .legend span { display: inline-flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.green { background: var(--green); }
        .dot.red { background: var(--red); }
        .line { width: 14px; height: 0; border-top: 2px solid var(--accent); display: inline-block; }
        .line.dashed { border-top: 2px dashed var(--text-muted); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .info-box { background: var(--bg-amount); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 10px; text-align: center; }
        .info-box .lbl { font-size: 9.5px; color: var(--text-muted); margin-bottom: 3px; }
        .info-box .val { font-size: 14px; font-weight: 900; direction: ltr; unicode-bidi: isolate; }
        .info-box .val.green { color: var(--green); }
        .info-box .val.red { color: var(--red); }
        .info-box .val.blue { color: var(--accent); }
        .download-btn {
            width: 100%; min-height: 48px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
            font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); margin-bottom: 14px;
        }
        .download-btn:hover { transform: translateY(-1px); }
        .empty-state { text-align: center; padding: 28px 16px; }
        .empty-icon { font-size: 36px; margin-bottom: 8px; }
        .empty-title { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
        .empty-desc { font-size: 11px; color: var(--text-muted); line-height: 1.9; margin-bottom: 12px; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(16px);
            background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color);
            border-radius: 40px; padding: 10px 16px; font-size: 12px; font-weight: 700;
            box-shadow: var(--shadow); opacity: 0; visibility: hidden; transition: all 0.25s;
            z-index: 3000; display: flex; align-items: center; gap: 6px;
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        @media (max-width: 360px) {
            .period-grid { grid-template-columns: 1fr 1fr; }
        }

    /* سایهٔ دکمهٔ به‌روزرسانی در حالت مخفی حذف شود (تب دوم) */
    .emr-rb:not(.open) .emr-rb-btn {
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
    }
</style>
</head>
<body>
<div class="wrap">
    <header class="topbar">
        <button class="back-btn" id="backBtn">← بازگشت</button>
        <div class="title">📈 روند میانگین روزانه</div>
    </header>

    <div id="symbolHead"></div>

    <div id="trendDownload">
        <div class="card periods-card">
            <div class="card-title">📊 بازه‌های زمانی</div>
            <div class="period-grid" id="periodGrid"></div>
        </div>

        <div class="card chart-card">
            <div class="chart-head">
                <div class="card-title">📈 روند روزانه</div>
                <div class="chart-period" id="chartPeriod">—</div>
            </div>
            <div class="chart-wrap">
                <canvas id="trendCanvas" aria-label="نمودار روند میانگین رشد روزانه"></canvas>
            </div>
            <div class="legend">
                <span><i class="dot green"></i> رشد روز</span>
                <span><i class="dot red"></i> افت روز</span>
                <span><i class="line blue"></i> میانگین متحرک ۷ روزه</span>
                <span><i class="line dashed"></i> میانگین بازه</span>
            </div>
            <div class="info-grid" id="trendSummary"></div>
        </div>
    </div>

    <button class="download-btn" id="downloadBtn">📸 دانلود تصویر</button>

    <div class="empty-state card" id="emptyState" hidden>
        <div class="empty-icon">📭</div>
        <div class="empty-title">داده‌ای برای این نماد پیدا نشد</div>
        <div class="empty-desc">به تب «محاسبه رشد» برگرد، نماد را دوباره انتخاب کن و بعد دوباره این صفحه را باز کن.</div>
        <button class="back-btn" id="emptyBackBtn">← بازگشت به محاسبه رشد</button>
    </div>
</div>

<div class="toast" id="toast">
    <span id="toastIcon">✓</span>
    <span id="toastText"></span>
</div>

<script src="../vendor/html2canvas/html2canvas.min.js"></script>
<script src="growth-stats.js"></script>
<script>
(function () {
    'use strict';

    const SYMBOL_KEY = 'liquidity_growth_trend_symbol_v1';
    const META_KEY = 'liquidity_growth_trend_meta_v1';
    const PERIOD_KEY = 'liquidity_growth_trend_period_v1';
    const CACHE_KEY = 'symbolsCache';
    const THEME_KEY = 'liquidity_growth_theme_v1';
    const LEGACY_THEME_KEY = 'growthTheme';
    const LAST_KEY = 'liquidity_growth_last_v1';
    const LEGACY_LAST_KEY = 'lastSymbol';

    const params = new URLSearchParams(window.location.search);
    let symbol = params.get('symbol') || localStorage.getItem(SYMBOL_KEY) || localStorage.getItem(LAST_KEY) || localStorage.getItem(LEGACY_LAST_KEY) || '';
    let meta = {};
    try { meta = JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch (e) {}
    if (!meta || meta.symbol !== symbol) meta = { symbol: symbol };

    let data = null;
    let entry = null;
    try {
        const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        entry = cache[symbol] || null;
        if (entry && Array.isArray(entry.data)) data = entry.data;
    } catch (e) {}

    let periodKey = localStorage.getItem(PERIOD_KEY) || 'm1';
    if (!GrowthStats.PERIODS.some(function (p) { return p.key === periodKey; })) periodKey = 'm1';
    let lastSeries = null;

    const $ = function (id) { return document.getElementById(id); };

    function formatNumber(n) { return Number(n || 0).toLocaleString('en-US'); }
    function shortDate(value) {
        const parts = String(value || '').replace(/-/g, '/').split('/').filter(Boolean);
        if (parts.length >= 2) return parts[parts.length - 2].padStart(2, '0') + '/' + parts[parts.length - 1].padStart(2, '0');
        return String(value || '').slice(-5);
    }
    function themeName() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }
    function applyTheme(theme) {
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        if (lastSeries) drawChart(lastSeries);
    }
    function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY) || localStorage.getItem(LEGACY_THEME_KEY); } catch (e) {}
        applyTheme(saved === 'dark' ? 'dark' : 'light');
        try {
            if (window.self !== window.top) {
                const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
                if (parentTheme) applyTheme(parentTheme === 'dark' ? 'dark' : 'light');
            }
        } catch (e) {}
    }
    window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'emarat-theme') applyTheme(e.data.theme === 'dark' ? 'dark' : 'light');
    });

    function showToast(text, icon) {
        const toast = $('toast');
        $('toastIcon').textContent = icon || '✓';
        $('toastText').textContent = text;
        toast.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
    }

    function renderSymbolHead(allTime) {
        const head = $('symbolHead');
        const lastPrice = allTime ? allTime.lastPrice : (data && data.length ? Number(data[data.length - 1].pc) : 0);
        const lastUpdate = meta.lastUpdate || (entry && entry.lastUpdateText) || '';
        head.innerHTML = '<div class="symbol-card">' +
            '<div class="sym">' + (symbol || '—') + '</div>' +
            '<div class="name">' + (meta.name || '') + '</div>' +
            '<div class="meta">آخرین قیمت: ' + formatNumber(lastPrice) + ' ریال' + (lastUpdate ? ' · ' + lastUpdate : '') + '</div>' +
            '</div>';
    }

    function renderPeriods() {
        const grid = $('periodGrid');
        grid.innerHTML = GrowthStats.PERIODS.map(function (p) {
            const result = GrowthStats.periodResult(data, p);
            const value = result ? result.avgSimple : null;
            const cls = value == null ? 'muted' : (value >= 0 ? 'green' : 'red');
            const text = value == null ? '—' : (value >= 0 ? '+' : '') + value.toFixed(3) + '%';
            return '<button class="period-card' + (p.key === periodKey ? ' active' : '') + '" data-period="' + p.key + '" aria-pressed="' + (p.key === periodKey) + '">' +
                '<span class="period-label">' + p.label + '</span>' +
                '<span class="period-value ' + cls + '">' + text + '</span>' +
                '<span class="period-sub">روزانه</span>' +
                '</button>';
        }).join('');
        grid.querySelectorAll('.period-card').forEach(function (btn) {
            btn.addEventListener('click', function () {
                periodKey = btn.dataset.period;
                try { localStorage.setItem(PERIOD_KEY, periodKey); } catch (e) {}
                grid.querySelectorAll('.period-card').forEach(function (b) {
                    const active = b.dataset.period === periodKey;
                    b.classList.toggle('active', active);
                    b.setAttribute('aria-pressed', String(active));
                });
                renderTrend();
            });
        });
    }

    function renderTrend() {
        const period = GrowthStats.PERIODS.find(function (p) { return p.key === periodKey; }) || GrowthStats.PERIODS[1];
        $('chartPeriod').textContent = period.label;
        const series = GrowthStats.buildTrendSeries(data, period);
        lastSeries = series;
        if (!series) {
            $('trendSummary').innerHTML = '<div class="empty-chart">دادهٔ کافی برای این بازه نیست.</div>';
            drawChart(null);
            return;
        }
        const s = series.stats;
        $('trendSummary').innerHTML =
            '<div class="info-box"><div class="lbl">📊 میانگین روزانه</div><div class="val ' + (s.avgSimple >= 0 ? 'green' : 'red') + '">' + (s.avgSimple >= 0 ? '+' : '') + s.avgSimple.toFixed(3) + '%</div></div>' +
            '<div class="info-box"><div class="lbl">🎯 رشد کل بازه</div><div class="val ' + (s.totalGrowth >= 0 ? 'green' : 'red') + '">' + (s.totalGrowth >= 0 ? '+' : '') + s.totalGrowth.toFixed(1) + '%</div></div>' +
            '<div class="info-box"><div class="lbl">🟢 روزهای مثبت</div><div class="val green">' + formatNumber(s.positiveCount) + '</div></div>' +
            '<div class="info-box"><div class="lbl">🔴 روزهای منفی</div><div class="val red">' + formatNumber(s.negativeCount) + '</div></div>';
        drawChart(series);
    }

    function drawChart(series) {
        const canvas = $('trendCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const wrap = canvas.parentElement;
        const width = Math.max(260, Math.floor(wrap.clientWidth || 320));
        const height = 230;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.direction = 'ltr';
        ctx.clearRect(0, 0, width, height);
        if (!series || !series.growths.length) return;

        const cs = getComputedStyle(document.documentElement);
        const textColor = cs.getPropertyValue('--text-muted').trim() || '#64748b';
        const gridColor = cs.getPropertyValue('--border-color').trim() || '#e2e8f0';
        const green = '#10b981';
        const red = '#ef4444';
        const blue = '#2563eb';

        const left = 44;
        const right = 12;
        const top = 14;
        const bottom = 30;
        const plotW = width - left - right;
        const plotH = height - top - bottom;

        const values = series.growths.map(function (p) { return p.growth; }).concat(series.rolling);
        let min = Math.min(0, ...values);
        let max = Math.max(0, ...values);
        if (max === min) { min -= 1; max += 1; }
        const pad = (max - min) * 0.12;
        min -= pad;
        max += pad;
        const y = function (v) { return top + (max - v) / (max - min) * plotH; };

        ctx.font = '10px Inter, sans-serif';
        ctx.fillStyle = textColor;
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        const gridSteps = 4;
        for (let i = 0; i <= gridSteps; i++) {
            const value = max - (i / gridSteps) * (max - min);
            const gy = top + (i / gridSteps) * plotH;
            ctx.beginPath();
            ctx.moveTo(left, gy);
            ctx.lineTo(left + plotW, gy);
            ctx.stroke();
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(value.toFixed(2) + '%', left - 6, gy);
        }

        const zeroY = y(0);
        if (min < 0 && max > 0) {
            ctx.beginPath();
            ctx.moveTo(left, zeroY);
            ctx.lineTo(left + plotW, zeroY);
            ctx.strokeStyle = textColor;
            ctx.globalAlpha = 0.35;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        const maxBars = 120;
        const step = Math.max(1, Math.ceil(series.growths.length / maxBars));
        const sampled = [];
        for (let i = 0; i < series.growths.length; i += step) {
            sampled.push({ growth: series.growths[i].growth, rolling: series.rolling[i], date: series.growths[i].date });
        }
        if (sampled.length && sampled[sampled.length - 1].date !== series.growths[series.growths.length - 1].date) {
            const last = series.growths.length - 1;
            sampled.push({ growth: series.growths[last].growth, rolling: series.rolling[last], date: series.growths[last].date });
        }

        const slot = plotW / Math.max(1, sampled.length);
        const barW = Math.max(1, Math.min(12, slot * 0.62));
        sampled.forEach(function (point, index) {
            const x = left + (index + 0.5) * slot;
            const gy = y(point.growth);
            ctx.fillStyle = point.growth >= 0 ? green : red;
            const barTop = Math.min(gy, zeroY);
            const barHeight = Math.max(1, Math.abs(zeroY - gy));
            ctx.fillRect(x - barW / 2, barTop, barW, barHeight);
        });

        ctx.beginPath();
        sampled.forEach(function (point, index) {
            const x = left + (index + 0.5) * slot;
            const gy = y(point.rolling);
            if (index === 0) ctx.moveTo(x, gy);
            else ctx.lineTo(x, gy);
        });
        ctx.strokeStyle = blue;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = textColor;
        ctx.lineWidth = 1.2;
        const avgY = y(series.stats.avgSimple);
        ctx.moveTo(left, avgY);
        ctx.lineTo(left + plotW, avgY);
        ctx.stroke();
        ctx.setLineDash([]);

        const labelCount = Math.min(6, sampled.length);
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = '9px Inter, sans-serif';
        const used = new Set();
        for (let i = 0; i < labelCount; i++) {
            const index = labelCount === 1 ? 0 : Math.round(i * (sampled.length - 1) / (labelCount - 1));
            if (used.has(index)) continue;
            used.add(index);
            const x = left + (index + 0.5) * slot;
            ctx.fillText(shortDate(sampled[index].date), x, height - 20);
        }
    }

    async function downloadAsImage() {
        const target = $('trendDownload');
        if (!target) return;
        try {
            const bg = themeName() === 'dark' ? '#0f172a' : '#eef2f7';
            const canvas = await html2canvas(target, { backgroundColor: bg, scale: 2, useCORS: true, logging: false });
            const link = document.createElement('a');
            link.download = 'growth-trend-' + (symbol || 'symbol') + '-' + periodKey + '.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('تصویر ذخیره شد', '📸');
        } catch (e) {
            showToast('خطا در ساخت تصویر', '⚠️');
        }
    }

    function goBack() {
        if (history.length > 1) history.back();
        else window.location.href = 'growth.html';
    }

    function init() {
        initTheme();
        $('backBtn').addEventListener('click', goBack);
        $('emptyBackBtn').addEventListener('click', function () { window.location.href = 'growth.html'; });

        const allTime = GrowthStats.calcAvgGrowth(data);
        if (!data || !allTime) {
            $('trendDownload').hidden = true;
            $('downloadBtn').hidden = true;
            $('emptyState').hidden = false;
            $('symbolHead').innerHTML = '';
            return;
        }

        renderSymbolHead(allTime);
        renderPeriods();
        renderTrend();
        $('downloadBtn').addEventListener('click', downloadAsImage);
        window.addEventListener('resize', function () {
            clearTimeout(init._resizeTimer);
            init._resizeTimer = setTimeout(function () { if (lastSeries) drawChart(lastSeries); }, 150);
        });
    }

    init();
})();
</script>
<script src="../refresh-button.js"></script>
<script src="../usage-tracker.js" data-app="liquidity-growth-trend"></script>
</body>
</html>
