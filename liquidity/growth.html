<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script src="../storage-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ماشین‌حساب رشد نمادها</title>
<link rel="icon" type="image/png" href="icon-192.png" />
<link href="../vendor/inter/inter.css" rel="stylesheet" />
<script src="../vendor/html2canvas/html2canvas.min.js"></script>
<style>
    :root {
        --bg-body: linear-gradient(145deg, #f0f4fa 0%, #dce3ed 100%);
        --bg-card: #ffffff;
        --bg-amount: #f8faff;
        --text-primary: #0b1a33;
        --text-secondary: #5b6e8c;
        --text-muted: #8a9bb5;
        --border-color: #eef2f8;
        --shadow: 0 20px 60px rgba(0, 20, 50, 0.12);
    }
    [data-theme="dark"] {
        --bg-body: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        --bg-card: #1e293b;
        --bg-amount: #0f172a;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border-color: #334155;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        background: var(--bg-body);
        padding: 14px;
        transition: background 0.3s ease;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .card {
        background: var(--bg-card);
        border-radius: 26px;
        padding: 22px 18px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.05);
        margin-bottom: 14px;
    }
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }
    .title {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .title-icon { font-size: 22px; }
    .btn {
        background: var(--bg-amount);
        border: 1px solid var(--border-color);
        border-radius: 40px;
        padding: 8px 14px;
        min-height: 44px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
    }
    .btn:hover { background: var(--border-color); color: var(--text-primary); }
    .btn.spinning { animation: spin 1s linear infinite; }
    .btn.primary {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: #fff;
        border-color: #2563eb;
    }
    .btn.primary:hover { background: linear-gradient(135deg, #1d4ed8, #1e3a8a); color: #fff; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .token-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: var(--bg-amount);
        border: 1px solid var(--border-color);
        border-radius: 40px;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 12px;
    }
    .token-badge.active {
        border-color: #10b981;
        color: #10b981;
        background: rgba(16, 185, 129, 0.1);
    }

    .search-section {
        position: relative;
        margin-bottom: 16px;
    }
    .search-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
    }
    .search-input-wrap .search-icon {
        position: absolute;
        right: 14px;
        font-size: 16px;
        color: var(--text-muted);
        pointer-events: none;
    }
    .search-input-wrap input {
        width: 100%;
        padding: 13px 44px 13px 42px;
        background: var(--bg-amount);
        border: 2px solid var(--border-color);
        border-radius: 14px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
        cursor: text;
        outline: none;
        transition: border-color 0.2s;
        text-align: right;
    }
    .search-input-wrap input:focus { border-color: #2563eb; }
    .search-input-wrap input::placeholder { color: var(--text-muted); font-weight: 500; }
    .search-input-wrap .clear-btn {
        position: absolute;
        left: 12px;
        background: transparent;
        border: none;
        font-size: 18px;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 50%;
        transition: all 0.2s;
        display: none;
    }
    .search-input-wrap .clear-btn:hover { background: var(--border-color); color: var(--text-primary); }
    .search-input-wrap .clear-btn.show { display: block; }

    .search-results {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        background: var(--bg-card);
        border: 2px solid var(--border-color);
        border-radius: 14px;
        max-height: 320px;
        overflow-y: auto;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        display: none;
    }
    .search-results.show { display: block; }
    .search-results::-webkit-scrollbar { width: 6px; }
    .search-results::-webkit-scrollbar-track { background: var(--bg-amount); border-radius: 10px; }
    .search-results::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

    .result-item {
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-color);
        transition: background 0.15s;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover, .result-item.active { background: var(--bg-amount); }
    .result-item .result-info { flex: 1; min-width: 0; }
    .result-item .result-symbol {
        font-size: 14px;
        font-weight: 800;
        color: #2563eb;
        margin-bottom: 2px;
    }
    .result-item .result-name {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .result-item .result-type {
        font-size: 9px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 40px;
        background: var(--bg-amount);
        color: var(--text-secondary);
        white-space: nowrap;
    }
    .result-item .result-type.ahrami {
        background: linear-gradient(135deg, #fef3c7, #fde68a);
        color: #92400e;
    }
    .result-item .result-type.sandogh {
        background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        color: #1e40af;
    }
    [data-theme="dark"] .result-item .result-type.ahrami {
        background: linear-gradient(135deg, #78350f, #92400e);
        color: #fcd34d;
    }
    [data-theme="dark"] .result-item .result-type.sandogh {
        background: linear-gradient(135deg, #1e3a5f, #1e40af);
        color: #93c5fd;
    }
    .no-results {
        padding: 24px 16px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
    }
    .search-hint {
        padding: 10px 16px;
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
        background: var(--bg-amount);
        border-bottom: 1px solid var(--border-color);
    }

    .saved-section {
        margin-bottom: 16px;
        padding: 14px;
        background: var(--bg-amount);
        border-radius: 14px;
        border: 1px dashed var(--border-color);
    }
    .saved-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    .saved-title {
        font-size: 12px;
        font-weight: 800;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .saved-clear {
        font-size: 11px;
        color: var(--text-muted);
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 20px;
        transition: all 0.2s;
        background: transparent;
        border: none;
        font-family: inherit;
    }
    .saved-clear:hover {
        background: #fee2e2;
        color: #dc2626;
    }
    [data-theme="dark"] .saved-clear:hover {
        background: #7f1d1d;
        color: #fca5a5;
    }
    .saved-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .saved-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: var(--bg-card);
        border: 1.5px solid var(--border-color);
        border-radius: 40px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
    }
    .saved-chip:hover {
        border-color: #2563eb;
        background: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(37,99,235,0.15));
        transform: translateY(-1px);
    }
    .saved-chip.active {
        border-color: #2563eb;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: #fff;
    }
    .saved-chip .remove {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(0,0,0,0.1);
        font-size: 10px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .saved-chip .remove:hover {
        background: #ef4444;
        color: #fff;
    }
    .saved-chip.active .remove {
        background: rgba(255,255,255,0.2);
    }
    .saved-chip.active .remove:hover {
        background: #ef4444;
    }

    .selected-symbol {
        background: var(--bg-amount);
        border: 2px solid #2563eb;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    .selected-symbol .info { flex: 1; min-width: 0; }
    .selected-symbol .sym {
        font-size: 16px;
        font-weight: 800;
        color: #2563eb;
        margin-bottom: 2px;
    }
    .selected-symbol .name {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .selected-actions {
        display: flex;
        gap: 6px;
        align-items: center;
    }
    .icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1.5px solid var(--border-color);
        background: var(--bg-card);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--text-secondary);
    }
    .icon-btn:hover {
        border-color: #2563eb;
        color: #2563eb;
        transform: scale(1.1);
    }
    .icon-btn.saved {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        border-color: #f59e0b;
        color: #fff;
    }

    /* ===== کارت نماد ===== */
    .symbol-card {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        border-radius: 18px;
        padding: 18px 16px;
        color: #fff;
        text-align: center;
        margin-bottom: 16px;
    }
    .symbol-card .sym {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 4px;
        font-family: 'Inter', sans-serif;
        text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .symbol-card .name {
        font-size: 13px;
        font-weight: 500;
        opacity: 0.9;
        line-height: 1.4;
    }
    .symbol-card .type {
        display: inline-block;
        margin-top: 8px;
        padding: 3px 12px;
        background: rgba(255,255,255,0.2);
        border-radius: 40px;
        font-size: 10px;
        font-weight: 700;
    }

    .main-stat {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border-radius: 18px;
        padding: 22px 16px;
        margin-bottom: 14px;
        text-align: center;
        color: #fff;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
    }
    .main-stat .lbl { font-size: 13px; font-weight: 700; opacity: 0.9; margin-bottom: 10px; }
    .main-stat .val {
        font-family: 'Inter', 'Courier New', monospace;
        font-size: 42px;
        font-weight: 800;
        direction: ltr;
        unicode-bidi: plaintext;
        line-height: 1.1;
        text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .main-stat .unit { font-size: 20px; font-weight: 700; opacity: 0.9; margin-right: 4px; }
    .main-stat .desc { font-size: 11px; opacity: 0.85; margin-top: 8px; }
    .main-stat.negative {
        background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
    }

    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
    }
    .info-box {
        background: var(--bg-amount);
        border-radius: 14px;
        padding: 14px 10px;
        text-align: center;
        border: 1px solid var(--border-color);
    }
    .info-box .lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .info-box .val {
        font-family: 'Inter', 'Courier New', monospace;
        font-size: 17px;
        font-weight: 800;
        direction: ltr;
        unicode-bidi: plaintext;
        color: var(--text-primary);
    }
    .info-box .val.green { color: #10b981; }
    .info-box .val.red { color: #ef4444; }
    .info-box .val.blue { color: #2563eb; }
    .info-box .val.orange { color: #f59e0b; }

    .periods-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-secondary);
        margin: 16px 0 10px;
        padding-top: 16px;
        border-top: 1px solid var(--border-color);
        text-align: center;
    }
    .periods-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .period-box {
        background: var(--bg-amount);
        border-radius: 12px;
        padding: 12px 8px;
        text-align: center;
        border: 1px solid var(--border-color);
    }
    .period-box .period-lbl { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .period-box .period-val {
        font-family: 'Inter', 'Courier New', monospace;
        font-size: 15px;
        font-weight: 800;
        direction: ltr;
        unicode-bidi: plaintext;
    }
    .period-box .period-val.green { color: #10b981; }
    .period-box .period-val.red { color: #ef4444; }
    .period-box .period-sub { font-size: 9px; color: var(--text-muted); margin-top: 3px; }

    /* ===== دکمه‌های عملیات ===== */
    .action-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--border-color);
    }
    .action-btn {
        padding: 12px 14px;
        border-radius: 14px;
        border: none;
        font-family: inherit;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }
    .action-btn.download {
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        color: #fff;
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .action-btn.download:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
    }
    .action-btn.refresh {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #fff;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .action-btn.refresh:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }
    .action-btn.trend {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .action-btn.trend:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }
    .action-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .status {
        text-align: center;
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 14px;
        display: none;
    }
    .status.show { display: block; }
    .status.loading { background: #1e3a5f; color: #93c5fd; }
    .status.success { background: #064e3b; color: #6ee7b7; }
    .status.error { background: #7f1d1d; color: #fca5a5; }
    .status.warning { background: #78350f; color: #fcd34d; }

    .info-bar {
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 8px;
        line-height: 1.6;
    }
    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
        font-size: 14px;
    }
    .empty-state .empty-icon {
        font-size: 40px;
        display: block;
        margin-bottom: 12px;
        opacity: 0.5;
    }

    .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        padding: 12px 20px;
        border-radius: 40px;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        transition: transform 0.3s ease;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.warning {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
    }

    @media (max-width: 480px) {
        .card { padding: 16px 12px; border-radius: 18px; }
        .title { font-size: 15px; }
        .symbol-card .sym { font-size: 26px; }
        .main-stat .val { font-size: 34px; }
        .main-stat .unit { font-size: 16px; }
        .info-box .val { font-size: 14px; }
        .period-box .period-val { font-size: 13px; }
        .search-input-wrap input { font-size: 13px; padding: 11px 40px 11px 38px; }
        .saved-chip { font-size: 11px; padding: 5px 8px; }
        .action-btn { font-size: 12px; padding: 10px 12px; }
    }

    /* ===== App shell + drawer layout ===== */
    body { display: block; }
    .app-shell { max-width: 980px; width: 100%; margin: 0 auto; }
    .app-topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .app-title { font-size: 16px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .app-actions { display: flex; gap: 8px; align-items: center; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
    body.drawer-closed .layout { grid-template-columns: minmax(0, 1fr); }
    body.drawer-closed .fav-drawer { display: none; }
    .content { min-width: 0; }
    .content .card { margin: 0 auto; }
    .content > .search-section {
        max-width: 520px; margin: 0 auto 12px;
        background: var(--bg-card); border: 1px solid var(--border-color);
        border-radius: 16px; padding: 12px; box-shadow: var(--shadow);
    }
    .content > .search-section .search-results {
        position: static; max-height: 280px; margin-top: 8px; box-shadow: var(--shadow);
    }
    .fav-drawer { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); max-height: calc(100dvh - 110px); overflow-y: auto; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .drawer-title { font-size: 13px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .drawer-head-actions { display: flex; align-items: center; gap: 6px; }
    .drawer-close { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--bg-amount); color: var(--text-primary); font-size: 14px; cursor: pointer; flex-shrink: 0; }
    .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: linear-gradient(135deg, #2563eb, #1e40af); color: #fff; font-size: 11px; }
    .fav-drawer .saved-list { display: flex; flex-direction: column; flex-wrap: nowrap; gap: 8px; max-height: calc(100dvh - 190px); overflow-y: auto; }
    .saved-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1.5px solid var(--border-color); border-radius: 12px; background: var(--bg-amount); cursor: pointer; min-height: 44px; transition: all .2s; }
    .saved-row:hover { border-color: #2563eb; }
    .saved-row.active { border-color: #2563eb; background: linear-gradient(135deg, rgba(37,99,235,.1), rgba(37,99,235,.18)); }
    .saved-row .saved-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .saved-row .saved-symbol { font-size: 13px; font-weight: 800; color: var(--text-primary); }
    .saved-row .saved-name { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .saved-row .remove { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(239,68,68,.12); color: #ef4444; font-size: 12px; cursor: pointer; }
    .result-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .star-toggle { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-muted); font-size: 16px; cursor: pointer; }
    .star-toggle.on { color: #f59e0b; border-color: #f59e0b; background: rgba(245,158,11,.12); }
    .drawer-hint { font-size: 11px; color: var(--text-muted); line-height: 1.8; margin-top: 10px; }
    .drawer-overlay { display: none; }

    /* Compact vertical lists inside the drawer */
    .fav-drawer .saved-list { gap: 5px; }
    .fav-drawer .saved-row { padding: 4px 8px; min-height: 44px; gap: 6px; border-radius: 10px; }
    .fav-drawer .saved-row .saved-symbol { font-size: 12px; }
    .fav-drawer .saved-row .saved-name { font-size: 9px; margin-top: 0; }
    .fav-drawer .saved-row .remove { width: 36px; height: 36px; font-size: 11px; position: relative; }
    .fav-drawer .saved-row .remove::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; }
    .fav-drawer .result-item { padding: 6px 8px; gap: 6px; }
    .fav-drawer .result-item .result-symbol { font-size: 12px; margin-bottom: 0; }
    .fav-drawer .result-item .result-name { font-size: 9px; }
    .fav-drawer .result-item .result-type { font-size: 8px; padding: 2px 6px; }
    .fav-drawer .star-toggle { width: 36px; height: 36px; font-size: 14px; position: relative; }
    .fav-drawer .star-toggle::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; }

    /* Delete confirmation modal */
    .confirm-overlay {
        position: fixed; inset: 0; z-index: 2000;
        background: rgba(0,0,0,.55);
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
    }
    .confirm-modal {
        width: 100%; max-width: 360px;
        background: var(--bg-card); color: var(--text-primary);
        border: 1px solid var(--border-color); border-radius: 18px;
        padding: 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
        text-align: center;
    }
    .confirm-icon { font-size: 32px; margin-bottom: 6px; }
    .confirm-modal h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
    .confirm-modal p { font-size: 12px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 16px; }
    .confirm-modal p b { color: var(--text-primary); }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button { flex: 1; min-height: 44px; border-radius: 12px; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid var(--border-color); }
    .confirm-cancel { background: var(--bg-amount); color: var(--text-primary); }
    .confirm-danger { background: #c53030; color: #fff; border-color: #c53030; }
    .confirm-danger:hover { background: #9b1c1c; }

    @media (max-width: 820px) {
        .layout { display: block; }
        .fav-drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, 320px); z-index: 1002; transform: translateX(-105%); transition: transform .3s ease; border-radius: 0 18px 18px 0; padding: 16px; max-height: 100dvh; }
        body.drawer-open .fav-drawer { transform: translateX(0); }
        body.drawer-open .drawer-overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999; }
        .app-topbar { position: sticky; top: 0; z-index: 1001; background: var(--bg-body); padding: 8px 0; }
    }

    /* سایهٔ دکمهٔ به‌روزرسانی در حالت مخفی حذف شود (تب دوم) */
    .emr-rb:not(.open) .emr-rb-btn {
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
    }
</style>
</head>
<body>

<div class="app-shell">
    <header class="app-topbar">
        <div class="app-title"><span class="title-icon">📈</span> ماشین‌حساب رشد نماد</div>
        <div class="app-actions">
            <button class="btn" id="drawerToggle" title="باز/بسته کردن لیست">☰ لیست</button>
            <button class="btn" id="themeBtn">🌙 تم</button>
            <button class="btn" id="refreshBtn" title="به‌روزرسانی">🔄</button>
        </div>
    </header>

    <div class="layout" id="layout">
        <main class="content">
            <div class="search-section">
                <div class="search-input-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="جستجوی نماد... (مثلاً: گوهر، دوایکس، خودرو)" autocomplete="off" />
                    <button class="clear-btn" id="clearBtn" title="پاک کردن">✕</button>
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="card" id="mainCard">
                <div style="text-align: center;">
                    <div class="token-badge" id="tokenBadge">
                        <span>🔑</span>
                        <span id="tokenText">آماده</span>
                    </div>
                </div>

                <div class="status" id="status"></div>

                <div id="selectedArea"></div>

                <div id="resultArea">
                    <div class="empty-state">
                        <span class="empty-icon">🔍</span>
                        یه نماد جستجو کن و انتخاب کن
                    </div>
                </div>

                <div class="info-bar" id="lastUpdate"></div>
            </div>
        </main>

        <aside class="fav-drawer" id="favDrawer" aria-label="علاقه‌مندی‌ها">
            <div class="drawer-head">
                <div class="drawer-title">⭐ علاقه‌مندی‌ها <span class="count-badge" id="savedCount">۰</span></div>
                <div class="drawer-head-actions">
                    <button class="saved-clear" id="savedClear">پاک کردن همه</button>
                    <button class="drawer-close" id="drawerClose" title="بستن" aria-label="بستن">✕</button>
                </div>
            </div>
            <div class="saved-list" id="savedList"></div>
            <div class="drawer-hint" id="drawerHint">برای افزودن، از کادر جستجوی بالای صفحه استفاده کن · برای حذف: ✕ و تأیید.</div>
        </aside>
    </div>
</div>
<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="confirm-overlay" id="deleteOverlay" hidden>
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
        <div class="confirm-icon">🗑️</div>
        <h3 id="deleteTitle">حذف از علاقه‌مندی‌ها</h3>
        <p>نماد <b id="deleteSymbolName">—</b> از لیست ستاره‌ها حذف شود؟</p>
        <div class="confirm-actions">
            <button class="confirm-cancel" id="deleteCancelBtn">انصراف</button>
            <button class="confirm-danger" id="deleteConfirmBtn">🗑️ بله، پاک کن</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <span id="toastIcon">✓</span>
    <span id="toastText">ذخیره شد</span>
</div>

<script src="growth-stats.js"></script>
<script>
    // ============================================================
    // CONFIG — دو توکن
    // ============================================================
    const TOKENS = [
        { id: 1, name: 'توکن ۱', key: 'BJMPB79CukYE8bzAXLZPWhXVVXUXkxBm' },
        { id: 2, name: 'توکن ۲', key: 'BmGCjWFkKFNursGxwGzfVxJzHRnUZMAa' }
    ];

    const IS_MOCK = new URLSearchParams(location.search).get('mock') === '1';
    const API_BASE = IS_MOCK ? '../_incoming/mock/all.json' : 'https://Api.BrsApi.ir/Tsetmc/AllSymbols.php';
    const HISTORY_BASE = IS_MOCK ? '../_incoming/mock/history.json' : 'https://Api.BrsApi.ir/Tsetmc/History.php';
    const STORAGE_KEY = 'liquidity_growth_saved_v1';
    const LAST_KEY = 'liquidity_growth_last_v1';
    const TOKEN_KEY = 'liquidity_growth_token_v1';
    const CACHE_KEY = 'symbolsCache';  // ⭐ کش اطلاعات نمادها (کلید قدیمی حفظ می‌شود)
    const THEME_KEY = 'liquidity_growth_theme_v1';
    const LEGACY_STORAGE_KEY = 'savedSymbols';
    const LEGACY_LAST_KEY = 'lastSymbol';
    const LEGACY_TOKEN_KEY = 'activeTokenIndex';
    const LEGACY_THEME_KEY = 'growthTheme';
    const DEFAULTS_SEEDED_KEY = 'liquidity_growth_defaults_v1';
    const DEFAULT_SYMBOLS = ['مادیرا', 'زکشت', 'سبزوا', 'آبادا', 'کمرجان', 'تکپاد', 'مهرمام', 'شغدیر', 'نوری', 'سخوز'];

    // ============================================================
    // STATE
    // ============================================================
    let currentTheme = 'light';
    let allSymbolsList = [];
    let currentSymbol = '';
    let selectedIndex = -1;
    let filteredResults = [];
    let savedSymbols = [];
    let currentTokenIndex = 0;
    let symbolsCache = {};  // ⭐ کش برای هر نماد

    // ============================================================
    // DOM
    // ============================================================
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');
    const themeBtn = document.getElementById('themeBtn');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const searchResults = document.getElementById('searchResults');
    const selectedArea = document.getElementById('selectedArea');
    const resultArea = document.getElementById('resultArea');
    const lastUpdate = document.getElementById('lastUpdate');
    const savedList = document.getElementById('savedList');
    const savedClear = document.getElementById('savedClear');
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastText = document.getElementById('toastText');
    const tokenBadge = document.getElementById('tokenBadge');
    const tokenText = document.getElementById('tokenText');
    const savedCount = document.getElementById('savedCount');
    const savedHint = document.getElementById('drawerHint');
    const drawerToggle = document.getElementById('drawerToggle');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerClose = document.getElementById('drawerClose');
    const deleteOverlay = document.getElementById('deleteOverlay');
    const deleteSymbolName = document.getElementById('deleteSymbolName');
    const deleteCancelBtn = document.getElementById('deleteCancelBtn');
    const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
    let pendingDeleteSymbol = null;

    // ============================================================
    // THEME
    // ============================================================
    function applyTheme(theme) {
        const isDark = theme === 'dark';
        if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            currentTheme = 'dark';
            themeBtn.textContent = '☀️ تم';
        } else {
            document.documentElement.removeAttribute('data-theme');
            currentTheme = 'light';
            themeBtn.textContent = '🌙 تم';
        }
    }
    function toggleTheme() {
        applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}
        try { localStorage.setItem(LEGACY_THEME_KEY, currentTheme); } catch (e) {}
        if (window.self !== window.top) {
            try { window.parent.postMessage({ type: 'emarat-theme', theme: currentTheme }, '*'); } catch (e) {}
        }
    }
    function loadTheme() {
        let saved = null;
        try {
            saved = localStorage.getItem(THEME_KEY);
            if (saved === null) saved = localStorage.getItem(LEGACY_THEME_KEY);
        } catch (e) {}
        applyTheme(saved === 'dark' ? 'dark' : 'light');
    }
    themeBtn.addEventListener('click', toggleTheme);
    loadTheme();

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimer = null;
    function showToast(text, icon = '✓', warning = false) {
        toastIcon.textContent = icon;
        toastText.textContent = text;
        toast.className = 'toast show' + (warning ? ' warning' : '');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function showStatus(type, text) {
        statusEl.style.display = 'block';
        statusEl.className = 'status show ' + type;
        statusEl.textContent = text;
        if (type !== 'loading') {
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }
    }

    function getSymbolType(cs) {
        if (!cs) return { label: '—', cls: '' };
        if (cs.includes('اهرمی')) return { label: 'اهرمی', cls: 'ahrami' };
        if (cs.includes('صندوق')) return { label: 'صندوق', cls: 'sandogh' };
        return { label: 'سهام', cls: '' };
    }

    function updateTokenBadge(idx) {
        currentTokenIndex = idx;
        const t = TOKENS[idx];
        tokenText.textContent = `${t.name}`;
        tokenBadge.classList.add('active');
        try {
            localStorage.setItem(TOKEN_KEY, String(idx));
        } catch (e) {}
    }

    function resetTokenBadge() {
        tokenText.textContent = 'آماده';
        tokenBadge.classList.remove('active');
    }

    // ============================================================
    // ⭐ کش
    // ============================================================
    function loadCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            symbolsCache = raw ? JSON.parse(raw) : {};
        } catch (e) {
            symbolsCache = {};
        }
    }

    function saveCache() {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(symbolsCache));
        } catch (e) {
            console.warn('خطا در ذخیره کش:', e);
        }
    }

    function getFromCache(symbol) {
        return symbolsCache[symbol] || null;
    }

    function setToCache(symbol, data) {
        symbolsCache[symbol] = {
            data: data,
            timestamp: Date.now(),
            lastUpdateText: lastUpdate.textContent
        };
        saveCache();
    }

    function clearCache(symbol) {
        if (symbol) {
            delete symbolsCache[symbol];
        } else {
            symbolsCache = {};
        }
        saveCache();
    }

    // ============================================================
    // درخواست با Fallback
    // ============================================================
    async function fetchWithFallback(buildUrl) {
        let lastError = null;
        const order = [
            currentTokenIndex,
            ...TOKENS.map((_, i) => i).filter(i => i !== currentTokenIndex)
        ];

        for (const tokenIdx of order) {
            const token = TOKENS[tokenIdx];
            const url = buildUrl(token.key);

            try {
                updateTokenBadge(tokenIdx);

                const controller = new AbortController();
                const timer = setTimeout(function() { controller.abort(); }, 15000);
                const res = await fetch(url, {
                    signal: controller.signal,
                    headers: {
                        'Accept': 'application/json, text/plain, */*',
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                    }
                });
                clearTimeout(timer);

                if (res.status === 401 || res.status === 403) {
                    throw new Error(`توکن نامعتبر (${res.status})`);
                }
                if (res.status === 429) {
                    throw new Error(`محدودیت درخواست (429)`);
                }
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const data = await res.json();

                if (Array.isArray(data) && data.length > 0) {
                    if (tokenIdx !== currentTokenIndex) {
                        showToast(`سوییچ به ${token.name}`, '🔄', true);
                    }
                    updateTokenBadge(tokenIdx);
                    return data;
                }

                if (Array.isArray(data) && data.length === 0) {
                    lastError = new Error('داده‌ای یافت نشد');
                    continue;
                }

                if (data && data.error) {
                    throw new Error(data.error);
                }

                return data;

            } catch (err) {
                try { clearTimeout(timer); } catch (e2) {}
                console.warn(`❌ ${token.name} خطا: ${err.message}`);
                lastError = err;
            }
        }

        resetTokenBadge();
        throw lastError || new Error('هیچ توکنی کار نکرد');
    }

    // ============================================================
    // ذخیره‌سازی نمادها
    // ============================================================
    function loadSavedSymbols() {
        try {
            let raw = localStorage.getItem(STORAGE_KEY);
            if (raw === null) raw = localStorage.getItem(LEGACY_STORAGE_KEY);
            savedSymbols = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(savedSymbols)) savedSymbols = [];
        } catch (e) {
            savedSymbols = [];
        }
    }

    function saveSavedSymbols() {
        const json = JSON.stringify(savedSymbols);
        try {
            localStorage.setItem(STORAGE_KEY, json);
            localStorage.setItem(LEGACY_STORAGE_KEY, json);
            return true;
        } catch (e) {
            return false;
        }
    }

    function seedDefaultSymbols() {
        try {
            if (localStorage.getItem(DEFAULTS_SEEDED_KEY) === '1') return;
            const merged = savedSymbols.slice();
            DEFAULT_SYMBOLS.forEach(function (sym) {
                if (merged.indexOf(sym) === -1) merged.push(sym);
            });
            if (merged.length === savedSymbols.length) {
                localStorage.setItem(DEFAULTS_SEEDED_KEY, '1');
                return;
            }
            savedSymbols = merged;
            if (saveSavedSymbols()) {
                localStorage.setItem(DEFAULTS_SEEDED_KEY, '1');
            }
        } catch (e) {}
    }

    function isSymbolSaved(symbol) {
        return savedSymbols.includes(symbol);
    }

    function addSymbol(symbol) {
        if (!isSymbolSaved(symbol)) {
            savedSymbols.unshift(symbol);
            saveSavedSymbols();
            renderSavedSymbols();
            showToast(`${symbol} ذخیره شد`, '⭐');
        }
    }

    function removeSymbol(symbol) {
        const idx = savedSymbols.indexOf(symbol);
        if (idx > -1) {
            savedSymbols.splice(idx, 1);
            saveSavedSymbols();
            renderSavedSymbols();
            showToast(`${symbol} حذف شد`, '🗑️', true);
        }
    }

    function openDeleteModal(symbol) {
        pendingDeleteSymbol = symbol;
        if (deleteSymbolName) deleteSymbolName.textContent = symbol;
        if (deleteOverlay) {
            deleteOverlay.hidden = false;
            document.body.style.overflow = 'hidden';
            if (deleteCancelBtn) deleteCancelBtn.focus();
        }
    }

    function closeDeleteModal() {
        pendingDeleteSymbol = null;
        if (deleteOverlay) deleteOverlay.hidden = true;
        document.body.style.overflow = '';
    }

    function confirmDeleteSymbol() {
        const symbol = pendingDeleteSymbol;
        closeDeleteModal();
        if (symbol) removeSymbol(symbol);
    }

    function clearAllSaved() {
        if (savedSymbols.length === 0) return;
        if (confirm('همه نمادهای ذخیره‌شده پاک شوند؟')) {
            savedSymbols = [];
            saveSavedSymbols();
            renderSavedSymbols();
            showToast('همه نمادها پاک شدند', '🗑️', true);
        }
    }

    function saveLastSymbol(symbol) {
        try { localStorage.setItem(LAST_KEY, symbol); } catch (e) {}
        try { localStorage.setItem(LEGACY_LAST_KEY, symbol); } catch (e) {}
    }

    function getLastSymbol() {
        try {
            let v = localStorage.getItem(LAST_KEY);
            if (v === null) v = localStorage.getItem(LEGACY_LAST_KEY);
            return v;
        } catch (e) { return null; }
    }

    function renderSavedSymbols() {
        const count = savedSymbols.length;
        if (savedCount) {
            savedCount.textContent = count.toLocaleString('fa-IR');
            savedCount.hidden = count === 0;
        }
        if (savedHint) savedHint.style.display = count === 0 ? 'block' : 'none';
        if (count === 0) {
            savedList.innerHTML = '';
            return;
        }
        savedList.innerHTML = savedSymbols.map(sym => {
            const info = allSymbolsList.find(x => x.symbol === sym);
            const active = sym === currentSymbol ? 'active' : '';
            return `
                <div class="saved-row ${active}" data-symbol="${sym}" role="button" tabindex="0">
                    <span class="saved-main">
                        <span class="saved-symbol">${sym}</span>
                        <span class="saved-name">${info ? info.name.substring(0, 40) : ''}</span>
                    </span>
                    <button class="remove" data-remove="${sym}" title="حذف از علاقه‌مندی‌ها">✕</button>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // 1) دریافت لیست همه نمادها
    // ============================================================
    async function fetchSymbolsList() {
        try {
            showStatus('loading', '⏳ در حال دریافت لیست نمادها...');

            const data = await fetchWithFallback((key) =>
                `${API_BASE}?key=${key}&type=1`
            );

            if (!Array.isArray(data)) throw new Error('پاسخ آرایه نیست');

            allSymbolsList = data
                .filter(x => x.l18 && x.tvol > 0)
                .map(x => ({
                    symbol: x.l18,
                    name: x.l30 || '',
                    cs: x.cs || ''
                }))
                .sort((a, b) => a.symbol.localeCompare(b.symbol, 'fa'));

            showStatus('success', `✅ ${allSymbolsList.length} نماد آماده`);

            const last = getLastSymbol();
            if (last && allSymbolsList.find(x => x.symbol === last)) {
                selectSymbol(last);
            } else if (savedSymbols.length > 0) {
                selectSymbol(savedSymbols[0]);
            } else {
                searchInput.focus();
            }

        } catch (err) {
            console.error(err);
            showStatus('error', '❌ خطا در دریافت لیست: ' + err.message);
        }
    }

    // ============================================================
    // 2) جستجو
    // ============================================================
    function performSearch(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
            closeResults();
            return;
        }

        filteredResults = allSymbolsList.filter(item => {
            return item.symbol.toLowerCase().includes(q) ||
                   item.name.toLowerCase().includes(q);
        }).slice(0, 50);

        const exactMatch = filteredResults.findIndex(
            item => item.symbol.toLowerCase() === q
        );
        if (exactMatch > 0) {
            const [match] = filteredResults.splice(exactMatch, 1);
            filteredResults.unshift(match);
        }

        renderResults();
    }

    function renderResults() {
        if (filteredResults.length === 0) {
            searchResults.innerHTML = `<div class="no-results">😕 نمادی با این نام پیدا نشد</div>`;
            searchResults.classList.add('show');
            return;
        }

        let html = `<div class="search-hint">${filteredResults.length} نتیجه — ↑↓ حرکت، Enter انتخاب</div>`;

        html += filteredResults.map((item, i) => {
            const type = getSymbolType(item.cs);
            const isSaved = isSymbolSaved(item.symbol);
            return `
                <div class="result-item ${i === selectedIndex ? 'active' : ''}" data-index="${i}" data-symbol="${item.symbol}">
                    <div class="result-info">
                        <div class="result-symbol">${item.symbol}</div>
                        <div class="result-name">${item.name.substring(0, 50)}</div>
                    </div>
                    <div class="result-actions">
                        <span class="result-type ${type.cls}">${type.label}</span>
                        <button class="star-toggle ${isSaved ? 'on' : ''}" data-star="${item.symbol}" title="${isSaved ? 'حذف از علاقه‌مندی‌ها' : 'افزودن به علاقه‌مندی‌ها'}">${isSaved ? '★' : '☆'}</button>
                    </div>
                </div>
            `;
        }).join('');

        searchResults.innerHTML = html;
        searchResults.classList.add('show');
    }

    function closeResults() {
        searchResults.classList.remove('show');
        selectedIndex = -1;
    }

    // ============================================================
    // 3) انتخاب نماد
    // ============================================================
    function selectSymbol(symbol) {
        const item = allSymbolsList.find(x => x.symbol === symbol);
        if (!item) return;

        currentSymbol = symbol;
        saveLastSymbol(symbol);

        searchInput.value = '';
        clearBtn.classList.remove('show');
        closeResults();

        const saved = isSymbolSaved(symbol);
        selectedArea.innerHTML = `
            <div class="selected-symbol">
                <div class="info">
                    <div class="sym">${item.symbol}</div>
                    <div class="name">${item.name}</div>
                </div>
                <div class="selected-actions">
                    <button class="icon-btn ${saved ? 'saved' : ''}" id="favBtn" title="${saved ? 'حذف از ذخیره‌ها' : 'ذخیره این نماد'}">
                        ${saved ? '★' : '☆'}
                    </button>
                </div>
            </div>
        `;

        document.getElementById('favBtn').addEventListener('click', function() {
            if (isSymbolSaved(currentSymbol)) {
                removeSymbol(currentSymbol);
            } else {
                addSymbol(currentSymbol);
            }
            const isSavedNow = isSymbolSaved(currentSymbol);
            this.textContent = isSavedNow ? '★' : '☆';
            this.className = 'icon-btn ' + (isSavedNow ? 'saved' : '');
            this.title = isSavedNow ? 'حذف از ذخیره‌ها' : 'ذخیره این نماد';
        });

        renderSavedSymbols();

        // ⭐ چک کن اگه توی کش هست، از کش بخون
        const cached = getFromCache(symbol);
        if (cached) {
            console.log(`📦 از کش خوند: ${symbol}`);
            renderResult(cached.data, cached.lastUpdateText, true);
            showToast(`${symbol} از کش لود شد`, '📦');
        } else {
            fetchHistory(symbol, false);
        }
    }

    // ============================================================
    // 4) محاسبه میانگین رشد
    // ============================================================
    const calcAvgGrowth = window.GrowthStats.calcAvgGrowth;

    // ============================================================
    // ⭐ 5) رندر نتیجه (جدا شده برای استفاده از کش هم)
    // ============================================================
    function renderResult(data, lastUpdateText = null, fromCache = false) {
        const allTime = calcAvgGrowth(data);
        if (!allTime) throw new Error('محاسبه ممکن نشد');

        const avgVal = allTime.avgSimple;
        const sign = avgVal >= 0 ? '+' : '';
        const cls = avgVal >= 0 ? '' : ' negative';

        const symbolInfo = allSymbolsList.find(x => x.symbol === currentSymbol);

        resultArea.innerHTML = `
            <div class="symbol-card">
                <div class="sym">${currentSymbol}</div>
                <div class="name">${symbolInfo ? symbolInfo.name : ''}</div>
                <div class="type">${symbolInfo ? symbolInfo.cs : ''}</div>
            </div>

            <div class="main-stat${cls}">
                <div class="lbl">📊 میانگین درصد رشد روزانه</div>
                <div class="val">${sign}${avgVal.toFixed(3)}<span class="unit">%</span></div>
                <div class="desc">میانگین ساده از ${allTime.totalDays.toLocaleString('en-US')} روز${fromCache ? ' (کش)' : ''}</div>
            </div>

            <div class="info-grid">
                <div class="info-box">
                    <div class="lbl">📅 تعداد روزها</div>
                    <div class="val blue">${allTime.totalDays.toLocaleString('en-US')}</div>
                </div>
                <div class="info-box">
                    <div class="lbl">🎯 رشد کل</div>
                    <div class="val ${allTime.totalGrowth >= 0 ? 'green' : 'red'}">${allTime.totalGrowth >= 0 ? '+' : ''}${allTime.totalGrowth.toFixed(1)}%</div>
                </div>
                <div class="info-box">
                    <div class="lbl">🟢 روزهای مثبت</div>
                    <div class="val green">${allTime.positiveCount.toLocaleString('en-US')}</div>
                </div>
                <div class="info-box">
                    <div class="lbl">🔴 روزهای منفی</div>
                    <div class="val red">${allTime.negativeCount.toLocaleString('en-US')}</div>
                </div>
            </div>

            <!-- دکمه‌های عملیات -->
            <div class="action-buttons">
                <button class="action-btn trend" id="trendBtn">
                    📈 روند میانگین روزانه
                </button>
                <button class="action-btn download" id="downloadBtn">
                    📸 دانلود تصویر
                </button>
                <button class="action-btn refresh" id="refreshSymbolBtn">
                    🔄 بروزرسانی
                </button>
            </div>
        `;

        // اطلاعات آخر
        if (lastUpdateText) {
            lastUpdate.textContent = lastUpdateText;
        } else {
            lastUpdate.textContent = `از ${allTime.firstPrice.toLocaleString('en-US')} ریال تا ${allTime.lastPrice.toLocaleString('en-US')} ریال | توکن: ${TOKENS[currentTokenIndex].name} | ${new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })}`;
        }

        // Event برای دانلود تصویر
        document.getElementById('downloadBtn').addEventListener('click', downloadAsImage);

        // Event برای رفرش نماد
        document.getElementById('refreshSymbolBtn').addEventListener('click', function() {
            clearCache(currentSymbol);
            fetchHistory(currentSymbol, true);
        });

        // Event برای صفحهٔ روند میانگین روزانه
        document.getElementById('trendBtn').addEventListener('click', function() {
            try {
                localStorage.setItem('liquidity_growth_trend_symbol_v1', currentSymbol);
                const info = allSymbolsList.find(x => x.symbol === currentSymbol);
                localStorage.setItem('liquidity_growth_trend_meta_v1', JSON.stringify({
                    symbol: currentSymbol,
                    name: info ? info.name : '',
                    cs: info ? info.cs : '',
                    lastUpdate: lastUpdate.textContent
                }));
            } catch (e) {}
            window.location.href = 'growth-trend.html?symbol=' + encodeURIComponent(currentSymbol);
        });
    }

    // ============================================================
    // 6) دریافت دیتای تاریخی
    // ============================================================
    async function fetchHistory(symbol, forceRefresh = false) {
        try {
            refreshBtn.classList.add('spinning');
            showStatus('loading', `⏳ در حال دریافت دیتای ${symbol}...`);

            resultArea.innerHTML = `
                <div class="empty-state">
                    <span class="empty-icon">⏳</span>
                    در حال دریافت دیتای ${symbol}...
                </div>
            `;

            const data = await fetchWithFallback((key) =>
                `${HISTORY_BASE}?key=${key}&type=0&l18=${encodeURIComponent(symbol)}`
            );

            if (!Array.isArray(data) || data.length === 0) {
                throw new Error(`دیتای تاریخی «${symbol}» یافت نشد`);
            }

            // ⭐ ذخیره در کش
            const lastUpdateText = `از ${(Number(data[0].pc) || 0).toLocaleString('en-US')} ریال | توکن: ${TOKENS[currentTokenIndex].name} | ${new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })}`;
            setToCache(symbol, data);

            renderResult(data, lastUpdateText, false);

            showStatus('success', `✅ محاسبه ${symbol} انجام شد`);

        } catch (err) {
            console.error(err);
            showStatus('error', '❌ خطا: ' + err.message);
            resultArea.innerHTML = `
                <div class="empty-state">
                    <span class="empty-icon">❌</span>
                    ${err.message}
                </div>
            `;
            lastUpdate.textContent = '--';
        } finally {
            setTimeout(() => refreshBtn.classList.remove('spinning'), 500);
        }
    }

    // ============================================================
    // ⭐ 7) دانلود تصویر
    // ============================================================
    async function downloadAsImage() {
        const btn = document.getElementById('downloadBtn');
        if (!btn) return;

        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ در حال ساخت...';

        try {
            // پیدا کردن کارت اصلی
            const card = document.getElementById('mainCard');

            // ساخت کانواس
            const canvas = await html2canvas(card, {
                backgroundColor: currentTheme === 'dark' ? '#1e293b' : '#ffffff',
                scale: 2,
                useCORS: true,
                allowTaint: true,
                logging: false
            });

            // تبدیل به تصویر
            const image = canvas.toDataURL('image/png');

            // دانلود
            const link = document.createElement('a');
            const date = new Date().toLocaleDateString('fa-IR').replace(/\//g, '-');
            link.download = `${currentSymbol}_${date}.png`;
            link.href = image;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('تصویر دانلود شد', '📸');

        } catch (err) {
            console.error('خطا در دانلود:', err);
            showToast('خطا در ساخت تصویر', '❌', true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    // ============================================================
    // 8) Event Listeners
    // ============================================================
    searchInput.addEventListener('input', function() {
        const val = this.value;
        if (val.trim()) clearBtn.classList.add('show');
        else clearBtn.classList.remove('show');
        selectedIndex = -1;
        performSearch(val);
    });

    searchInput.addEventListener('focus', function() {
        if (this.value.trim()) performSearch(this.value);
    });

    searchInput.addEventListener('keydown', function(e) {
        if (!searchResults.classList.contains('show')) {
            if (e.key === 'ArrowDown' && filteredResults.length > 0) {
                selectedIndex = 0;
                renderResults();
            }
            return;
        }

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIndex = Math.min(selectedIndex + 1, filteredResults.length - 1);
            renderResults();
            scrollToActive();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIndex = Math.max(selectedIndex - 1, 0);
            renderResults();
            scrollToActive();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (selectedIndex >= 0 && filteredResults[selectedIndex]) {
                selectSymbol(filteredResults[selectedIndex].symbol);
            } else if (filteredResults.length > 0) {
                selectSymbol(filteredResults[0].symbol);
            }
        } else if (e.key === 'Escape') {
            closeResults();
            searchInput.blur();
        }
    });

    function scrollToActive() {
        const active = searchResults.querySelector('.result-item.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
    }

    searchResults.addEventListener('click', function(e) {
        const star = e.target.closest('.star-toggle');
        if (star) {
            e.stopPropagation();
            const sym = star.dataset.star;
            if (isSymbolSaved(sym)) removeSymbol(sym); else addSymbol(sym);
            renderResults();
            return;
        }
        const item = e.target.closest('.result-item');
        if (!item) return;
        selectSymbol(item.dataset.symbol);
    });

    clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        clearBtn.classList.remove('show');
        closeResults();
        searchInput.focus();
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-section')) {
            closeResults();
        }
    });

    savedList.addEventListener('click', function(e) {
        const removeBtn = e.target.closest('.remove');
        if (removeBtn) {
            e.stopPropagation();
            openDeleteModal(removeBtn.dataset.remove);
            return;
        }
        const row = e.target.closest('.saved-row');
        if (row) {
            selectSymbol(row.dataset.symbol);
        }
    });

    savedClear.addEventListener('click', clearAllSaved);

    // ⭐ دکمه رفرش کلی — کش رو پاک می‌کنه
    refreshBtn.addEventListener('click', function() {
        if (currentSymbol) {
            clearCache(currentSymbol);
            fetchHistory(currentSymbol, true);
        } else {
            clearCache();
            fetchSymbolsList();
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    try {
        let savedIdx = localStorage.getItem(TOKEN_KEY);
        if (savedIdx === null) savedIdx = localStorage.getItem(LEGACY_TOKEN_KEY);
        if (savedIdx !== null) {
            const idx = parseInt(savedIdx);
            if (idx >= 0 && idx < TOKENS.length) {
                currentTokenIndex = idx;
            }
        }
    } catch (e) {}

    // ============================================================
    // ⭐ Drawer + theme sync
    // ============================================================
    function isMobileView() {
        return window.matchMedia('(max-width: 820px)').matches;
    }
    function setDrawer(open) {
        document.body.classList.toggle('drawer-open', open);
        document.body.classList.toggle('drawer-closed', !open);
        if (drawerToggle) {
            drawerToggle.textContent = open ? '✕ بستن' : '☰ لیست';
            drawerToggle.setAttribute('aria-expanded', String(open));
        }
    }
    function syncThemeFromParent() {
        try {
            const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
            if (parentTheme) applyTheme(parentTheme === 'dark' ? 'dark' : 'light');
        } catch (e) {}
    }
    drawerToggle.addEventListener('click', function() {
        setDrawer(!document.body.classList.contains('drawer-open'));
    });
    if (drawerClose) drawerClose.addEventListener('click', function() { setDrawer(false); });
    drawerOverlay.addEventListener('click', function() { setDrawer(false); });
    if (deleteCancelBtn) deleteCancelBtn.addEventListener('click', closeDeleteModal);
    if (deleteConfirmBtn) deleteConfirmBtn.addEventListener('click', confirmDeleteSymbol);
    if (deleteOverlay) deleteOverlay.addEventListener('click', function(e) {
        if (e.target === deleteOverlay) closeDeleteModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        if (deleteOverlay && !deleteOverlay.hidden) { closeDeleteModal(); return; }
        if (isMobileView()) setDrawer(false);
    });
    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'emarat-theme') {
            applyTheme(e.data.theme === 'dark' ? 'dark' : 'light');
        }
    });
    if (window.self !== window.top) {
        if (themeBtn) themeBtn.style.display = 'none';
        syncThemeFromParent();
    }
    setDrawer(!isMobileView());

    loadCache();          // ⭐ کش رو لود کن
    loadSavedSymbols();
    seedDefaultSymbols();
    renderSavedSymbols();
    fetchSymbolsList();
</script>

<script src="../refresh-button.js"></script>
<script src="../usage-tracker.js" data-app="liquidity-growth"></script>
</body>
</html>
