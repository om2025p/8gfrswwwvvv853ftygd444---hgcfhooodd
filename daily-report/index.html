        // IndexedDB Configuration
        let db;
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('EmaratDailyReportDB', 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('app_updates')) {
                        const store = db.createObjectStore('app_updates', { keyPath: 'id', autoIncrement: true });
                        store.createIndex('appId', 'appId', { unique: false });
                        store.createIndex('commitSha', 'commitSha', { unique: false });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e);
            });
        }

        function getAllStoredUpdates() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction('app_updates', 'readonly');
                const store = tx.objectStore('app_updates');
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        function saveUpdateRecord(record) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction('app_updates', 'readwrite');
                const store = tx.objectStore('app_updates');
                const req = store.add(record);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // Jalali Date Converter
        function toJalaliDate(isoString) {
            const date = new Date(isoString);
            const g_y = date.getFullYear();
            const g_m = date.getMonth() + 1;
            const g_d = date.getDate();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');

            const g_days_in_month = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            const j_days_in_month = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];

            let gy = g_y - 1600;
            let gm = g_m - 1;
            let gd = g_d - 1;

            let g_day_no = 365 * gy + Math.floor((gy + 3) / 4) - Math.floor((gy + 99) / 100) + Math.floor((gy + 399) / 400);
            for (let i = 0; i < gm; ++i) g_day_no += g_days_in_month[i];
            if (gm > 1 && ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0))) ++g_day_no;
            g_day_no += gd;

            let j_day_no = g_day_no - 79;
            let jnp = Math.floor(j_day_no / 12053);
            j_day_no %= 12053;

            let jy = 979 + 33 * jnp + 4 * Math.floor(j_day_no / 1461);
            j_day_no %= 1461;

            if (j_day_no >= 366) {
                jy += Math.floor((j_day_no - 1) / 365);
                j_day_no = (j_day_no - 1) % 365;
            }

            let jm, jd_res;
            for (let i = 0; i < 11 && j_day_no >= j_days_in_month[i]; ++i) {
                j_day_no -= j_days_in_month[i];
                jm = i + 1;
            }
            jm = (jm || 0) + 1;
            jd_res = j_day_no + 1;

            const pad = (num) => String(num).padStart(2, '0');
            return `${jy}/${pad(jm)}/${pad(jd_res)} - ${hours}:${minutes}`;
        }

                header.innerHTML = `
                    <div class="app-info">
                        <img src="${app.icon}" class="app-icon-img" alt="${app.title}" onerror="this.src='icon-192.png'">
                        <span class="app-name">${app.title}</span>
                        <span class="app-badge">${appUpdates.length} بروزرسانی</span>
                    </div>
                    <span class="chevron">▼</span>
                `;

                const content = document.createElement('div');
                content.className = 'app-content';

                if (appUpdates.length === 0) {
                    content.innerHTML = `<div class="empty-updates">هنوز هیچ بروزرسانی ثبت شده‌ای برای این برنامه دریافت نشده است.</div>`;
                } else {
                    appUpdates.forEach(up => {
                        const card = document.createElement('div');
                        card.className = 'update-card';

                        card.innerHTML = `
                            <div class="update-card-header">
                                <span class="update-date">📅 ${toJalaliDate(up.date)}</span>
                                <span class="update-commit">sha: ${up.commitSha.substring(0, 7)}</span>
                            </div>
                            <div class="update-body">${up.aiSummary}</div>
                        `;
                        content.appendChild(card);
                    });
                }

                accordion.appendChild(header);
                accordion.appendChild(content);
                listContainer.appendChild(accordion);
            });
        }

        function toggleAccordion(appId) {
            const targetAcc = document.getElementById(`accordion-${appId}`);
            if (targetAcc) {
                targetAcc.classList.toggle('active');
            }
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            APPS_LIST.forEach(app => {
                const acc = document.getElementById(`accordion-${app.id}`);
                const appUpdates = cachedUpdates.filter(u => u.appId === app.id);
                const hasMatch = app.title.toLowerCase().includes(query) ||
                                 appUpdates.some(u => u.aiSummary.toLowerCase().includes(query));

                if (acc) {
                    acc.style.display = hasMatch ? 'block' : 'none';
                }
            });
        }

        // Fetch & Generate AI Summaries from GitHub Commits
        async function fetchAndAnalyzeGithubUpdates() {
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('btnSyncGithub');

            badge.innerText = 'در حال ارتباط با گیت‌هاب...';
            badge.className = 'status-badge loading';
            btn.disabled = true;

            const repo = localStorage.getItem('emarat_github_repo') || 'om2025p/8gfrswwwvvv853ftygd444---hgcfhooodd';
            const pat = localStorage.getItem('emarat_github_pat') || '';
            const geminiKey = localStorage.getItem('emarat_gemini_key') || getObfuscatedGeminiKey();

            try {
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (pat) headers['Authorization'] = `token ${pat}`;

                const response = await fetch(`https://api.github.com/repos/${repo}/commits?per_page=30`, { headers });
                if (!response.ok) throw new Error(`خطای گیت‌هاب: ${response.status}`);
                const commits = await response.json();

                let newCount = 0;
                for (const commit of commits) {
                    const commitSha = commit.sha;
                    const commitMessage = commit.commit.message;
                    const commitDate = commit.commit.committer.date;

                    // Fetch detailed commit to see changed files
                    const detailRes = await fetch(`https://api.github.com/repos/${repo}/commits/${commitSha}`, { headers });
                    if (!detailRes.ok) continue;
                    const commitDetail = await detailRes.json();
                    const files = commitDetail.files || [];

                    // Identify matching apps
                    for (const app of APPS_LIST) {
                        const isAppChanged = files.some(f => f.filename.startsWith(app.folder + '/'));
                        if (isAppChanged) {
                            // Check if already stored in IndexedDB
                            const existing = cachedUpdates.find(u => u.appId === app.id && u.commitSha === commitSha);
                            if (!existing) {
                                badge.innerText = `تحلیل هوشمند برای ${app.title}...`;
                                const changedFileNames = files.filter(f => f.filename.startsWith(app.folder + '/')).map(f => f.filename).join(', ');

                                // Call Gemini AI
                                const aiSummary = await callGeminiAI(geminiKey, app.title, commitMessage, changedFileNames);

                                await saveUpdateRecord({
                                    appId: app.id,
                                    commitSha: commitSha,
                                    date: commitDate,
                                    aiSummary: aiSummary
                                });
                                newCount++;
                                await renderUI();
                            }
                        }
                    }
                }

                badge.innerText = 'بروز و آماده';
                badge.className = 'status-badge';
                showToast(newCount > 0 ? `${newCount} گزارش تغییرات جدید دریافت شد 🎉` : 'هیچ بروزرسانی جدیدی یافت نشد ✅');
            } catch (err) {
                console.error(err);
                badge.innerText = 'خطا در ارتباط';
                badge.className = 'status-badge loading';
                showToast(`خطا: ${err.message}`);
            } finally {
                btn.disabled = false;
            }
        }

        // Clean technical raw English terms from commit messages
        function cleanCommitMessage(msg) {
            if (!msg) return "به‌روزرسانی و بهبود عملکرد برنامه";
            return msg
                .replace(/Co-authored-by:.*$/gmi, '')
                .replace(/feat\([^)]*\):/gi, 'افزودن قابلیت:')
                .replace(/fix\([^)]*\):/gi, 'رفع مشکل:')
                .replace(/docs\([^)]*\):/gi, 'مستندات:')
                .replace(/style\([^)]*\):/gi, 'استایل و ظاهر:')
                .replace(/refactor\([^)]*\):/gi, 'بازنویسی کد:')
                .trim();
        }

        // Call Gemini AI Model
        async function callGeminiAI(apiKey, appName, commitMsg, filesStr) {
            const cleanedMsg = cleanCommitMessage(commitMsg);
            const prompt = `شما هوش مصنوعی تحلیلی و گزارش‌نویس اختصاصی عمارت دیجیتال هستید.
برنامه "${appName}" به نسخه جدیدی به‌روزرسانی شده است.

اطلاعات فنی بروزرسانی:
پیام کامیت: "${cleanedMsg}"
فایل‌های تغییر یافته: "${filesStr}"

دستورالعمل مهم:
۱. پاسخ شما باید ۱۰۰٪ به زبان فارسی، بسیار روان، خوانا، جذاب و هموار باشد.
۲. از آوردن متون انگلیسی، ایمیل‌ها، نام‌های ربات، و پیام‌های خام انگلیسی اکیداً خودداری کنید. تمام مفاهیم و تغییرات فنی را به فارسی روان و ساده ترجمه کنید.
۳. در یک یا دو پاراگراف خوانا توضیح دهید که چه قابلیت‌ها یا اصلاحاتی در برنامه "${appName}" انجام شده و کاربر چه انتظاری باید داشته باشد.`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) throw new Error(`Gemini error: ${response.status}`);
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text && text.trim()) {
                    return text.trim();
                }
                return `در این به‌روزرسانی، تغییراتی در بخش کدهای برنامه ${appName} ایجاد شده و عملکرد آن بهبود یافته است.`;
            } catch (e) {
                console.error("Gemini AI failed:", e);
                return `در این نسخه، قابلیت‌ها و اصلاحات جدیدی در برنامه ${appName} اعمال شده است (${cleanedMsg}).`;
            }
        }

        // Initialization
        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            await renderUI();
        });
    </script>
</body>
</html>
