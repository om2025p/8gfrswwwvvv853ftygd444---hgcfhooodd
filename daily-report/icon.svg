<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>

    <!-- Vibrant Purple & Amber Gradients -->
    <linearGradient id="purple3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>

    <linearGradient id="gold3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Metallic Clip Gradient -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
  </defs>

  <!-- Solid White Container Box with Rounded Corners and Bold Purple Double Border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#7c3aed" stroke-width="12" />
  <rect width="476" height="476" x="18" y="18" rx="92" fill="none" stroke="#a855f7" stroke-width="6" opacity="0.9" />

  <!-- Main Large 3D Report Board Element in Center -->
  <g filter="url(#cardShadow)">
    <!-- Main Report Board Backing -->
    <rect x="116" y="80" width="280" height="370" rx="32" fill="url(#purple3d)" />

    <!-- Document Sheet -->
    <rect x="136" y="125" width="240" height="305" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />

    <!-- AI Sparkle Icon / Badge Top Right of Sheet -->
    <path d="M 320 160 Q 335 160 335 145 Q 335 160 350 160 Q 335 160 335 175 Q 335 160 320 160 Z" fill="url(#gold3d)" />
    <path d="M 300 185 Q 310 185 310 175 Q 310 185 320 185 Q 310 185 310 195 Q 310 185 300 185 Z" fill="url(#gold3d)" />

    <!-- Document Header Accent Bar -->
    <rect x="166" y="160" width="130" height="20" rx="10" fill="url(#purple3d)" />

    <!-- Lines of Text / Daily Report Content -->
    <rect x="166" y="198" width="180" height="14" rx="7" fill="#94a3b8" />
    <rect x="166" y="222" width="160" height="14" rx="7" fill="#cbd5e1" />
    <rect x="166" y="246" width="175" height="14" rx="7" fill="#94a3b8" />

    <!-- Highlighted AI Summary Box inside Document -->
    <rect x="160" y="275" width="192" height="125" rx="16" fill="#f5f3ff" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,4" />
    <rect x="176" y="293" width="160" height="14" rx="7" fill="url(#purple3d)" />
    <rect x="176" y="318" width="140" height="11" rx="5.5" fill="#7c3aed" />
    <rect x="176" y="338" width="150" height="11" rx="5.5" fill="#a855f7" />
    <rect x="176" y="358" width="100" height="11" rx="5.5" fill="#c084fc" />

    <!-- 3D Metallic Clip Top Binder -->
    <rect x="196" y="55" width="120" height="50" rx="14" fill="url(#clipGrad)" stroke="#7c3aed" stroke-width="3" />
    <circle cx="256" cy="80" r="14" fill="#3b0764" />
    <circle cx="256" cy="80" r="7" fill="url(#gold3d)" />
  </g>
</svg>