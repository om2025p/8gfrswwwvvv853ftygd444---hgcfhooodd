<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدل ۳ · شجره‌نامهٔ کلاسیک</title>
<link rel="stylesheet" href="/vendor/vazirmatn/fonts.css">
<style>
:root{--bg:#0E1116;--sf:#181D24;--ln:#2A323C;--tx:#EAF0F5;--tx2:#9AA9B8;--tx3:#6C7C8C;
--ac:#5EC8F5;--g:#E0B341;--p:#7DD8A8;--m:#F0A6C8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,system-ui,sans-serif;
background-image:radial-gradient(1000px 500px at 50% -10%,#16304499,transparent)}
.hd{padding:16px;text-align:center}
.t{font-size:19px;font-weight:800}
.s{font-size:11.5px;color:var(--tx3);margin-top:3px}
.wrap{overflow-x:auto;padding:8px 0 18px}
.wrap::-webkit-scrollbar{display:none}
.cv{position:relative}
svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.nd{position:absolute;transform:translateX(-50%);cursor:pointer}
.box{background:var(--sf);border:1.5px solid var(--ln);border-radius:9px;padding:6px 9px;
display:flex;align-items:center;gap:7px;box-shadow:0 3px 10px #0007;min-width:118px}
.nd.p .box{border-right:3px solid var(--p)}
.nd.m .box{border-right:3px solid var(--m)}
.nd.root .box{border:2px solid var(--ac);background:linear-gradient(135deg,#152B38,#101A22);
box-shadow:0 0 0 4px #5EC8F522,0 6px 18px #0009}
.av{width:29px;height:29px;border-radius:8px;flex:none;display:grid;place-items:center;
font-weight:800;font-size:12px;background:#22303A;color:#9FE0C0;border:1px solid #33454F}
.av.f{background:#302430;color:#F0A6C8;border-color:#4A3450}
.av.d{opacity:.5;filter:grayscale(.7)}
.tx{min-width:0;text-align:right}
.nm{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px}
.kin{font-size:8px;color:var(--ac);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px}
.gb{position:absolute;font-size:8.5px;color:var(--tx3);font-weight:700;white-space:nowrap;
border-right:1px solid #2A323C;padding-right:6px}
.lg{display:flex;gap:12px;justify-content:center;padding:10px;font-size:9.5px;color:var(--tx3);flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:4px}
</style></head><body>
<div class="hd"><div class="t">مدل ۳ · شجره‌نامهٔ کلاسیک</div>
<div class="s">جعبه‌های افقی باریک · خطوط پررنگ عمودی · مثل نرم‌افزارهای نسب‌شناسی</div></div>
<div class="wrap"><div class="cv" id="cv"></div></div>
<div class="lg"><span><i style="background:#7DD8A8"></i>پدری</span>
<span><i style="background:#F0A6C8"></i>مادری</span>
<span><i style="background:#E0B341"></i>ازدواج بین دو سمت</span></div>
<script src="shared.js"></script>
<script>
const ROOT='m1', cv=document.getElementById('cv');
const BW=132, RH=62, PADX=64;
// build rows per generation, side-grouped
const rows={};
ids.forEach(id=>{ const g=depth[id]; (rows[g]=rows[g]||[]).push(id); });
const gs=Object.keys(rows).map(Number).sort((a,b)=>a-b);
// sort each row: paternal block then maternal block, root last
gs.forEach(g=>{
  rows[g].sort((a,b)=>{
    if(a===ROOT) return 1; if(b===ROOT) return -1;
    const sa=sideOf(a,ROOT), sb=sideOf(b,ROOT);
    if(sa!==sb) return sa==='p'?-1:1;
    return yearOf(M[a].birthDate)-yearOf(M[b].birthDate);
  });
});
let maxRow=1; gs.forEach(g=>maxRow=Math.max(maxRow,rows[g].length));
const W=Math.max(maxRow*BW+PADX*2+70,360);
const H=gs.length*RH+110;
cv.style.width=W+'px'; cv.style.height=H+'px';

const pos={};
gs.forEach((g,gi)=>{
  const arr=rows[g], y=58+gi*RH;
  const rowW=arr.length*BW, x0=W/2-rowW/2+BW/2;
  arr.forEach((id,i)=>{ pos[id]={x:x0+i*BW,y}; });
  const lab=document.createElement('div');
  lab.className='gb'; lab.textContent='نسل '+(g+1);
  lab.style.right='6px'; lab.style.top=(y-6)+'px';
  cv.appendChild(lab);
});

let svg='';
// parent → child: thick vertical trunk + horizontal bus
const byParent={};
Object.keys(pos).forEach(id=>{
  (M[id].parents||[]).forEach(pid=>{ if(pos[pid]) (byParent[pid]=byParent[pid]||[]).push(id); });
});
Object.keys(byParent).forEach(pid=>{
  const p=pos[pid], kids=byParent[pid].map(k=>pos[k]).filter(Boolean);
  if(!kids.length) return;
  const side=sideOf(pid,ROOT);
  const col=side==='m'?'#F0A6C8':'#7DD8A8';
  const y1=p.y+16, busY=p.y+34;
  svg+=`<line x1="${p.x}" y1="${y1}" x2="${p.x}" y2="${busY}" stroke="${col}" stroke-opacity=".55" stroke-width="2"/>`;
  if(kids.length>1){
    const xs=kids.map(k=>k.x);
    svg+=`<line x1="${Math.min(...xs)}" y1="${busY}" x2="${Math.max(...xs)}" y2="${busY}"
      stroke="${col}" stroke-opacity=".45" stroke-width="1.8"/>`;
  }
  kids.forEach(k=>{
    svg+=`<line x1="${k.x}" y1="${busY}" x2="${k.x}" y2="${k.y-14}" stroke="${col}"
      stroke-opacity=".45" stroke-width="1.8"/>`;
  });
});
// spouse: short double link
const dr=new Set();
Object.keys(pos).forEach(id=>{
  (M[id].spouses||[]).forEach(sid=>{
    const k=[id,sid].sort().join('|'); if(dr.has(k))return; dr.add(k);
    const a=pos[id],b=pos[sid]; if(!a||!b)return;
    const cross=sideOf(id,ROOT)!==sideOf(sid,ROOT);
    const col=cross?'#E0B341':'#3E4A56';
    svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}"
      stroke-opacity="${cross?'.95':'.5'}" stroke-width="${cross?2.4:1.6}"
      stroke-dasharray="${cross?'0':'3 3'}"/>`;
  });
});
cv.insertAdjacentHTML('afterbegin',`<svg width="${W}" height="${H}">${svg}</svg>`);

Object.keys(pos).forEach(id=>{
  const m=M[id],q=pos[id],isRoot=id===ROOT,side=isRoot?'root':sideOf(id,ROOT);
  const el=document.createElement('div');
  el.className='nd '+side;
  el.style.left=q.x+'px'; el.style.top=(q.y-15)+'px';
  el.innerHTML=`<div class="box"><div class="av ${m.gender==='female'?'f':''} ${isDead(m)?'d':''}">${esc(initial(m.name))}</div>
    <div class="tx"><div class="nm">${esc(m.name)}</div>
    <div class="kin">${isRoot?'خودِ شما':esc(kinshipOf(id,ROOT))}</div></div></div>`;
  cv.appendChild(el);
});
</script><script src="../refresh-button.js"></script>
<script src="../usage-tracker.js" data-app="m3"></script>
</body></html>
