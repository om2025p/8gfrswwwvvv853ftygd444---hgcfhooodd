<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدل ۲ · دو بال آینه‌ای</title>
<link rel="stylesheet" href="/vendor/vazirmatn/fonts.css">
<style>
:root{--bg:#0C1014;--sf:#151C22;--ln:#26323B;--tx:#EAF2ED;--tx2:#93A9B8;--tx3:#67808F;
--ac:#3DDC97;--g:#C9A227;--p:#6FD8F5;--m:#F2A8D0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,system-ui,sans-serif;
background-image:radial-gradient(800px 400px at 50% -5%,#12303a88,transparent)}
.hd{padding:16px 16px 8px;text-align:center}
.t{font-size:19px;font-weight:800}
.s{font-size:11.5px;color:var(--tx3);margin-top:3px}
.wrap{overflow-x:auto;padding:6px 0 16px}
.wrap::-webkit-scrollbar{display:none}
.cv{position:relative}
svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
/* central spine */
.spine{position:absolute;width:3px;border-radius:3px;
background:linear-gradient(180deg,transparent,#3DDC97 12%,#3DDC97 88%,transparent)}
.nd{position:absolute;transform:translateX(-50%);width:104px;cursor:pointer}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:7px 6px 6px;
box-shadow:0 4px 14px #0007;position:relative}
.card::before{content:'';position:absolute;top:0;height:3px;left:0;right:0;border-radius:13px 13px 0 0}
.nd.p .card::before{background:linear-gradient(90deg,#6FD8F5,#3DDC97)}
.nd.m .card::before{background:linear-gradient(90deg,#F2A8D0,#C9A227)}
.av{width:34px;height:34px;border-radius:11px;margin:0 auto 4px;display:grid;place-items:center;
font-weight:800;font-size:14px;background:#1B262D;color:#8FE8C0;border:1.5px solid #2E4B5D}
.av.f{background:#2A2026;color:#F2A8D0;border-color:#4A3450}
.av.d{opacity:.5;filter:grayscale(.7)}
.nm{font-size:10px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.kin{font-size:8px;color:var(--ac);font-weight:700;margin-top:2px;text-align:center}
.rootcard{background:linear-gradient(145deg,#16342A,#0F2A22);border:2px solid var(--ac);
box-shadow:0 0 0 4px #3DDC9722,0 8px 22px #0008}
.rootcard .av{width:44px;height:44px;font-size:18px}
.sidehd{position:absolute;font-size:10px;font-weight:800;padding:4px 14px;border-radius:999px}
.sidehd.p{background:#0E2A33;color:var(--p);border:1px solid #1E5566}
.sidehd.m{background:#2A1822;color:var(--m);border:1px solid #5A3350}
.lg{display:flex;gap:12px;justify-content:center;padding:10px;font-size:9.5px;color:var(--tx3);flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:4px}
</style></head><body>
<div class="hd"><div class="t">مدل ۲ · دو بال آینه‌ای</div>
<div class="s">خودِ شما روی ستون مرکزی · خانوادهٔ پدر و مادر دو طرف</div></div>
<div class="wrap"><div class="cv" id="cv"></div></div>
<div class="lg"><span><i style="background:#6FD8F5"></i>خانوادهٔ پدر</span>
<span><i style="background:#F2A8D0"></i>خانوادهٔ مادر</span>
<span><i style="background:#C9A227"></i>ازدواج بین دو سمت</span></div>
<script src="shared.js"></script>
<script>
const ROOT='m1', cv=document.getElementById('cv');
const RH=98, CW=112, SPINE_X_FRAC=0.5;
const rootGen=depth[ROOT];
// group by generation AND side
const grid={};
ids.forEach(id=>{
  if(id===ROOT) return;
  const g=depth[id], s=sideOf(id,ROOT);
  const k=g+'|'+s; (grid[k]=grid[k]||[]).push(id);
});
const allG=[...new Set(ids.map(i=>depth[i]))].sort((a,b)=>a-b);
// each generation row: maternal on right, paternal on left, root spine centre
let maxHalf=1;
Object.keys(grid).forEach(k=>{ maxHalf=Math.max(maxHalf,grid[k].length); });
const halfW=maxHalf*CW;
const W=halfW*2+CW+40;
const H=(allG.length+1)*RH+90;
cv.style.width=W+'px'; cv.style.height=H+'px';
const spineX=W/2;

const sp=document.createElement('div');
sp.className='spine'; sp.style.left=(spineX-1.5)+'px'; sp.style.top='30px'; sp.style.height=(H-80)+'px';
cv.appendChild(sp);

const pos={};
allG.forEach((g,gi)=>{
  const y=52+gi*RH;
  ['p','m'].forEach(side=>{
    const arr=grid[g+'|'+side]||[];
    arr.forEach((id,i)=>{
      const off=(i+1)*CW;
      const x = side==='p' ? spineX-off : spineX+off;
      pos[id]={x,y,side};
    });
  });
});
pos[ROOT]={x:spineX,y:52+allG.indexOf(rootGen)*RH,side:'root'};

// side headers
const hp=document.createElement('div'); hp.className='sidehd p'; hp.textContent='خانوادهٔ پدر';
hp.style.left=(spineX-halfW/2-30)+'px'; hp.style.top='14px'; cv.appendChild(hp);
const hm=document.createElement('div'); hm.className='sidehd m'; hm.textContent='خانوادهٔ مادر';
hm.style.left=(spineX+halfW/2-30)+'px'; hm.style.top='14px'; cv.appendChild(hm);

let svg='';
Object.keys(pos).forEach(id=>{
  (M[id].parents||[]).forEach(pid=>{
    const a=pos[id],b=pos[pid]; if(!a||!b) return;
    const col=a.side==='m'?'#F2A8D0':a.side==='p'?'#6FD8F5':'#3DDC97';
    const y1=b.y+32,y2=a.y-32,my=(y1+y2)/2;
    svg+=`<path d="M${b.x},${y1} L${b.x},${my} L${a.x},${my} L${a.x},${y2}" fill="none"
      stroke="${col}" stroke-opacity=".38" stroke-width="1.6"/>`;
  });
});
const drawn=new Set();
Object.keys(pos).forEach(id=>{
  (M[id].spouses||[]).forEach(sid=>{
    const k=[id,sid].sort().join('|'); if(drawn.has(k))return; drawn.add(k);
    const a=pos[id],b=pos[sid]; if(!a||!b)return;
    const cross=(a.side!==b.side)&&a.side!=='root'&&b.side!=='root';
    svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
      stroke="${cross?'#C9A227':'#33454F'}" stroke-opacity="${cross?'.95':'.3'}"
      stroke-width="${cross?2.4:1.2}" stroke-dasharray="5 4"/>`;
  });
});
cv.insertAdjacentHTML('afterbegin',`<svg width="${W}" height="${H}">${svg}</svg>`);

Object.keys(pos).forEach(id=>{
  const m=M[id],q=pos[id],isRoot=id===ROOT;
  const el=document.createElement('div');
  el.className='nd '+(isRoot?'':q.side);
  el.style.left=q.x+'px'; el.style.top=(q.y-36)+'px';
  el.innerHTML=`<div class="card ${isRoot?'rootcard':''}">
    <div class="av ${m.gender==='female'?'f':''} ${isDead(m)?'d':''}">${esc(initial(m.name))}</div>
    <div class="nm">${esc(m.name)}</div>
    <div class="kin">${isRoot?'خودِ شما':esc(kinshipOf(id,ROOT))}</div></div>`;
  cv.appendChild(el);
});
</script><script src="../refresh-button.js"></script>
<script src="../usage-tracker.js" data-app="m2"></script>
</body></html>
