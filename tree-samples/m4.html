<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدل ۴ · کارت‌های پشته‌ای</title>
<link rel="stylesheet" href="/vendor/vazirmatn/fonts.css">
<style>
:root{--bg:#0B0D10;--sf:#16191F;--ln:#272C35;--tx:#EFF3F7;--tx2:#98A2B3;--tx3:#68727F;
--ac:#FFB84D;--g:#FFB84D;--p:#63D9A0;--m:#EE9AC4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,system-ui,sans-serif;
background-image:radial-gradient(900px 460px at 20% -8%,#3a2a1055,transparent)}
.hd{padding:16px}
.t{font-size:19px;font-weight:800}
.s{font-size:11.5px;color:var(--tx3);margin-top:3px}
.wrap{overflow-x:auto;padding:6px 0 18px}
.wrap::-webkit-scrollbar{display:none}
.cv{position:relative}
svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
/* stacked slab look */
.slab{position:absolute;border-radius:16px;pointer-events:none}
.nd{position:absolute;transform:translateX(-50%);cursor:pointer;z-index:2}
.card{background:linear-gradient(180deg,#1B1F26,#14171C);border:1px solid var(--ln);
border-radius:16px;padding:10px 8px 9px;box-shadow:0 8px 20px #0008,inset 0 1px 0 #ffffff0d;
text-align:center;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;inset:0;border-radius:16px;
background:linear-gradient(160deg,transparent 60%,#ffffff08)}
.nd.p .card{border-color:#2A4A38}
.nd.m .card{border-color:#4A2C3C}
.av{width:40px;height:40px;border-radius:13px;margin:0 auto 6px;display:grid;place-items:center;
font-weight:800;font-size:16px;background:#232830;color:#8FE8C0;border:2px solid #33403A;
box-shadow:0 3px 8px #0006}
.av.f{background:#2C2229;color:#EE9AC4;border-color:#4A3450}
.av.d{opacity:.5;filter:grayscale(.75)}
.nm{font-size:10.5px;font-weight:800;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kin{font-size:8.5px;color:var(--ac);font-weight:700;margin-top:3px}
.yr{font-size:8px;color:var(--tx3);margin-top:2px;font-variant-numeric:tabular-nums}
.genhd{position:absolute;font-size:9px;font-weight:800;color:var(--tx3);letter-spacing:.6px;white-space:nowrap}
.lg{display:flex;gap:12px;justify-content:center;padding:10px;font-size:9.5px;color:var(--tx3);flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:4px}
</style></head><body>
<div class="hd"><div class="t">مدل ۴ · کارت‌های پشته‌ای</div>
<div class="s">هر نسل یک سکو با پس‌زمینهٔ جدا · کارت‌های برجسته با سایه</div></div>
<div class="wrap"><div class="cv" id="cv"></div></div>
<div class="lg"><span><i style="background:#63D9A0"></i>پدری</span>
<span><i style="background:#EE9AC4"></i>مادری</span>
<span><i style="background:#FFB84D"></i>ازدواج بین دو سمت</span></div>
<script src="shared.js"></script>
<script>
const ROOT='m1', cv=document.getElementById('cv');
const CW=108, RH=132, PAD=18;
const rows={};
ids.forEach(id=>{ const g=depth[id]; (rows[g]=rows[g]||[]).push(id); });
const gs=Object.keys(rows).map(Number).sort((a,b)=>a-b);
gs.forEach(g=>rows[g].sort((a,b)=>{
  if(a===ROOT) return 1; if(b===ROOT) return -1;
  const sa=sideOf(a,ROOT),sb=sideOf(b,ROOT);
  return sa===sb ? 0 : sa==='p'?-1:1;
}));
let maxRow=1; gs.forEach(g=>maxRow=Math.max(maxRow,rows[g].length));
const W=Math.max(maxRow*CW+PAD*2+40,360);
const H=gs.length*RH+100;
cv.style.width=W+'px'; cv.style.height=H+'px';

// slabs behind each generation
gs.forEach((g,gi)=>{
  const y=52+gi*RH;
  const s=document.createElement('div');
  s.className='slab';
  s.style.cssText=`left:10px;right:10px;top:${y-46}px;height:${RH-8}px;
    background:${gi%2?'#14171C':'#171A20'};border:1px solid #1F242B;`;
  cv.appendChild(s);
  const lab=document.createElement('div');
  lab.className='genhd'; lab.textContent='نسل '+(g+1)+'  ·  '+rows[g].length+' نفر';
  lab.style.right='20px'; lab.style.top=(y-40)+'px';
  cv.appendChild(lab);
});

const pos={};
gs.forEach((g,gi)=>{
  const arr=rows[g], y=52+gi*RH;
  const rowW=arr.length*CW, x0=W/2-rowW/2+CW/2;
  arr.forEach((id,i)=>{ pos[id]={x:x0+i*CW,y}; });
});

let svg='';
Object.keys(pos).forEach(id=>{
  (M[id].parents||[]).forEach(pid=>{
    const a=pos[id],b=pos[pid]; if(!a||!b)return;
    const col=sideOf(id,ROOT)==='m'?'#EE9AC4':'#63D9A0';
    const y1=b.y+46,y2=a.y-46,my=(y1+y2)/2;
    svg+=`<path d="M${b.x},${y1} C${b.x},${my} ${a.x},${my} ${a.x},${y2}" fill="none"
      stroke="${col}" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>`;
  });
});
const dr=new Set();
Object.keys(pos).forEach(id=>{
  (M[id].spouses||[]).forEach(sid=>{
    const k=[id,sid].sort().join('|'); if(dr.has(k))return; dr.add(k);
    const a=pos[id],b=pos[sid]; if(!a||!b)return;
    const cross=sideOf(id,ROOT)!==sideOf(sid,ROOT);
    svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${cross?'#FFB84D':'#3A4048'}"
      stroke-opacity="${cross?'.9':'.4'}" stroke-width="${cross?2.6:1.4}" stroke-dasharray="6 5"/>`;
  });
});
cv.insertAdjacentHTML('afterbegin',`<svg width="${W}" height="${H}">${svg}</svg>`);

Object.keys(pos).forEach(id=>{
  const m=M[id],q=pos[id],isRoot=id===ROOT,side=isRoot?'':sideOf(id,ROOT);
  const el=document.createElement('div');
  el.className='nd '+side;
  el.style.left=q.x+'px'; el.style.top=(q.y-42)+'px';
  el.innerHTML=`<div class="card">
    <div class="av ${m.gender==='female'?'f':''} ${isDead(m)?'d':''}">${esc(initial(m.name))}</div>
    <div class="nm">${esc(m.name)}</div>
    <div class="kin">${isRoot?'خودِ شما':esc(kinshipOf(id,ROOT))}</div>
    <div class="yr">${lifeSpan(m)}</div></div>`;
  cv.appendChild(el);
});
</script><script src="../refresh-button.js"></script>
<script src="../usage-tracker.js" data-app="m4"></script>
</body></html>
