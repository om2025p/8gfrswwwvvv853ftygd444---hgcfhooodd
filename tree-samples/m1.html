<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدل ۱ · ستون‌های نسل</title>
<link rel="stylesheet" href="/vendor/vazirmatn/fonts.css">
<style>
:root{--bg:#0A0F0D;--sf:#131B17;--sf2:#1A2420;--ln:#25332C;--tx:#EAF2ED;--tx2:#9DB3A8;--tx3:#6F8A7C;
--ac:#3DDC97;--g:#C9A227;--p:#7BE8B6;--m:#F2A8D0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,system-ui,sans-serif;
background-image:radial-gradient(900px 500px at 15% -10%,#12332255,transparent),radial-gradient(700px 400px at 90% 105%,#2a1f3a44,transparent)}
.hd{padding:16px 16px 10px}
.t{font-size:19px;font-weight:800;letter-spacing:-.2px}
.s{font-size:11.5px;color:var(--tx3);margin-top:3px}
.wrap{overflow-x:auto;padding:8px 0 20px}
.wrap::-webkit-scrollbar{display:none}
.cv{position:relative;min-height:100px}
svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.gen-lbl{position:absolute;right:8px;font-size:9px;color:var(--tx3);font-weight:700;
writing-mode:vertical-rl;letter-spacing:1.5px;transform:rotate(180deg)}
.nd{position:absolute;transform:translateX(-50%);width:96px;text-align:center;cursor:pointer}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px 6px 7px;
box-shadow:0 3px 12px #0006;transition:.2s}
.nd.p .card{border-color:#2A5C45}
.nd.m .card{border-color:#5A3350}
.av{width:38px;height:38px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;
font-weight:800;font-size:15px;background:#1E2E27;color:#8FE8C0;border:2px solid #2E4B3D}
.av.f{background:#2A1F2C;color:#F2A8D0;border-color:#4A3450}
.av.d{opacity:.55;filter:grayscale(.6)}
.nm{font-size:10.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kin{font-size:8.5px;color:var(--ac);font-weight:700;margin-top:2px}
.life{font-size:8px;color:var(--tx3);margin-top:1px}
.bdg{position:absolute;font-size:9px;font-weight:800;padding:3px 11px;border-radius:999px;white-space:nowrap}
.bdg.p{background:#12241C;color:var(--p);border:1px solid #2A5C45}
.bdg.m{background:#241A22;color:var(--m);border:1px solid #5A3350}
.lg{display:flex;gap:12px;justify-content:center;padding:8px;font-size:9.5px;color:var(--tx3);flex-wrap:wrap}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:4px}
</style></head><body>
<div class="hd"><div class="t">مدل ۱ · ستون‌های نسل</div>
<div class="s">هر نسل یک ردیف افقی · دو خانواده با رنگ قاب جدا</div></div>
<div class="wrap"><div class="cv" id="cv"></div></div>
<div class="lg"><span><i style="background:#7BE8B6"></i>پدری</span>
<span><i style="background:#F2A8D0"></i>مادری</span>
<span><i style="background:#C9A227"></i>ازدواج بین دو سمت</span></div>
<script src="shared.js"></script>
<script>
const ROOT='m1';
const cv=document.getElementById('cv');
const CW=100, RH=104, PAD=14;
const gens={};
ids.forEach(id=>{ if(id===ROOT) return; const g=depth[id]; (gens[g]=gens[g]||[]).push(id); });
const gKeys=Object.keys(gens).map(Number).sort((a,b)=>a-b);
const rootGen=depth[ROOT];
const maxCols=Math.max(...gKeys.map(g=>gens[g].length),1);
const W=Math.max(maxCols*CW+PAD*2,340), H=(gKeys.length+1)*RH+96;
cv.style.width=W+'px'; cv.style.height=H+'px';

const pos={};
gKeys.forEach((g,gi)=>{
  const arr=gens[g]; const y=46+gi*RH;
  const rowW=arr.length*CW; const x0=W/2-rowW/2+CW/2;
  arr.forEach((id,i)=>pos[id]={x:x0+i*CW,y});
});
/* root gets its own row at the very bottom, clear of every generation row */
const rootY=46+gKeys.length*RH;
pos[ROOT]={x:W/2,y:rootY};

// generation labels
gKeys.forEach((g,gi)=>{
  const d=document.createElement('div');
  d.className='gen-lbl'; d.textContent='نسل '+(g+1);
  d.style.top=(46+gi*RH)+'px'; cv.appendChild(d);
});

let svg='';
Object.keys(pos).forEach(id=>{
  const p=M[id]; if(!p) return;
  (p.parents||[]).forEach(pid=>{
    const a=pos[id], b=pos[pid]; if(!a||!b) return;
    const side=sideOf(id,ROOT);
    const col=side==='m'?'#F2A8D0':'#7BE8B6';
    const y1=b.y+34,y2=a.y-34,my=(y1+y2)/2;
    svg+=`<path d="M${b.x},${y1} L${b.x},${my} L${a.x},${my} L${a.x},${y2}" fill="none"
      stroke="${col}" stroke-opacity=".35" stroke-width="1.5"/>`;
  });
});
const drawn=new Set();
Object.keys(pos).forEach(id=>{
  (M[id].spouses||[]).forEach(sid=>{
    const k=[id,sid].sort().join('|'); if(drawn.has(k)) return; drawn.add(k);
    const a=pos[id],b=pos[sid]; if(!a||!b) return;
    const cross=sideOf(id,ROOT)!==sideOf(sid,ROOT);
    svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${cross?'#C9A227':'#3A4F45'}"
      stroke-opacity="${cross?'.9':'.35'}" stroke-width="${cross?2.2:1.2}" stroke-dasharray="5 4"/>`;
  });
});
cv.insertAdjacentHTML('afterbegin',`<svg width="${W}" height="${H}">${svg}</svg>`);

Object.keys(pos).forEach(id=>{
  const m=M[id],q=pos[id],side=id===ROOT?'':sideOf(id,ROOT);
  const el=document.createElement('div');
  el.className='nd '+(side||'');
  el.style.left=q.x+'px'; el.style.top=(q.y-38)+'px';
  el.innerHTML=`<div class="card"><div class="av ${m.gender==='female'?'f':''} ${isDead(m)?'d':''}">${esc(initial(m.name))}</div>
    <div class="nm">${esc(m.name)}</div>
    <div class="kin">${id===ROOT?'خودِ شما':esc(kinshipOf(id,ROOT))}</div>
    <div class="life">${lifeSpan(m)}</div></div>`;
  cv.appendChild(el);
});
</script><script src="../refresh-button.js"></script>
<script src="../usage-tracker.js" data-app="m1"></script>
</body></html>
