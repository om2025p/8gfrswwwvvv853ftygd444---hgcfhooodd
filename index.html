<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script src="storage-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="cloud-sync.js"></script>
    <title>عمارت دیجیتال</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --opaque-white: rgba(255, 255, 255, 0.9);
            --text-color: #ffffff;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background 1s ease;
        }

        /* تم روز - آسمانی */
        body.day-theme {
            background: linear-gradient(180deg, #87CEEB 0%, #B0E2FF 100%);
            color: #1e3a8a;
        }
        body.day-theme .app-card {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
            color: #1e3a8a;
        }
        body.day-theme .app-title { font-weight: 600; }

        /* تم شب - ستاره‌ای */
        body.night-theme {
            background: radial-gradient(circle at center, #1e3a8a 0%, #020617 100%);
            color: #ffffff;
        }

        /* المان‌های تزئینی */
        .sky-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .moon {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            display: none;
        }
        body.night-theme .moon { display: block; }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }

        /* لایه شیشه‌ای مات روی کل صفحه */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 100vw;
            padding: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        .app-grid {
            display: flex;
            flex-direction: row;
            gap: 15px;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding: 15px 20px;
            box-sizing: border-box;
            position: relative;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }

        .app-grid::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .app-card {
            flex: 0 0 100px;
            scroll-snap-align: start;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 15px 5px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: pan-x;
            -webkit-touch-callout: none; /* Disable callout, e.g., on iOS */
        }

        .app-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .app-card:active {
            transform: scale(0.95);
        }

        .app-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .app-icon img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 14px;
            background: var(--opaque-white);
            padding: 2px;
        }

        .app-title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            pointer-events: none;
        }

        .coming-soon {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* حالت لرزش */
        @keyframes jiggle {
            0% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(-1.5deg); }
        }

        .editing .app-card {
            animation: jiggle 0.25s infinite ease-in-out;
        }

        .editing .app-card:active, .editing .app-card.dragging {
            animation: none;
            transform: scale(1.1);
            z-index: 1000;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            background: rgba(255,255,255,0.25);
            opacity: 0.9;
        }

        /* انیمیشن‌های ورود */
        @keyframes flyIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .fly-in {
            animation: flyIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @media (max-width: 400px) {
            .app-grid { gap: 12px; }
            .app-icon img { width: 50px; height: 50px; }
            .app-title { font-size: 0.75rem; }
        }

        /* استایل کشیدن */
        .dragging {
            z-index: 1000;
        }

        /* دکمه ثابت بایگانی در گوشه بالا سمت راست */
        .archive-fixed-btn {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top, 0px));
            right: 14px;
            z-index: 150;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: inherit;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .archive-fixed-btn:hover {
            background: rgba(255, 255, 255, 0.24);
            border-color: rgba(255, 255, 255, 0.48);
        }

        .archive-fixed-btn:active {
            transform: scale(0.95);
        }

        body.day-theme .archive-fixed-btn {
            background: rgba(255, 255, 255, 0.55);
            border-color: rgba(255, 255, 255, 0.72);
            color: #1e3a8a;
        }

        .archive-fixed-count {
            font-size: 0.72rem;
            padding: 1px 7px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.28);
        }

        .archive-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.68);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .archive-modal-backdrop.open {
            display: flex;
        }

        .archive-modal-box {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        body.day-theme .archive-modal-box {
            background: rgba(248, 250, 252, 0.96);
            color: #1e293b;
            border-color: rgba(30, 58, 138, 0.18);
        }

        .archive-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.25);
        }

        .archive-modal-head h2 {
            margin: 0;
            font-size: 1.02rem;
        }

        .archive-close-btn {
            background: rgba(148, 163, 184, 0.2);
            border: none;
            color: inherit;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }

        .archive-note {
            font-size: 0.78rem;
            opacity: 0.75;
            margin: 0 0 14px;
            line-height: 1.6;
        }

        .archive-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .archived-app-item {
            width: 104px;
            padding: 14px 8px;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(148, 163, 184, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 7px;
            pointer-events: none;
            user-select: none;
            cursor: default;
            opacity: 0.65;
        }

        .archived-app-item img {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: contain;
            filter: grayscale(100%) contrast(0.95);
            -webkit-filter: grayscale(100%) contrast(0.95);
            background: rgba(255, 255, 255, 0.7);
            padding: 2px;
        }

        .archived-app-title {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .archived-app-badge {
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(100, 116, 139, 0.28);
        }
    </style>
</head>
<body class="day-theme">

    <div class="sky-elements" id="skyElements">
        <div class="moon"></div>
    </div>

    <button type="button" class="archive-fixed-btn" id="openArchiveBtn" aria-label="بایگانی برنامه‌ها">
        <span>🗄️</span>
        <span>بایگانی</span>
        <span class="archive-fixed-count" id="archiveCountBadge">۱</span>
    </button>

    <div class="container">
        <div class="app-grid" id="appGrid">
            <!-- آیتم‌ها توسط جاوا اسکریپت رندر می‌شوند -->
        </div>
    </div>

    <div class="archive-modal-backdrop" id="archiveModal" aria-hidden="true">
        <div class="archive-modal-box">
            <div class="archive-modal-head">
                <h2>🗄️ بایگانی برنامه‌ها</h2>
                <button type="button" class="archive-close-btn" id="closeArchiveModal" aria-label="بستن">✕</button>
            </div>
            <p class="archive-note">برنامه‌های داخل بایگانی کاملاً غیرفعال هستند و تنها با تغییر کد از این حالت خارج می‌شوند.</p>
            <div class="archive-grid" id="archiveGrid"></div>
        </div>
    </div>

    <script>
        function updateTheme() {
            const hour = new Date().getHours();
            const isNight = hour < 6 || hour >= 18;
            const body = document.body;
            const sky = document.getElementById('skyElements');

            if (isNight) {
                body.classList.remove('day-theme');
                body.classList.add('night-theme');
                generateStars(sky);
            } else {
                body.classList.remove('night-theme');
                body.classList.add('day-theme');
                clearStars();
            }
        }

        function generateStars(container) {
            if (document.querySelectorAll('.star').length > 0) return;
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(star);
            }
        }

        function clearStars() {
            document.querySelectorAll('.star').forEach(s => s.remove());
        }

        updateTheme();
        setInterval(updateTheme, 60000); // چک کردن هر دقیقه

        const ARCHIVED_APPS = [
            { id: 'ai-chat', title: 'چت هوشمند', icon: 'ai-chat/icon-192.png' }
        ];

        const DEFAULT_APPS = [
            { id: 'gym', title: 'Activity', icon: 'gym/icon-192.png', url: 'gym/index.html' },
            { id: 'gold', title: 'ثبت درصد 1', icon: 'gold/icon-192.png', url: 'gold/index.html' },
            { id: 'gold2', title: 'ثبت درصد 2', icon: 'gold2/icon-192.png', url: 'gold2/index.html' },
            { id: 'gold3', title: 'ثبت درصد 3', icon: 'gold3/icon-192.png', url: 'gold3/index.html' },
            { id: 'gold4', title: 'ثبت درصد 4', icon: 'gold4/icon-192.png', url: 'gold4/index.html' },
            { id: 'gold5', title: 'ثبت درصد 5', icon: 'gold5/icon-192.png', url: 'gold5/index.html' },
            { id: 'gold6', title: 'ثبت درصد 6', icon: 'gold6/icon-192.png', url: 'gold6/index.html' },
            { id: 'gold7', title: 'ثبت درصد 7', icon: 'gold7/icon-192.png', url: 'gold7/index.html' },
            { id: 'gold8', title: 'ثبت درصد 8', icon: 'gold8/icon-192.png', url: 'gold8/index.html' },
            { id: 'gold9', title: 'ثبت درصد 9', icon: 'gold9/icon-192.png', url: 'gold9/index.html' },
            { id: 'gold10', title: 'ثبت درصد 10', icon: 'gold10/icon-192.png', url: 'gold10/index.html' },
            { id: 'gold11', title: 'ثبت درصد 11', icon: 'gold11/icon-192.png', url: 'gold11/index.html' },
            { id: 'monitor', title: 'دیدبان درصد ها', icon: 'monitor/icon-192.png', url: 'monitor/index.html' },
            { id: 'skincare', title: 'مراقبت پوستی', icon: 'skincare/icon-192.png', url: 'skincare/index.html' },
            { id: 'profit', title: 'محاسبه گر سود', icon: 'profit-calculator/icon-192.png', url: 'profit-calculator/index.html' },
            { id: 'second-brain', title: 'مغز دوم', icon: 'second-brain/icon-192.png', url: 'second-brain/index.html' },
            { id: 'tabdeal', title: 'کیف پول تبدیل', icon: 'tabdeal/icon-192.png', url: 'tabdeal/index.html' },
            { id: 'detective', title: 'کارآگاه داده‌ها', icon: 'detective/icon-192.png', url: 'detective/index.html' },
            { id: 'simple-chat', title: 'چت فرمان‌بردار', icon: 'simple-chat/icon-192.png', url: 'simple-chat/index.html' },
            { id: 'vault', title: 'رمز راز', icon: 'vault/icon-192.png', url: 'vault/index.html' },
            { id: 'restricted', title: 'سپر دانلود', icon: 'restricted/icon-192.png', url: 'restricted/index.html' },
            { id: 'family', title: 'شجره‌نامه', icon: 'family/icon-192.png', url: 'family/index.html' },
            { id: 'family-lab', title: 'آزمایشگاه رابط کاربری', icon: 'family/icon-192.png', url: 'family-lab/index.html' },
            { id: 'monthly-deposit', title: 'واریز ماهیانه', icon: 'monthly-deposit/icon-192.png', url: 'monthly-deposit/index.html' },
            { id: 'peace', title: 'ثبت آرامش', icon: 'peace/icon-192.png', url: 'peace/index.html' },
            { id: 'yandex', title: 'جستجوگر عکس', icon: 'yandex/icon-192.png', url: 'yandex/index.html' },
            { id: 'html-viewer', title: 'نمایشگر کد', icon: 'html-viewer/icon-192.png', url: 'html-viewer/index.html' },
            { id: 'funds', title: 'WWW.com', icon: 'funds/icon-192.png', url: 'funds/index.html' },
            { id: 'clipboard', title: 'کلیپ بورد', icon: 'clipboard/icon-192.png', url: 'clipboard/index.html' },
            { id: 'jules-agent', title: 'دستیار جولز', icon: 'jules-agent/icon-192.png', url: 'jules-agent/index.html' },
            { id: 'jules-bot', title: 'ربات جولز', icon: 'jules-bot/icon-192.png', url: 'jules-bot/index.html' },
            { id: 'liquidity', title: 'محاسبه نقدشوندگی', icon: 'liquidity/icon-192.png', url: 'liquidity/index.html' },
            { id: 'image-enhancer', title: 'ارتقای عکس', icon: 'image-enhancer/icon-192.png', url: 'image-enhancer/index.html' },
            { id: 'daily-report', title: 'گزارش روز', icon: 'daily-report/icon-192.png', url: 'daily-report/index.html' },
            { id: 'sync', title: 'همگام‌ساز عمارت', icon: 'sync/icon-192.png', url: 'sync/index.html' },
            { id: 'usage', title: 'ردپای من', icon: 'usage/icon-192.png', url: 'usage/index.html' },
            { id: 'rescue', title: 'جعبهٔ نجات', icon: 'rescue/icon-192.png', url: 'rescue/index.html' }
        ];

        const archivedIds = new Set(ARCHIVED_APPS.map(a => a.id));
        let savedApps = JSON.parse(localStorage.getItem('portal_app_order'));
        // فیلتر کردن آیتم‌های قدیمی «به زودی» و برنامه‌های منتقل‌شده به بایگانی
        let apps = savedApps
            ? savedApps.filter(a => !a.comingSoon && !archivedIds.has(a.id))
            : DEFAULT_APPS;

        // همگام‌سازی و بروزرسانی نام‌ها و مطمئن شدن از اضافه شدن برنامه‌های جدید
        if (savedApps) {
            apps = apps.map(app => {
                const matched = DEFAULT_APPS.find(d => d.id === app.id);
                if (matched) {
                    app.title = matched.title;
                    app.url = matched.url;
                    app.icon = matched.icon;
                }
                return app;
            });
            DEFAULT_APPS.forEach(defaultApp => {
                if (!apps.some(a => a.id === defaultApp.id)) {
                    // قرار دادن برنامه‌های جدید در انتهای لیست (سمت چپ‌ترین بخش اسکرول در تم RTL)
                    apps.push(defaultApp);
                }
            });
            localStorage.setItem('portal_app_order', JSON.stringify(apps));
        }

        let isEditing = false;
        let dragItem = null;
        let pressTimer = null;

        const grid = document.getElementById('appGrid');

        function renderApps() {
            grid.innerHTML = '';
            apps.forEach((app, index) => {
                const card = document.createElement('a');
                card.href = app.url;
                card.className = `app-card fly-in ${app.comingSoon ? 'coming-soon' : ''}`;
                card.dataset.id = app.id;
                card.style.animationDelay = `${index * 0.05}s`;

                // غیرفعال کردن انیمیشن بعد از پایان برای جلوگیری از ریست شدن در درگ
                card.addEventListener('animationend', () => {
                    card.style.opacity = '1';
                    card.classList.remove('fly-in');
                }, { once: true });

                card.onclick = (e) => {
                    if (isEditing || app.comingSoon) e.preventDefault();
                };

                const iconDiv = document.createElement('div');
                iconDiv.className = 'app-icon';
                if (/\.png(\?|$)/i.test(app.icon)) {
                    const img = document.createElement('img');
                    img.src = app.icon;
                    img.alt = app.title;
                    img.onerror = () => {
                        if (!img.dataset.retried) {
                            img.dataset.retried = '1';
                            img.src = `${app.icon}?v=100`;
                            return;
                        }
                        iconDiv.textContent = app.id === 'second-brain' ? '🧠' : '📱';
                    };
                    iconDiv.appendChild(img);
                } else {
                    iconDiv.innerText = app.icon;
                }

                const titleDiv = document.createElement('div');
                titleDiv.className = 'app-title';
                titleDiv.innerText = app.title;

                card.appendChild(iconDiv);
                card.appendChild(titleDiv);

                card.onpointerdown = handlePointerDown;
                card.onpointerup = handlePointerUp;
                card.onpointercancel = handlePointerUp;
                card.onpointermove = handlePointerMove;
                card.oncontextmenu = (e) => e.preventDefault(); // Prevent context menu on long press

                grid.appendChild(card);
            });
        }

        function renderArchiveModal() {
            const archiveGrid = document.getElementById('archiveGrid');
            if (!archiveGrid) return;
            archiveGrid.innerHTML = '';
            ARCHIVED_APPS.forEach(item => {
                const el = document.createElement('div');
                el.className = 'archived-app-item';
                el.setAttribute('aria-disabled', 'true');

                const img = document.createElement('img');
                img.src = item.icon;
                img.alt = item.title;

                const title = document.createElement('div');
                title.className = 'archived-app-title';
                title.textContent = item.title;

                const badge = document.createElement('span');
                badge.className = 'archived-app-badge';
                badge.textContent = 'غیرفعال';

                el.append(img, title, badge);
                archiveGrid.appendChild(el);
            });
        }

        function openArchiveModal() {
            renderArchiveModal();
            const modal = document.getElementById('archiveModal');
            if (modal) {
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
            }
        }

        function closeArchiveModalFn() {
            const modal = document.getElementById('archiveModal');
            if (modal) {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            }
        }

        const openArchiveBtn = document.getElementById('openArchiveBtn');
        const archiveCountBadge = document.getElementById('archiveCountBadge');
        if (archiveCountBadge) {
            archiveCountBadge.textContent = ARCHIVED_APPS.length.toLocaleString('fa-IR');
        }
        if (openArchiveBtn) {
            if (ARCHIVED_APPS.length === 0) {
                openArchiveBtn.style.display = 'none';
            } else {
                openArchiveBtn.onclick = () => openArchiveModal();
            }
        }

        document.getElementById('closeArchiveModal').onclick = closeArchiveModalFn;
        document.getElementById('archiveModal').onclick = (e) => {
            if (e.target.id === 'archiveModal') closeArchiveModalFn();
        };

        function handlePointerDown(e) {
            if (isEditing) {
                startDragging(e);
            } else {
                const target = e.currentTarget;
                const pointerId = e.pointerId;
                pressTimer = setTimeout(() => {
                    enterEditMode();
                    // شروع جابجایی بلافاصله پس از ورود به حالت ویرایش
                    startDraggingManual(target, pointerId);
                }, 500);
            }
        }

        function handlePointerUp(e) {
            clearTimeout(pressTimer);
            if (isEditing && dragItem) {
                stopDragging(e);
            }
        }

        function handlePointerMove(e) {
            if (!isEditing) {
                // اضافه کردن کمی تلرانس برای لرزش دست موقع نگه داشتن آیکون
                if (Math.abs(e.movementX) > 3 || Math.abs(e.movementY) > 3) {
                    clearTimeout(pressTimer);
                }
            } else if (dragItem) {
                moveDragging(e);
            }
        }

        function enterEditMode() {
            isEditing = true;
            document.body.classList.add('editing');
            if (navigator.vibrate) navigator.vibrate(100);

            const exitHandler = (e) => {
                if (!e.target.closest('.app-card')) {
                    exitEditMode();
                    window.removeEventListener('pointerdown', exitHandler);
                }
            };
            window.addEventListener('pointerdown', exitHandler);
        }

        function exitEditMode() {
            isEditing = false;
            document.body.classList.remove('editing');
            saveOrder();
        }

        function saveOrder() {
            const currentOrder = Array.from(grid.children).map(card => {
                const appId = card.dataset.id;
                return apps.find(a => a.id === appId);
            }).filter(Boolean);

            if (currentOrder.length > 0) {
                localStorage.setItem('portal_app_order', JSON.stringify(currentOrder));
                apps = currentOrder;
            }
        }

        function startDragging(e) {
            startDraggingManual(e.currentTarget, e.pointerId);
        }

        function startDraggingManual(element, pointerId) {
            dragItem = element;
            dragItem.classList.add('dragging');
            dragItem.setPointerCapture(pointerId);
        }

        function moveDragging(e) {
            if (!dragItem) return;
            const afterElement = getDragAfterElement(grid, e.clientX, e.clientY);
            if (afterElement == null) {
                grid.appendChild(dragItem);
            } else {
                grid.insertBefore(dragItem, afterElement);
            }
        }

        function stopDragging(e) {
            if (!dragItem) return;
            dragItem.classList.remove('dragging');
            dragItem.releasePointerCapture(e.pointerId);
            dragItem = null;
            saveOrder();
        }

        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.app-card:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const centerX = box.left + box.width / 2;
                const centerY = box.top + box.height / 2;
                const distance = Math.hypot(x - centerX, y - centerY);

                if (distance < closest.distance) {
                    return { distance: distance, element: child };
                } else {
                    return closest;
                }
            }, { distance: 1000 }).element; // Limit distance to prevent jumping
        }

        renderApps();

        // اسکرول افقی با چرخ موس در دسکتاپ
        grid.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                grid.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        // فعال‌سازی سپر پایداری داده‌ها (Persistent Storage) برای بیمه کردن LocalStorage و داده‌ها
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().then(granted => {
                if (granted) {
                    console.log('Persistent storage granted successfully!');
                } else {
                    console.log('Persistent storage request was not granted yet.');
                }
            }).catch(err => {
                console.error('Error requesting persistent storage:', err);
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // پاکسازی سرویس ورکرهای قدیمی از زیرپوشه‌ها برای جلوگیری از تداخل
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (let registration of registrations) {
                        const path = new URL(registration.scope).pathname;
                        if (path.includes('/gym/') || path.includes('/gold/') || path.includes('/gold2/') || path.includes('/gold3/') || path.includes('/gold4/') || path.includes('/gold5/') || path.includes('/gold6/') || path.includes('/gold7/') || path.includes('/gold8/') || path.includes('/gold9/') || path.includes('/gold10/') || path.includes('/gold11/') || path.includes('/monitor/') || path.includes('/skincare/') || path.includes('/profit-calculator/') || path.includes('/ai-chat/') || path.includes('/tabdeal/') || path.includes('/family/') || path.includes('/monthly-deposit/') || path.includes('/peace/') || path.includes('/yandex/') || path.includes('/html-viewer/') || path.includes('/funds/') || path.includes('/clipboard/') || path.includes('/liquidity/')) {
                            registration.unregister().then(success => {
                                if (success) console.log(`Legacy SW at ${path} unregistered.`);
                            });
                        }
                    }
                });

                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('Service Worker registered!');
                        // چک کردن برای به‌روزرسانی در هر بار لود شدن صفحه
                        if (reg) {
                            reg.update();
                        }
                    })
                    .catch(err => console.error('SW registration failed:', err));

                // بارگذاری مجدد خودکار صفحه وقتی سرویس ورکر جدید کنترل را به دست می‌گیرد
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            });
        }
    </script>

<script src="refresh-button.js"></script>
<script src="usage-tracker.js" data-app="portal"></script>
</body>
</html>
