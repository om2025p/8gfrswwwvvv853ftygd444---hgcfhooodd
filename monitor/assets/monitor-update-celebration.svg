<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <g opacity="0.16">
    <circle cx="140" cy="120" r="150" fill="#a855f7"/>
    <circle cx="1080" cy="180" r="120" fill="#22d3ee"/>
    <circle cx="980" cy="700" r="170" fill="#4ade80"/>
    <circle cx="220" cy="690" r="130" fill="#f59e0b"/>
  </g>

  <g>
    <rect x="60" y="60" width="1080" height="680" rx="42" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Vazirmatn" font-weight="700" font-size="62" fill="url(#gold)" filter="url(#glow)">👑 تحلیل هوشمند، حالا دقیق شد</text>
  <text x="600" y="205" text-anchor="middle" font-family="Vazirmatn" font-size="27" fill="#c7d2fe">دیدبان درصدها — سود فوق‌قله از این پس نسبت به قلهٔ قبلی سنجیده می‌شود</text>

  <g filter="url(#soft)">
    <rect x="90" y="250" width="1020" height="330" rx="30" fill="#0b1120" opacity="0.75" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="150" y1="540" x2="1060" y2="540" stroke="#64748b" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="150" y1="460" x2="1060" y2="460" stroke="#64748b" stroke-opacity="0.18" stroke-width="1.5"/>
    <line x1="150" y1="380" x2="1060" y2="380" stroke="#64748b" stroke-opacity="0.18" stroke-width="1.5"/>
    <line x1="150" y1="300" x2="1060" y2="300" stroke="#64748b" stroke-opacity="0.18" stroke-width="1.5"/>

    <path d="M150 530 L330 470 L500 495 L670 390 L840 350 L1010 285 L1010 540 L150 540 Z" fill="url(#area)"/>
    <path d="M150 530 L330 470 L500 495 L670 390 L840 350 L1010 285" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <circle cx="330" cy="470" r="11" fill="#0b1120" stroke="#22d3ee" stroke-width="5"/>
    <circle cx="670" cy="390" r="11" fill="#0b1120" stroke="#22d3ee" stroke-width="5"/>
    <circle cx="840" cy="350" r="11" fill="#0b1120" stroke="#22d3ee" stroke-width="5"/>
    <circle cx="1010" cy="285" r="16" fill="#4ade80" stroke="#0b1120" stroke-width="6" filter="url(#glow)"/>

    <text x="1010" y="250" text-anchor="middle" font-family="Vazirmatn" font-weight="700" font-size="30" fill="#4ade80">قله جدید 🚀</text>
    <text x="170" y="290" font-family="Vazirmatn" font-size="22" fill="#94a3b8">رشد تراکمی فوق‌قله</text>
  </g>

  <g filter="url(#soft)">
    <rect x="90" y="610" width="330" height="100" rx="22" fill="#7c3aed" opacity="0.22" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2"/>
    <text x="255" y="655" text-anchor="middle" font-family="Vazirmatn" font-size="20" fill="#ddd6fe">سود امروز</text>
    <text x="255" y="692" text-anchor="middle" font-family="Vazirmatn" font-weight="700" font-size="34" fill="#f5d0fe">+ دقیق و واقعی</text>
  </g>

  <g filter="url(#soft)">
    <rect x="435" y="610" width="330" height="100" rx="22" fill="#0891b2" opacity="0.22" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <text x="600" y="655" text-anchor="middle" font-family="Vazirmatn" font-size="20" fill="#a5f3fc">هدف نهایی</text>
    <text x="600" y="692" text-anchor="middle" font-family="Vazirmatn" font-weight="700" font-size="34" fill="#67e8f9">۳۰۰۰٪ تراکمی</text>
  </g>

  <g filter="url(#soft)">
    <rect x="780" y="610" width="330" height="100" rx="22" fill="#15803d" opacity="0.22" stroke="#4ade80" stroke-opacity="0.55" stroke-width="2"/>
    <text x="945" y="655" text-anchor="middle" font-family="Vazirmatn" font-size="20" fill="#bbf7d0">نسخه</text>
    <text x="945" y="692" text-anchor="middle" font-family="Vazirmatn" font-weight="700" font-size="34" fill="#86efac">v63 ✅</text>
  </g>

  <g opacity="0.95">
    <rect x="120" y="235" width="16" height="16" rx="3" fill="#f472b6" transform="rotate(22 128 243)"/>
    <rect x="1050" y="300" width="14" height="14" rx="3" fill="#fde047" transform="rotate(-18 1057 307)"/>
    <rect x="250" y="205" width="13" height="13" rx="3" fill="#22d3ee" transform="rotate(40 256 211)"/>
    <rect x="930" y="215" width="15" height="15" rx="3" fill="#a78bfa" transform="rotate(-30 937 222)"/>
    <circle cx="480" cy="225" r="7" fill="#4ade80"/>
    <circle cx="760" cy="205" r="6" fill="#fb923c"/>
    <circle cx="140" cy="560" r="6" fill="#fde047"/>
    <circle cx="1065" cy="560" r="7" fill="#22d3ee"/>
  </g>

  <text x="600" y="762" text-anchor="middle" font-family="Vazirmatn" font-size="21" fill="#93c5fd">عمارت دیجیتال · تحلیل هوشمند · ساخته‌شده با 🎯 و کمی شوخ‌طبعی</text>
</svg>
