<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1512">
<title>آزمایشگاه رابط کاربری · شجره‌نامه</title>
<link rel="icon" href="../family/icon-192.png">
<link rel="stylesheet" href="../vendor/vazirmatn/fonts.css">
<style>
:root{
  --bg:#0E1512; --surface:#16211D; --surface2:#1D2A25; --surface3:#22332C;
  --line:#2A3A33; --line2:#35493F;
  --text:#EAF2ED; --text2:#A8BFB3; --text3:#7E9588;
  --accent:#3DDC97; --accent-dim:#1E9E6A; --gold:#C9A227;
  --blue:#5B8FB9; --violet:#8A7BB5; --danger:#E8654F; --pink:#F2A8D0;
  --r:18px; --r-sm:12px; --r-xs:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font-family:'Vazirmatn',system-ui,Tahoma,sans-serif;font-size:14px;
  overflow:hidden;
}
button{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}

.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{
  flex:0 0 auto;padding:10px 13px 9px;
  background:linear-gradient(180deg,#17231E,#111A16);
  border-bottom:1px solid var(--line);z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.brand-mark{
  width:31px;height:31px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));font-size:15px;
}
.brand-txt{flex:1;min-width:0}
.brand h1{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.brand small{display:block;font-size:10px;color:var(--text3);margin-top:1px}
.data-chip{
  display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;
  border:1px solid var(--line2);background:var(--surface);color:var(--text2);
  font-size:10px;font-weight:600;cursor:pointer;flex:0 0 auto;
}
.data-chip.live{color:#7BE8B6;border-color:#2A5C45;background:#12241C}
.data-chip.demo{color:#F0C674;border-color:#5C4A20;background:#241E10}

.seg{display:flex;gap:4px;background:#0A100E;border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{
  flex:1;border:0;background:transparent;color:var(--text3);font-size:11.5px;font-weight:600;
  padding:8px 4px;border-radius:9px;cursor:pointer;transition:background .18s,color .18s;white-space:nowrap;
}
.seg button.on{background:var(--accent);color:#04170F}

.stage{flex:1 1 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .2s}
.view.on{opacity:1;pointer-events:auto}

.hintbar{
  flex:0 0 auto;padding:6px 13px calc(6px + var(--safe-b));
  background:#0A100E;border-top:1px solid var(--line);
  font-size:10px;color:var(--text3);text-align:center;line-height:1.5;
}

.av{
  border-radius:50%;display:grid;place-items:center;font-weight:700;overflow:hidden;
  background:linear-gradient(140deg,#2B4A3D,#1B3028);color:var(--accent);
  border:1.5px solid #33544A;flex:0 0 auto;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.f{background:linear-gradient(140deg,#4A2B42,#301B2A);color:var(--pink);border-color:#5A3350}
.av.dead{filter:grayscale(.8);opacity:.6}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:2.5px 8px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--line);font-size:10px;color:var(--text2);white-space:nowrap;
}
.pill.live{color:#7BE8B6;border-color:#2A5C45;background:#12241C}
.pill.dead{color:#E2A99C;border-color:#4A2E2A;background:#221514}
.pill.gold{color:#EBD08A;border-color:#5C4A20;background:#241E10}

.gen-wrap{padding:12px 0 26px}
.gen-row{display:flex;align-items:flex-start;margin-bottom:9px}
.gen-label{
  flex:0 0 58px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 2px;position:sticky;right:0;z-index:3;
  background:linear-gradient(90deg,var(--bg) 70%,transparent);
}
.gen-num{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line2);color:var(--accent);
}
.gen-name{font-size:8.5px;color:var(--text3);white-space:nowrap}
.gen-track{
  display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 6px 8px;
  flex:1 1 auto;scroll-snap-type:x proximity;scrollbar-width:none;
}
.gen-track::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;width:100px;padding:9px 8px;border-radius:var(--r-sm);scroll-snap-align:start;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
  transition:border-color .16s,transform .16s,background .16s;
}
.chip:active{transform:scale(.95)}
.chip.sel{border-color:var(--accent);background:var(--surface2)}
.chip .av{width:38px;height:38px;font-size:14px}
.chip .nm{font-size:11px;font-weight:700;line-height:1.3;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .jb{font-size:9px;color:var(--text3);line-height:1.3;min-height:12px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .yr{font-size:8.5px;color:var(--text3);direction:ltr;letter-spacing:.2px}
.gen-sep{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:0 58px 9px 14px}

.deck{padding:13px 13px 30px;display:flex;flex-direction:column;gap:11px}
.deck-hero{
  background:linear-gradient(165deg,var(--surface2),var(--surface));
  border:1px solid var(--line2);border-radius:var(--r);padding:18px 16px 15px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;position:relative;overflow:hidden;
}
.deck-hero::before{
  content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);
  width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(61,220,151,.14),transparent 70%);pointer-events:none;
}
.deck-hero .av{width:84px;height:84px;font-size:31px;border-width:2.5px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.deck-name{font-size:20px;font-weight:700;margin:3px 0 0;letter-spacing:-.4px;line-height:1.25}
.deck-rel{font-size:11.5px;color:var(--accent);font-weight:600}
.deck-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:1px}
.deck-bio{
  font-size:11.5px;color:var(--text2);line-height:1.9;background:#0E1714;
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;
  width:100%;text-align:right;margin-top:5px;
}
.deck-facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;margin-top:4px}
.fact{background:#0E1714;border:1px solid var(--line);border-radius:11px;padding:8px 10px;text-align:right}
.fact b{display:block;font-size:9px;color:var(--text3);font-weight:500;margin-bottom:1px}
.fact span{font-size:11.5px;font-weight:600}

.deck-edit{
  width:100%;border:1px solid var(--line2);background:var(--surface2);color:var(--text2);
  font-family:inherit;font-size:11.5px;font-weight:600;padding:9px;border-radius:11px;cursor:pointer;
}
.deck-edit:active{transform:scale(.98)}
.dtabs{display:flex;gap:5px;background:#0A100E;border:1px solid var(--line);border-radius:11px;padding:3px}
.dtabs button{
  flex:1;border:0;background:transparent;color:var(--text3);font-size:11px;font-weight:600;
  padding:7px 4px;border-radius:8px;cursor:pointer;transition:.18s;
}
.dtabs button.on{background:var(--surface3);color:var(--text)}

.panel{display:none;flex-direction:column;gap:9px}
.panel.on{display:flex}
.rel-block{display:flex;flex-direction:column;gap:6px}
.rel-title{font-size:10.5px;color:var(--text3);font-weight:600;display:flex;align-items:center;gap:6px}
.rel-title::after{content:'';flex:1;height:1px;background:var(--line)}
.rel-row{display:flex;gap:6px;flex-wrap:wrap}
.rel-chip{
  display:flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;
  font-size:10.5px;color:var(--text);font-weight:600;transition:.16s;
}
.rel-chip:active{transform:scale(.95)}
.rel-chip .av{width:21px;height:21px;font-size:8.5px;border-width:1px}
.rel-empty{font-size:10.5px;color:var(--text3);padding:4px 2px}

.tl{position:relative;padding:4px 4px 4px 0;display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:10px;position:relative;padding-bottom:13px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--accent);
  margin-top:4px;position:relative;z-index:1;box-shadow:0 0 0 3px rgba(61,220,151,.16);
}
.tl-dot.gold{background:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.16)}
.tl-dot.muted{background:var(--text3);box-shadow:0 0 0 3px rgba(126,149,136,.14)}
.tl-item::before{
  content:'';position:absolute;right:4px;top:13px;bottom:0;width:1px;background:var(--line);
}
.tl-item:last-child::before{display:none}
.tl-body{flex:1;min-width:0}
.tl-ttl{font-size:11.5px;font-weight:600;line-height:1.4}
.tl-sub{font-size:9.5px;color:var(--text3);margin-top:1px}

.table-wrap{padding:13px 12px 30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 8px;
  display:flex;flex-direction:column;gap:1px;text-align:center;
}
.stat b{font-size:16px;font-weight:700;line-height:1.1;color:var(--accent)}
.stat.dead b{color:#D89A8C}
.stat small{font-size:8.5px;color:var(--text3);line-height:1.3}
.tools{display:flex;gap:6px;margin-bottom:9px}
.tools input{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:10px 11px;color:var(--text);font-size:11.5px;outline:none;min-width:0;
}
.tools input:focus{border-color:var(--accent)}
.tools input::placeholder{color:var(--text3)}
.icon-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--text2);
  font-size:10.5px;font-weight:600;padding:0 11px;border-radius:11px;cursor:pointer;white-space:nowrap;
}
.icon-btn.on{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.filters button{
  flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--text3);
  font-size:10px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;
}
.filters button.on{background:var(--surface3);color:var(--text);border-color:var(--line2)}
.tbl{width:100%;border-collapse:separate;border-spacing:0 5px}
.tbl th{font-size:9px;color:var(--text3);font-weight:600;text-align:right;padding:0 9px 2px}
.tbl td{
  background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:8px 9px;font-size:11px;vertical-align:middle;
}
.tbl tr td:first-child{border-right:1px solid var(--line);border-radius:0 11px 11px 0}
.tbl tr td:last-child{border-left:1px solid var(--line);border-radius:11px 0 0 11px}
.tbl tbody tr{cursor:pointer;transition:transform .14s}
.tbl tbody tr:active{transform:scale(.99)}
.tbl .who{display:flex;align-items:center;gap:6px;min-width:0}
.tbl .who .av{width:25px;height:25px;font-size:10px}
.tbl .who span{font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gen-tag{display:inline-block;padding:1.5px 6px;border-radius:5px;background:var(--surface2);font-size:9px;color:var(--text2);border:1px solid var(--line)}
.empty{text-align:center;color:var(--text3);font-size:11.5px;padding:26px 0}

.radial{position:relative;height:100%;overflow:hidden}
.radial svg{position:absolute;inset:0;width:100%;height:100%}
.ring{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 6}
.node{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:pointer;transition:transform .16s;z-index:2;
}
.node:active{transform:translate(-50%,-50%) scale(.92)}
.node .av{width:40px;height:40px;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.5);border-width:2px}
.node .lbl{font-size:8.5px;color:var(--text2);font-weight:600;max-width:62px;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.center{z-index:3}
.node.center .av{width:62px;height:62px;font-size:22px;border-width:2.5px;box-shadow:0 0 0 5px rgba(61,220,151,.14),0 6px 20px rgba(0,0,0,.55)}
.node.center .lbl{font-size:10.5px;color:var(--text);font-weight:700;max-width:92px}
.radial-top{
  position:absolute;top:8px;right:8px;left:8px;display:flex;gap:5px;align-items:center;z-index:5;
}
.crumb{
  flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:rgba(11,18,16,.94);
  border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:9.5px;color:var(--text2);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.crumb b{color:var(--accent);font-weight:700}
.radial-legend{
  position:absolute;bottom:9px;right:50%;transform:translateX(50%);
  display:flex;gap:9px;background:rgba(11,18,16,.94);border:1px solid var(--line2);
  border-radius:999px;padding:5px 12px;font-size:9px;color:var(--text3);white-space:nowrap;z-index:5;
}
.radial-legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:3px;vertical-align:middle}

.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:60;backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:86vh;overflow-y:auto;
  background:linear-gradient(180deg,#1A2620,#141E19);
  border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.9,.3,1);
  padding:8px 14px calc(18px + var(--safe-b));
}
.sheet.on{transform:translateY(0)}
.sheet-grip{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 11px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sheet-head .av{width:52px;height:52px;font-size:19px;border-width:2px}
.sheet-name{font-size:16px;font-weight:700;line-height:1.25}
.sheet-sub{font-size:10.5px;color:var(--text3);margin-top:2px}
.sheet-x{
  margin-right:auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);
  background:var(--surface2);color:var(--text2);font-size:14px;cursor:pointer;line-height:1;
}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.kv div{background:#101917;border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.kv b{display:block;font-size:8.5px;color:var(--text3);font-weight:500}
.kv span{font-size:11px;font-weight:600}
.sheet-actions{display:flex;gap:6px;margin-top:11px}
.sheet-actions button{
  flex:1;border:1px solid var(--line2);background:var(--surface2);color:var(--text);
  font-size:11px;font-weight:600;padding:10px;border-radius:11px;cursor:pointer;
}
.sheet-actions button.primary{background:var(--accent);color:#04170F;border-color:var(--accent)}

.toast{
  position:fixed;bottom:calc(64px + var(--safe-b));right:50%;transform:translate(50%,20px);
  background:#1F2E28;border:1px solid var(--line2);color:var(--text);font-size:11.5px;
  padding:9px 16px;border-radius:999px;z-index:90;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(50%,0)}

.nodata{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  height:100%;padding:30px 26px;text-align:center;
}
.nodata .big{font-size:44px;opacity:.5}
.nodata h3{margin:0;font-size:14px}
.nodata p{margin:0;font-size:11px;color:var(--text3);line-height:1.8}
.nodata button{
  margin-top:6px;border:1px solid var(--accent);background:rgba(61,220,151,.1);color:var(--accent);
  font-size:11.5px;font-weight:600;padding:9px 18px;border-radius:11px;cursor:pointer;
}

/* ================= TREE VIEW ================= */
.tree-wrap{padding:10px 0 30px;position:relative}
.tree-head{
  position:sticky;top:0;z-index:12;background:linear-gradient(180deg,var(--bg) 78%,transparent);
  padding:4px 12px 8px;
}
.tree-toggle{display:flex;gap:5px;background:#0A100E;border:1px solid var(--line);border-radius:12px;padding:4px}
.tree-toggle button{
  flex:1;border:0;background:transparent;color:var(--text3);font-size:11.5px;font-weight:600;
  padding:9px 4px;border-radius:9px;cursor:pointer;transition:.18s;min-height:40px;
}
.tree-toggle button.on{background:var(--surface3);color:var(--text)}
.tree-toggle button.on[data-s="both"]{background:var(--accent);color:#04170F}
.tree-scroll{overflow-x:auto;overflow-y:hidden;padding:2px 0 10px;touch-action:pan-x pan-y}
.tree-scroll::-webkit-scrollbar{display:none}
.tree-canvas{position:relative;min-height:120px}
.tree-canvas svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.tnode{
  position:absolute;transform:translateX(-50%);width:84px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;padding:5px 3px;border-radius:10px;border:1px solid transparent;
  transition:background .16s,border-color .16s;z-index:2;
}
.tnode:active{background:var(--surface2)}
.tnode .av{width:36px;height:36px;font-size:13px;border-width:1.5px}
.tnode .tnm{
  font-size:9.5px;font-weight:700;line-height:1.25;text-align:center;max-width:80px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);
}
.tnode .tjb{font-size:8px;color:var(--text3);max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode.root .av{width:48px;height:48px;font-size:17px;border-width:2px;box-shadow:0 0 0 4px rgba(61,220,151,.14)}
.tnode.root .tnm{font-size:10.5px}
.tnode.focus .av{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,220,151,.28)}
.tnode.focus{background:var(--surface2);border-color:var(--line2)}
.tnode.hl .av{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.3)}

.side-badge{
  position:absolute;top:0;font-size:9px;font-weight:700;padding:2px 9px;border-radius:999px;
  white-space:nowrap;z-index:3;
}
.side-badge.p{background:#12241C;color:#7BE8B6;border:1px solid #2A5C45}
.side-badge.m{background:#241A22;color:#F2A8D0;border:1px solid #5A3350}

.tier-label{
  position:absolute;right:6px;font-size:8.5px;color:var(--text3);font-weight:600;
  writing-mode:vertical-rl;letter-spacing:.5px;
}

.tree-empty{
  padding:34px 24px;text-align:center;color:var(--text3);font-size:11.5px;line-height:2;
}
.tree-legend{
  display:flex;flex-wrap:wrap;gap:5px 10px;justify-content:center;
  padding:9px 12px;font-size:9px;color:var(--text3);
}
.tree-legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-left:4px;vertical-align:middle}
.marriage-note{
  margin:8px 12px 0;padding:8px 11px;border-radius:11px;font-size:10px;line-height:1.8;
  background:#241E10;border:1px solid #5C4A20;color:#EBD08A;
}

/* ---------------- editor ---------------- */
.fab-add{
  position:absolute;bottom:16px;left:14px;z-index:40;
  width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#04170F;
  font-size:26px;line-height:1;font-weight:700;

let M = {}, ids = [], source = 'demo', focusId = null, depth = {}, maxDepth = 0;

function normDate(d) {
  if (!d) return '';
  if (typeof d === 'string') return d;
  return d.y ? [d.y, d.m, d.d].filter(Boolean).join('/') : '';
}

function deriveLinks(obj) {
  Object.keys(obj).forEach(id => {
    const m = obj[id];
    m.id = m.id || id;
    m.birthDate = normDate(m.birthDate);
    m.deathDate = normDate(m.deathDate);
    m.parents = Array.isArray(m.parents) ? m.parents : [];
    m.spouses = Array.isArray(m.spouses) ? m.spouses : [];
    m.children = Array.isArray(m.children) ? m.children : [];
  });
  Object.keys(obj).forEach(id => {
    (obj[id].children || []).forEach(cid => {
      if (!obj[cid]) return;
      if (!obj[cid].parents.includes(id)) obj[cid].parents.push(id);
    });
  });
  Object.keys(obj).forEach(id => {
    (obj[id].spouses || []).forEach(sid => {
      if (obj[sid] && !obj[sid].spouses.includes(id)) obj[sid].spouses.push(id);
    });
  });
  return obj;
}

/* Depth is primarily parent-based. People with no recorded parents (spouses
   marrying in, cousins whose branch was never filled) are then placed by
   their spouse's generation, or one above their children's. Without this
   they all pile up in the first row and the generation view lies. */
function computeDepth() {
  const memo = {};
  function d(id, stack) {
    if (memo[id] !== undefined) return memo[id];
    if (stack.has(id)) return 0;
    stack.add(id);
    const ps = (M[id].parents || []).filter(p => M[p]);
    const v = ps.length ? 1 + Math.max(...ps.map(p => d(p, stack))) : 0;
    stack.delete(id);
    memo[id] = v;
    return v;
  }
  ids.forEach(id => d(id, new Set()));

  const hasParents = id => (M[id].parents || []).some(p => M[p]);
  for (let pass = 0; pass < 6; pass++) {
    let changed = false;
    ids.forEach(id => {
      if (hasParents(id)) return;
      const fromSpouse = (M[id].spouses || []).filter(x => M[x] && memo[x] !== undefined).map(x => memo[x]);
      if (fromSpouse.length) {
        const v = Math.min(...fromSpouse);
        if (memo[id] !== v) { memo[id] = v; changed = true; }
        return;
      }
      const kids = (M[id].children || []).filter(x => M[x] && memo[x] > 0).map(x => memo[x]);
      if (kids.length) {
        const v = Math.max(0, Math.min(...kids) - 1);
        if (memo[id] !== v) { memo[id] = v; changed = true; }
      }
    });
    if (!changed) break;
  }

  ids.forEach(id => depth[id] = memo[id]);
  maxDepth = ids.length ? Math.max(...Object.values(depth)) : 0;
}

function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(LS_TREE); } catch (e) {}
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      const obj = Array.isArray(parsed)
        ? Object.fromEntries(parsed.filter(Boolean).map(m => [m.id, m]))
        : parsed;
      if (obj && Object.keys(obj).length) {
        M = deriveLinks(obj);
        source = 'live';
      }
    } catch (e) { console.warn('bad tree json', e); }
  }
  if (source !== 'live') {
    M = deriveLinks(JSON.parse(JSON.stringify(DEMO)));
    source = 'demo';
  }
  ids = Object.keys(M);
  computeDepth();
  let f = null;
  try { f = localStorage.getItem(LS_FOCUS); } catch (e) {}
  focusId = (f && M[f]) ? f : (ids.find(id => (M[id].children || []).length) || ids[0] || null);
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial = n => (n || '؟').trim().charAt(0);
const yearOf = d => {
  if (!d) return 0;
  if (typeof d === 'string') { const y = parseInt(d.split('/')[0], 10); return isNaN(y) ? 0 : y; }
  return d.y || 0;
};
const jy = d => {
  if (!d) return '—';
  if (typeof d === 'string') { const p = d.split('/'); return p[0] ? p[0] : '—'; }
  return d.y ? String(d.y) : '—';
};
const jfull = d => {
  if (!d) return '—';
  if (typeof d === 'string') return d.split('/').join('/');
  return d.y ? [d.y, d.m, d.d].filter(Boolean).join('/') : '—';
};
const dateStr = d => {
  if (!d) return '';
  if (typeof d === 'string') return d;
  return d.y ? [d.y, d.m, d.d].filter(Boolean).join('/') : '';
};
const isDead = m => m.isAlive === false;
const lifeSpan = m => `${jy(m.birthDate)}${isDead(m) ? ' — ' + jy(m.deathDate) : ''}`;

function avatar(m, size) {
  const cls = ['av', m.gender === 'female' ? 'f' : '', isDead(m) ? 'dead' : ''].join(' ');
  const st = size ? ` style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.4)}px"` : '';
  if (m.photoData) return `<div class="${cls}"${st}><img src="${esc(m.photoData)}" alt=""></div>`;
  return `<div class="${cls}"${st}>${esc(initial(m.name))}</div>`;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2400);
}

function renderGen() {
  const host = document.getElementById('v-gen');
  if (!ids.length) { host.innerHTML = emptyState(); return; }
  const rows = [];
  for (let d = 0; d <= maxDepth; d++) {
    const people = ids.filter(id => depth[id] === d);
    if (!people.length) continue;
    const label = d === 0 ? 'ریشه' : d === maxDepth ? 'نوادگان' : `نسل ${d + 1}`;
    rows.push(`
      <div class="gen-row">
        <div class="gen-label">
          <div class="gen-num">${d + 1}</div>
          <div class="gen-name">${label}</div>
        </div>
        <div class="gen-track">
          ${people.map(id => {
            const m = M[id];
            return `<div class="chip ${id === focusId ? 'sel' : ''}" data-id="${esc(id)}">
              ${avatar(m)}
              <div class="nm">${esc(m.name)}</div>
              <div class="jb">${esc(m.job || '')}</div>
              <div class="yr">${lifeSpan(m)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      ${d < maxDepth ? '<div class="gen-sep"></div>' : ''}`);
  }
  host.innerHTML = `<div class="gen-wrap">${rows.join('')}</div>`;
  host.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => select(c.dataset.id)));
}

function buildTimeline(m) {
  const ev = [];
  if (yearOf(m.birthDate)) ev.push({ t: 'تولد', s: `${jfull(m.birthDate)} · ${m.birthplace || '—'}`, c: '' });
  (m.spouses || []).filter(x => M[x]).forEach(sid =>
    ev.push({ t: `ازدواج با ${M[sid].name}`, s: 'همسر', c: 'gold' }));
  (m.children || []).filter(x => M[x]).forEach(cid =>
    ev.push({ t: `تولد فرزند: ${M[cid].name}`, s: jy(M[cid].birthDate), c: 'muted' }));
  if (m.job) ev.push({ t: `شغل: ${m.job}`, s: 'حرفه', c: 'muted' });
  if (isDead(m)) ev.push({ t: 'فوت', s: `${jfull(m.deathDate)}${m.grave ? ' · ' + m.grave : ''}`, c: 'muted' });
  if (!ev.length) return '<div class="rel-empty">رویدادی ثبت نشده است.</div>';
  return ev.map(e => `
    <div class="tl-item">
      <div class="tl-dot ${e.c}"></div>
      <div class="tl-body">
        <div class="tl-ttl">${esc(e.t)}</div>
        <div class="tl-sub">${esc(e.s)}</div>
      </div>
    </div>`).join('');
}

  const base = Math.min(W, H);

  const ring1 = [...(m.parents || []), ...(m.spouses || [])].filter(x => M[x]);
  const ring2 = (m.children || []).filter(x => M[x]);
  const ring3 = ids.filter(id => id !== focusId && !ring1.includes(id) && !ring2.includes(id) &&
    depth[id] === depth[focusId]).slice(0, 8);
  const rings = [ring1, ring2, ring3];
  const radii = [base * 0.185, base * 0.315, base * 0.425];

  const pos = [];
  rings.forEach((ring, ri) => {
    const n = ring.length;
    ring.forEach((id, i) => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2 + (ri % 2 ? Math.PI / n : 0);
      pos.push({ id, x: cx + Math.cos(a) * radii[ri], y: cy + Math.sin(a) * radii[ri], ri });
    });
  });

  host.innerHTML = `
    <div class="radial">
      <div class="radial-top">
        <div class="crumb">مرکز: <b>${esc(m.name)}</b></div>
      </div>
      <svg>
        ${radii.map(r => `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}"/>`).join('')}
        ${pos.map(p => {
          const col = p.ri === 0 ? '#5B8FB9' : p.ri === 1 ? '#C9A227' : '#8A7BB5';
          return `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="${col}" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 4"/>`;
        }).join('')}
      </svg>
      <div class="node center" style="left:${cx}px;top:${cy}px">
        ${avatar(m)}
        <div class="lbl">${esc(m.name)}</div>
      </div>
      ${pos.map(p => `
        <div class="node" data-id="${esc(p.id)}" style="left:${p.x}px;top:${p.y}px">
          ${avatar(M[p.id])}
          <div class="lbl">${esc((M[p.id].name || '').split(' ')[0])}</div>
        </div>`).join('')}
      <div class="radial-legend">
        <span><i style="background:#3DDC97"></i>خود</span>
        <span><i style="background:#5B8FB9"></i>والد/همسر</span>
        <span><i style="background:#C9A227"></i>فرزند</span>
        <span><i style="background:#8A7BB5"></i>هم‌نسل</span>
      </div>
    </div>`;

  host.querySelectorAll('.node[data-id]').forEach(n =>
    n.addEventListener('click', () => select(n.dataset.id)));
}

/* ==================================================================
   VIEW 5 · TREE — paternal / maternal sides drawn separately
   ================================================================== */

/* All ancestors of a person, walking strictly upward. Used to decide which
   side of the family somebody belongs to and how they are related. */
function ancestorSet(id, maxUp = 8) {
  const out = new Set();
  let frontier = [id];
  for (let d = 0; d < maxUp && frontier.length; d++) {
    const next = [];
    frontier.forEach(n => {
      const m = M[n];
      if (!m) return;
      (m.parents || []).forEach(pa => {
        if (M[pa] && !out.has(pa)) { out.add(pa); next.push(pa); }
      });
    });
    frontier = next;
  }
  return out;
}

/* Which side: 'p' paternal, 'm' maternal, 'self' the root itself.
   A person belongs to a side when any of their ancestors is an ancestor
   (or the parent) of the root on that side. Spouses marrying in and
   descendants with no recorded parents inherit the side of their
   spouse or child — otherwise they all collapse into one panel. */
function sideOf(id, root, seen) {
  if (id === root) return 'self';
  if (!M[id] || !M[root]) return 'p';
  seen = seen || new Set();
  if (seen.has(id)) return 'p';
  seen.add(id);

  const R = M[root];
  const father = (R.parents || []).find(x => M[x] && M[x].gender !== 'female');
  const mother = (R.parents || []).find(x => M[x] && M[x].gender === 'female');

  if (id === father) return 'p';
  if (id === mother) return 'm';

  const pSide = new Set(), mSide = new Set();
  if (father) { pSide.add(father); ancestorSet(father).forEach(x => pSide.add(x)); }
  if (mother) { mSide.add(mother); ancestorSet(mother).forEach(x => mSide.add(x)); }

  const anc = ancestorSet(id);
  let inP = false, inM = false;
  anc.forEach(a => {
    if (pSide.has(a)) inP = true;
    if (mSide.has(a)) inM = true;
  });
  if (inP && !inM) return 'p';
  if (inM && !inP) return 'm';
  if (inP && inM) return 'p';

  /* no ancestors at all → borrow the side from the spouse, then the children */
  for (const sid of (M[id].spouses || [])) {
    if (M[sid] && sid !== root) {
      const sd = sideOf(sid, root, seen);
      if (sd === 'p' || sd === 'm') return sd;
    }
  }
  for (const cid of (M[id].children || [])) {
    if (M[cid] && cid !== root) {
      const sd = sideOf(cid, root, seen);
      if (sd === 'p' || sd === 'm') return sd;
    }
  }
  return 'p';
}

/* Persian kinship term from the root's point of view.
   Two passes, and the order matters: blood relations are resolved first,
   marriage-in relations only after. Someone can be both — e.g. a man who
   is the mother's brother AND married the father's sister is a دایی, not
   a «شوهرِ عمه». */
function kinshipOf(id, root) {
  if (id === root) return 'خودِ شما';
  const R = M[root], m = M[id];
  if (!m || !R) return '';

  const male = m.gender !== 'female';
  const rParents = (R.parents || []).filter(x => M[x]);
  const rChildren = (R.children || []).filter(x => M[x]);
  const father = rParents.find(x => M[x].gender !== 'female');
  const mother = rParents.find(x => M[x].gender === 'female');

  const parentsOf = x => (M[x] && M[x].parents || []).filter(y => M[y]);
  const kidsOf = x => (M[x] && M[x].children || []).filter(y => M[y]);
  const spousesOf = x => (M[x] && M[x].spouses || []).filter(y => M[y]);
  const shareParent = (a, b) => parentsOf(a).some(x => parentsOf(b).includes(x));

  /* ---------- 1. blood ---------- */
  if (rParents.includes(id)) return male ? 'پدر' : 'مادر';
  if (rChildren.includes(id)) return male ? 'پسر' : 'دختر';
  if ((R.spouses || []).includes(id)) return 'همسر';

  const rSibs = ids.filter(x => x !== root && M[x] && shareParent(x, root));
  if (rSibs.includes(id)) {
    const ay = yearOf(m.birthDate), ry = yearOf(R.birthDate);
    const older = ay && ry ? ay < ry : true;
    if (male) return older ? 'برادر بزرگ‌تر' : 'برادر کوچک‌تر';
    return older ? 'خواهر بزرگ‌تر' : 'خواهر کوچک‌تر';
  }

  /* uncles / aunts — blood siblings of either parent */
  for (const [par, isPaternal] of [[father, true], [mother, false]]) {
    if (!par) continue;
    const parSibs = ids.filter(x => x !== par && M[x] && shareParent(x, par));
    if (parSibs.includes(id)) {
      if (isPaternal) return male ? 'عمو' : 'عمه';
      return male ? 'دایی' : 'خاله';
    }
  }

  /* children of the root's siblings → nephews / nieces */
  for (const sib of rSibs) {
    if (kidsOf(sib).includes(id)) {
      const sibMale = M[sib].gender !== 'female';
      if (male) return sibMale ? 'برادرزاده' : 'خواهرزاده';
      return sibMale ? 'برادرزاده (دختر)' : 'خواهرزاده (دختر)';
    }
  }

  /* cousins */
  for (const [par, isPaternal] of [[father, true], [mother, false]]) {
    if (!par) continue;
    const parSibs = ids.filter(x => x !== par && M[x] && shareParent(x, par));
    const cousins = parSibs.flatMap(x => kidsOf(x));
    if (cousins.includes(id)) {
      if (isPaternal) return male ? 'پسرعمو' : 'دخترعمو';
      return male ? 'پسردایی' : 'دختردایی';
    }
    const cousins2 = cousins.flatMap(x => kidsOf(x));
    if (cousins2.includes(id)) {
      if (isPaternal) return male ? 'پسرعموزاده' : 'دخترعموزاده';
      return male ? 'پسردایی‌زاده' : 'دختردایی‌زاده';
    }
  }

  /* grandchildren and further */
  const gk = rChildren.flatMap(x => kidsOf(x));
  if (gk.includes(id)) return male ? 'نوه (پسرِ فرزند)' : 'نوه (دخترِ فرزند)';
  if (gk.flatMap(x => kidsOf(x)).includes(id)) return 'نتیجه';

  /* grandparents */
  const gp = rParents.flatMap(x => parentsOf(x));
  if (gp.includes(id)) return male ? 'پدربزرگ' : 'مادربزرگ';

  /* ---------- 2. marriage-in ---------- */
  for (const sib of rSibs) {
    if (spousesOf(sib).includes(id)) return M[sib].gender !== 'female' ? 'زنِ برادر' : 'شوهرِ خواهر';
  }
  for (const [par, isPaternal] of [[father, true], [mother, false]]) {
    if (!par) continue;
    const parSibs = ids.filter(x => x !== par && M[x] && shareParent(x, par));
    for (const sib of parSibs) {
      if (spousesOf(sib).includes(id)) {
        const sibMale = M[sib].gender !== 'female';
        if (isPaternal) return sibMale ? 'زنِ عمو' : 'شوهرِ عمه';
        return sibMale ? 'زنِ دایی' : 'شوهرِ خاله';
      }
    }
    const cousins = parSibs.flatMap(x => kidsOf(x));
    for (const cu of cousins) {
      if (spousesOf(cu).includes(id)) {
        const cuMale = M[cu].gender !== 'female';
        if (isPaternal) return cuMale ? 'زنِ پسرعمو' : 'شوهرِ دخترعمو';
        return cuMale ? 'زنِ پسردایی' : 'شوهرِ دختردایی';
      }
    }
  }
  for (const ch of rChildren) {
    if (spousesOf(ch).includes(id)) return M[ch].gender !== 'female' ? 'زنِ پسر' : 'شوهرِ دختر';
  }

  /* ---------- 3. fallback by generation gap ---------- */
  const dd = (depth[id] || 0) - (depth[root] || 0);
  const t = sideOf(id, root) === 'm' ? 'مادری' : 'پدری';
  if (dd <= -2) return 'جد ' + t;
  if (dd === -1) return 'والدِ ' + t;
  if (dd === 1) return 'فرزندِ ' + t;
  if (dd >= 2) return 'نوهٔ ' + t;
  return 'خویشاوند ' + t;
}

let treeSide = 'both';

function renderTree() {
  const host = document.getElementById('v-tree');
  if (!ids.length) { host.innerHTML = emptyState(); return; }
  const root = focusId && M[focusId] ? focusId : ids[0];
  const R = M[root];

  const father = (R.parents || []).find(p => M[p] && M[p].gender !== 'female');
  const mother = (R.parents || []).find(p => M[p] && M[p].gender === 'female');

  /* --- partition: each person goes to exactly one side --- */
  const groups = { p: [], m: [] };
  ids.forEach(id => {
    if (id === root) return;
    const sd = sideOf(id, root);
    if (sd === 'm') groups.m.push(id);
    else groups.p.push(id);
  });

  const sidesToShow = treeSide === 'both' ? ['p', 'm'] : [treeSide];

  /* --- geometry ---
     Rows are ordered by generation relative to the root:
       -2 grandparent · -1 parent · 0 root generation · +1 children · +2 grandchildren
     The root is drawn on its own row in the middle column, so nothing
     overlaps it. */
  const COL = 96, ROW = 100, PAD = 16, HEAD_H = 42;
  const rowKeys = [-2, -1, 0, 1, 2];
  const rootRow = 2;   /* index of the root's own generation row */

  const panels = sidesToShow.map(side => {
    const anchorId = side === 'p' ? father : mother;
    const baseDepth = anchorId ? depth[anchorId] : depth[root];
    const rows = {};
    (groups[side] || []).forEach(id => {
      const rel = (depth[id] || 0) - (depth[root] || 0);
      const k = Math.max(-2, Math.min(2, rel));
      (rows[k] = rows[k] || []).push(id);
    });
    const cols = Math.max(1, ...rowKeys.map(k => (rows[k] || []).length));
    return { side, anchorId, baseDepth, rows, cols, width: cols * COL };
  });

  /* a wide gap keeps room for the root between the two families */
  const GAP = panels.length > 1 ? COL * 1.5 : 36;
  const panelsW = panels.reduce((a, x) => a + x.width, 0) + GAP * Math.max(0, panels.length - 1);
  const canvasW = Math.max(panelsW + PAD * 2, 330);
  /* height covers only the rows that actually hold somebody */
  const usedRows = Math.max(
    rootRow,
    ...panels.map(x => Math.max(-1, ...rowKeys.map((k, i) => (x.rows[k] || []).length ? i : -1)))
  );
  const canvasH = HEAD_H + 26 + usedRows * ROW + 96;

  host.innerHTML = `
    <div class="tree-wrap">
      <div class="tree-head">
        <div class="tree-toggle">
          <button data-s="both" class="${treeSide === 'both' ? 'on' : ''}">هر دو سمت</button>
          <button data-s="p" class="${treeSide === 'p' ? 'on' : ''}">فقط پدری</button>
          <button data-s="m" class="${treeSide === 'm' ? 'on' : ''}">فقط مادری</button>
        </div>
      </div>
      <div class="tree-scroll">
        <div class="tree-canvas" id="treeCanvas" style="width:${canvasW}px;height:${canvasH}px">
          <svg id="treeSvg" width="${canvasW}" height="${canvasH}"></svg>
        </div>
      </div>
      <div class="tree-legend">
        <span><i style="background:#3DDC97"></i>خودِ شما</span>
        <span><i style="background:#7BE8B6"></i>خانوادهٔ پدر</span>
        <span><i style="background:#F2A8D0"></i>خانوادهٔ مادر</span>
        <span><i style="background:#C9A227"></i>ازدواج بین دو خانواده</span>
      </div>
      <div id="treeNotes"></div>
    </div>`;

  const canvas = document.getElementById('treeCanvas');
  const svg = document.getElementById('treeSvg');
  const pos = {};
  const rowY = i => HEAD_H + 26 + i * ROW;

  let cursor = PAD;
  panels.forEach(panel => {
    const cx = cursor + panel.width / 2;

    const badge = document.createElement('div');
    badge.className = 'side-badge ' + panel.side;
    badge.textContent = panel.side === 'p' ? '👨 خانوادهٔ پدر' : '👩 خانوادهٔ مادر';
    badge.style.left = cx + 'px';
    badge.style.transform = 'translateX(-50%)';
    badge.style.top = '4px';
    canvas.appendChild(badge);

    rowKeys.forEach((k, ri) => {
      const arr = panel.rows[k] || [];
      if (!arr.length) return;
      const y = rowY(ri);
      const rowW = arr.length * COL;
      const x0 = cx - rowW / 2 + COL / 2;
      arr.forEach((id, i) => {
        pos[id] = { x: x0 + i * COL, y, side: panel.side };
      });
    });

    cursor += panel.width + GAP;
  });

  /* the root sits on its own generation row, in the gap between the two
     families when both are shown — so it can never sit on top of a node */
  let rootX;
  if (panels.length > 1) {
    rootX = PAD + panels[0].width + GAP / 2;
  } else {
    rootX = canvasW / 2;
  }
  const rootY = rowY(rootRow);
  pos[root] = { x: rootX, y: rootY, side: 'self' };

  /* --- edges --- */
  let svgHtml = '';
  Object.keys(pos).forEach(id => {
    const a = pos[id], p = M[id];
    if (!p) return;
    (p.parents || []).forEach(pid => {
      const b = pos[pid];
      if (!b) return;
      const col = a.side === 'm' ? '#F2A8D0' : a.side === 'p' ? '#7BE8B6' : '#3DDC97';
      const y1 = b.y + 30, y2 = a.y - 30;
      const midY = (y1 + y2) / 2;
      svgHtml += `<path d="M${b.x},${y1} L${b.x},${midY} L${a.x},${midY} L${a.x},${y2}"
        fill="none" stroke="${col}" stroke-opacity=".4" stroke-width="1.4"/>`;
    });
  });
  const drawn = new Set();
  Object.keys(pos).forEach(id => {
    const p = M[id];
    if (!p) return;
    (p.spouses || []).forEach(sid => {
      const a = pos[id], b = pos[sid];
      if (!a || !b) return;
      const key = [id, sid].sort().join('|');
      if (drawn.has(key)) return;
      drawn.add(key);
      const cross = a.side !== b.side && a.side !== 'self' && b.side !== 'self';
      const col = cross ? '#C9A227' : '#4E6B5E';
      svgHtml += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
        stroke="${col}" stroke-opacity="${cross ? '.95' : '.4'}"
        stroke-width="${cross ? 2.2 : 1.2}" stroke-dasharray="5 4"/>`;
    });
  });
  svg.innerHTML = svgHtml;

  /* --- nodes --- */
  Object.keys(pos).forEach(id => {
    const m = M[id], q = pos[id];
    if (!m) return;
    const isRoot = id === root;
    const el = document.createElement('div');
    el.className = 'tnode' + (isRoot ? ' root focus' : '');
    el.style.left = q.x + 'px';
    el.style.top = (q.y - 24) + 'px';
    el.innerHTML = `${avatar(m)}
      <div class="tnm">${esc(m.name)}</div>
      <div class="tjb">${isRoot ? 'خودِ شما' : esc(kinshipOf(id, root))}</div>`;
    el.addEventListener('click', () => select(id));
    canvas.appendChild(el);
  });

  /* --- cross-side marriage report --- */
  const bridges = [];
  const seenPair = new Set();
  Object.keys(M).forEach(id => {
    (M[id].spouses || []).forEach(sid => {
      if (!M[sid]) return;
      const key = [id, sid].sort().join('|');
      if (seenPair.has(key)) return;
      seenPair.add(key);
      const s1 = sideOf(id, root), s2 = sideOf(sid, root);
      if (s1 !== s2 && s1 !== 'self' && s2 !== 'self') {
        bridges.push(`${M[id].name} (${kinshipOf(id, root)}) 💍 ${M[sid].name} (${kinshipOf(sid, root)})`);
      }
    });
  });
  const notes = document.getElementById('treeNotes');
  if (bridges.length) {
    notes.innerHTML = `<div class="marriage-note">
      <b>💍 ${bridges.length} ازدواج بین دو سمت خانواده</b><br>
      ${bridges.map(b => '• ' + esc(b)).join('<br>')}
    </div>`;
  }

  host.querySelectorAll('.tree-toggle button').forEach(b =>
    b.addEventListener('click', () => { treeSide = b.dataset.s; renderTree(); }));
}
function emptyState() {
  return `<div class="nodata">
    <div class="big">🌱</div>
    <h3>هنوز عضوی ثبت نشده</h3>
    <p>در اپ اصلی شجره‌نامه چند نفر اضافه کنید، سپس این صفحه را باز کنید تا داده‌های واقعی خودتان را ببینید.</p>
    <button id="useDemo">نمایش با دادهٔ نمونه</button>
  </div>`;
}

function updateChip() {
  const c = document.getElementById('dataChip');
  if (source === 'live') {
    c.className = 'data-chip live';
    c.textContent = `دادهٔ شما · ${ids.length} نفر`;
    c.title = 'داده از حافظهٔ همین مرورگر خوانده شد';
  } else {
    c.className = 'data-chip demo';
    c.textContent = 'دادهٔ نمونه';
    c.title = 'کلیک برای بررسی راهنما';
  }
}

document.getElementById('dataChip').addEventListener('click', () => {
  if (source === 'live') toast(`✅ ${ids.length} نفر از حافظهٔ مرورگر خوانده شد`);
  else toast('ℹ️ دادهٔ نمونه. در اپ اصلی عضو اضافه کنید تا اینجا بیاید.');
});

document.querySelectorAll('#seg button').forEach(b =>
  b.addEventListener('click', () => go(b.dataset.v)));

window.addEventListener('resize', () => {
  if (cur === 'radial') renderRadial();
  if (cur === 'tree') renderTree();
});

document.addEventListener('click', e => {
  if (e.target && e.target.id === 'useDemo') {
    M = deriveLinks(JSON.parse(JSON.stringify(DEMO)));
    ids = Object.keys(M);
    computeDepth();
    focusId = ids.find(id => (M[id].children || []).length) || ids[0];
    source = 'demo';
    updateChip();
    go(cur);
  }
});


/* ==================================================================
   WRITE LAYER — safe save with automatic backup
   ================================================================== */
const LS_BACKUP = 'emarat_family_lab_backup';

/* the working copy edits are applied to: real storage when live, the
   in-memory demo set otherwise (so demo edits never silently drop people) */
function currentTree() {
  if (source === 'demo') {
    const copy = {};
    Object.keys(M).forEach(id => {
      copy[id] = JSON.parse(JSON.stringify(M[id]));
      copy[id].id = id;
    });
    return copy;
  }
  try {
    const raw = localStorage.getItem(LS_TREE);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed)
      ? Object.fromEntries(parsed.filter(Boolean).map(m => [m.id, m]))
      : parsed;
  } catch (e) { return {}; }
}

function readRawTree() { return currentTree(); }

/* snapshot before every write so nothing is ever lost */
function snapshot(label) {
  try {
    const raw = localStorage.getItem(LS_TREE) || '';
    if (!raw) return;
    const rec = { at: new Date().toISOString(), label, bytes: raw.length, data: raw };
    let list = [];
    try { list = JSON.parse(localStorage.getItem(LS_BACKUP) || '[]'); } catch (e) { list = []; }
    list.unshift(rec);
    localStorage.setItem(LS_BACKUP, JSON.stringify(list.slice(0, 8)));
  } catch (e) { console.warn('snapshot failed', e); }
}

function persistTree(obj) {
  if (source === 'demo') {
    M = obj;
    ids = Object.keys(M);
    computeDepth();
    return;
  }
  snapshot('auto');
  localStorage.setItem(LS_TREE, JSON.stringify(obj));
  if (window.EmaratCloudSync && typeof window.EmaratCloudSync.push === 'function') {
    try { window.EmaratCloudSync.push(); } catch (e) {}
  }
}

function nextId() {
  return 'mem_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
}

/* ==================================================================
   EDITOR
   ================================================================== */
let editingId = null;
let formPhoto = '';

function nameOptions(excludeId) {
  return ids.filter(id => id !== excludeId)
    .sort((a, b) => (M[a].name || '').localeCompare(M[b].name || '', 'fa'))
    .map(id => `<option value="${esc(id)}">${esc(M[id].name)}</option>`).join('');
}

function relEditor(kind, label, list, excludeId) {
  return `
    <div class="sec-title">${label}</div>
    <div class="rel-edit" id="relEdit-${kind}">
      ${list.length ? list.map(id => `
        <span class="rel-tag">${esc(M[id].name)}
          <button data-rel="${kind}" data-id="${esc(id)}" title="حذف">✕</button>
        </span>`).join('') : '<span style="font-size:10.5px;color:var(--text3)">هیچ‌کس ثبت نشده</span>'}
    </div>
    <div class="rel-add">
      <select id="relSel-${kind}"><option value="">— انتخاب کنید —</option>${nameOptions(excludeId)}</select>
      <button data-addrel="${kind}">افزودن</button>
    </div>`;
}

function openEditor(id) {
  editingId = id || null;
  const m = id ? M[id] : null;
  formPhoto = m ? (m.photoData || '') : '';

  const draft = m || {
    name: '', gender: 'male', job: '', relation: '', birthplace: '',
    isAlive: true, birthDate: '', deathDate: '', location: '', grave: '',
    isMarried: false, bio: ''
  };
  const isDeadNow = draft.isAlive === false;

  document.getElementById('edTitle').textContent = id ? 'ویرایش عضو' : 'افزودن عضو جدید';

  document.getElementById('edBody').innerHTML = `
    <div class="fld">
      <label>نام و نام خانوادگی *</label>
      <input id="f-name" value="${esc(draft.name)}" placeholder="مثلاً علی رضایی">
    </div>

    <div class="fld-row">
      <div class="fld">
        <label>جنسیت</label>
        <div class="seg2" id="f-gender">
          <button data-g="male" class="${draft.gender !== 'female' ? 'on' : ''}">مرد</button>
          <button data-g="female" class="${draft.gender === 'female' ? 'on' : ''}">زن</button>
        </div>
      </div>
      <div class="fld">
        <label>وضعیت</label>
        <div class="seg2" id="f-alive">
          <button data-a="1" class="${!isDeadNow ? 'on' : ''}">زنده</button>
          <button data-a="0" class="${isDeadNow ? 'on' : ''}">مرحوم</button>
        </div>
      </div>
    </div>

    <div class="fld-row">
      <div class="fld"><label>شغل</label><input id="f-job" value="${esc(draft.job || '')}" placeholder="کشاورز"></div>
      <div class="fld"><label>نسبت</label><input id="f-relation" value="${esc(draft.relation || '')}" placeholder="پدر"></div>
    </div>

    <div class="fld">
      <label>زادگاه</label>
      <input id="f-birthplace" value="${esc(draft.birthplace || '')}" placeholder="گلبهار">
    </div>

    <div class="fld">
      <label>تاریخ تولد (شمسی) — سال/ماه/روز</label>
      <input id="f-birth" value="${esc(dateStr(draft.birthDate))}" placeholder="1352/2/18" inputmode="numeric">
    </div>

    <div id="deathWrap" style="display:${isDeadNow ? 'block' : 'none'}">
      <div class="fld">
        <label>تاریخ فوت (شمسی)</label>
        <input id="f-death" value="${esc(dateStr(draft.deathDate))}" placeholder="1400/5/2" inputmode="numeric">
      </div>
      <div class="fld">
        <label>آرامگاه</label>
        <input id="f-grave" value="${esc(draft.grave || '')}" placeholder="گلبهار">
      </div>
    </div>

    <div id="locWrap" style="display:${isDeadNow ? 'none' : 'block'}">
      <div class="fld">
        <label>محل سکونت</label>
        <input id="f-location" value="${esc(draft.location || '')}" placeholder="مشهد">
      </div>
    </div>

    <div class="fld">
      <label>زندگی‌نامه / یادداشت</label>
      <textarea id="f-bio" placeholder="هرچه می‌خواهید دربارهٔ این نفر بماند…">${esc(draft.bio || '')}</textarea>
    </div>

    <div class="sec-title">عکس</div>
    <label class="photo-pick">
      <span id="f-photo-preview">${formPhoto ? `<div class="av"><img src="${esc(formPhoto)}" alt=""></div>` : avatar(draft)}</span>
      <div>
        <b>${formPhoto ? 'تغییر عکس' : 'انتخاب عکس'}</b>
        <small>اختیاری · روی گوشی از گالری</small>
      </div>
      <input type="file" id="f-photo" accept="image/*" style="display:none">
    </label>
    ${formPhoto ? '<button class="del-btn" id="f-photo-del" style="margin-top:7px;font-size:11px;padding:8px">حذف عکس</button>' : ''}

    ${id ? `
      <div class="sec-title">خویشاوندان</div>
      ${relEditor('parents', 'والدین', (m.parents || []).filter(x => M[x]), id)}
      ${relEditor('spouses', 'همسر', (m.spouses || []).filter(x => M[x]), id)}
      ${relEditor('children', 'فرزندان', (m.children || []).filter(x => M[x]), id)}
    ` : '<div class="save-hint">پس از ذخیره می‌توانید والدین، همسر و فرزندان را اضافه کنید.</div>'}

    ${id ? `
      <div class="danger-zone">
        <button class="del-btn" id="f-del">🗑️ حذف این عضو</button>
      </div>` : ''}

    <div class="save-hint">
      پیش از هر ذخیره، یک نسخهٔ پشتیبان خودکار در همین مرورگر نگه داشته می‌شود.
    </div>`;

  /* --- gender / alive toggles --- */
  let gender = draft.gender === 'female' ? 'female' : 'male';
  document.querySelectorAll('#f-gender button').forEach(b => b.onclick = () => {
    gender = b.dataset.g;
    document.querySelectorAll('#f-gender button').forEach(x => x.classList.toggle('on', x === b));
  });

  let alive = !isDeadNow;
  document.querySelectorAll('#f-alive button').forEach(b => b.onclick = () => {
    alive = b.dataset.a === '1';
    document.querySelectorAll('#f-alive button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('deathWrap').style.display = alive ? 'none' : 'block';
    document.getElementById('locWrap').style.display = alive ? 'block' : 'none';
  });

  /* --- photo --- */
  const photoInput = document.getElementById('f-photo');
  photoInput.onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 2.5 * 1024 * 1024) { toast('⚠️ عکس بزرگ‌تر از ۲.۵ مگابایت است'); e.target.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      formPhoto = r.result;
      document.getElementById('f-photo-preview').innerHTML = `<div class="av"><img src="${formPhoto}" alt=""></div>`;
      toast('✅ عکس انتخاب شد');
    };
    r.readAsDataURL(f);
  };
  const pd = document.getElementById('f-photo-del');
  if (pd) pd.onclick = () => {
    formPhoto = '';
    document.getElementById('f-photo-preview').innerHTML = avatar(draft);
    toast('عکس حذف شد (با ذخیره اعمال می‌شود)');
  };

  /* --- relation add/remove --- */
  document.querySelectorAll('[data-addrel]').forEach(btn => btn.onclick = () => {
    const kind = btn.dataset.addrel;
    const sel = document.getElementById('relSel-' + kind);
    const target = sel.value;
    if (!target) { toast('یک نفر را انتخاب کنید'); return; }
    if (kind === 'spouses') { m.spouses = m.spouses || []; if (!m.spouses.includes(target)) m.spouses.push(target); M[target].spouses = M[target].spouses || []; if (!M[target].spouses.includes(id)) M[target].spouses.push(id); }
    if (kind === 'children') { m.children = m.children || []; if (!m.children.includes(target)) m.children.push(target); M[target].parents = M[target].parents || []; if (!M[target].parents.includes(id)) M[target].parents.push(id); }
    if (kind === 'parents') { m.parents = m.parents || []; if (!m.parents.includes(target)) m.parents.push(target); M[target].children = M[target].children || []; if (!M[target].children.includes(id)) M[target].children.push(id); }
    persistTree(M);
    openEditor(id);
    toast('✅ اضافه شد');
  });
  document.querySelectorAll('[data-rel]').forEach(btn => btn.onclick = () => {
    const kind = btn.dataset.rel, target = btn.dataset.id;
    if (kind === 'spouses') { m.spouses = (m.spouses || []).filter(x => x !== target); M[target].spouses = (M[target].spouses || []).filter(x => x !== id); }
    if (kind === 'children') { m.children = (m.children || []).filter(x => x !== target); M[target].parents = (M[target].parents || []).filter(x => x !== id); }
    if (kind === 'parents') { m.parents = (m.parents || []).filter(x => x !== target); M[target].children = (M[target].children || []).filter(x => x !== id); }
    persistTree(M);
    openEditor(id);
    toast('حذف شد');
  });

  /* --- delete member (two-step) --- */
  const delBtn = document.getElementById('f-del');
  if (delBtn) {
    let armed = false;
    delBtn.onclick = () => {
      if (!armed) {
        armed = true;
        delBtn.classList.add('armed');
        delBtn.textContent = '⚠️ مطمئنی؟ دوباره بزن';
        setTimeout(() => {
          if (!armed) return;
          armed = false;
          delBtn.classList.remove('armed');
          delBtn.textContent = '🗑️ حذف این عضو';
        }, 4000);
        return;
      }
      const raw = readRawTree();
      delete raw[id];
      Object.values(raw).forEach(x => {
        ['parents', 'spouses', 'children'].forEach(k => {
          if (Array.isArray(x[k])) x[k] = x[k].filter(y => y !== id);
        });
      });
      persistTree(raw);
      closeEditor();
      if (source !== 'demo') loadData();
      else { ids = Object.keys(M); computeDepth(); }
      focusId = ids[0] || null;
      go(cur);
      toast('🗑️ عضو حذف شد');
    };
  }

  document.getElementById('edScrim').classList.add('on');
  document.getElementById('ed').classList.add('on');
  document.getElementById('edBody').scrollTop = 0;
}

function closeEditor() {
  document.getElementById('edScrim').classList.remove('on');
  document.getElementById('ed').classList.remove('on');
  editingId = null;
}

function saveEditor() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('⚠️ نام را وارد کنید'); document.getElementById('f-name').focus(); return; }

  const gender = document.querySelector('#f-gender button.on').dataset.g;
  const alive = document.querySelector('#f-alive button.on').dataset.a === '1';
  const birthDate = document.getElementById('f-birth').value.trim();
  const deathDate = alive ? '' : (document.getElementById('f-death') || {}).value?.trim() || '';
  const grave = alive ? '' : (document.getElementById('f-grave') || {}).value?.trim() || '';
  const location = alive ? (document.getElementById('f-location') || {}).value?.trim() || '' : '';

  const raw = readRawTree();

  if (editingId && raw[editingId]) {
    const m = raw[editingId];
    Object.assign(m, {
      name, gender, isAlive: alive, birthDate, deathDate, grave, location,
      job: document.getElementById('f-job').value.trim(),
      relation: document.getElementById('f-relation').value.trim(),
      birthplace: document.getElementById('f-birthplace').value.trim(),
      bio: document.getElementById('f-bio').value.trim(),
      hasPhoto: !!formPhoto, photoData: formPhoto
    });
  } else {
    const nid = nextId();
    raw[nid] = {
      id: nid, name, gender, hasPhoto: !!formPhoto, photoData: formPhoto,
      job: document.getElementById('f-job').value.trim(),
      relation: document.getElementById('f-relation').value.trim(),
      birthplace: document.getElementById('f-birthplace').value.trim(),
      isAlive: alive, birthDate, deathDate, location, grave,
      isMarried: false, spousesCount: 1, childrenCount: 0,
      bio: document.getElementById('f-bio').value.trim(),
      parents: [], spouses: [], children: [],
      maternalGrandparents: [], paternalGrandparents: []
    };
    editingId = nid;
  }

  const keepFocus = editingId;
  persistTree(raw);
  closeEditor();
  if (source !== 'demo') loadData();
  else { ids = Object.keys(M); computeDepth(); }
  focusId = keepFocus && M[keepFocus] ? keepFocus : (ids[0] || null);
  go(cur);
  toast('✅ ذخیره شد');
}

document.getElementById('fabAdd').onclick = () => openEditor(null);
document.getElementById('edClose').onclick = closeEditor;
document.getElementById('edScrim').onclick = closeEditor;
document.getElementById('edSave').onclick = saveEditor;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditor(); });

loadData();
updateChip();
const startView = (location.hash || '').replace('#', '');
go(['gen', 'deck', 'table', 'radial', 'tree'].includes(startView) ? startView : 'gen');
</script>
<script src="../usage-tracker.js" data-app="family-lab"></script>
<script src="../refresh-button.js"></script>
</body>
</html>
