<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ثبت درصد</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #16203a;
    --card-hover: #1d2a4a;
    --line: #26344f;
    --text: #e8eefc;
    --muted: #93a4c4;
    --atie: #3b82f6;
    --synergy: #06b6d4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, #0b1220 0%, #16233d 100%);
    color: var(--text);
    font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin: 0 0 6px;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }
  .fund {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 20px 18px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    text-align: right;
    cursor: pointer;
    transition: background .18s, transform .12s, border-color .18s;
  }
  .fund:active { transform: scale(.98); }
  .fund:hover { background: var(--card-hover); }
  .fund .icon {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    font-size: 22px;
  }
  .fund.atie .icon { background: rgba(59,130,246,.16); }
  .fund.synergy .icon { background: rgba(6,182,212,.16); }
  .fund .meta { flex: 1; }
  .fund .name { display: block; }
  .fund .hint { display: block; font-weight: normal; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .fund .arrow { color: var(--muted); font-size: 18px; }
  .fund.atie { border-color: rgba(59,130,246,.4); }
  .fund.synergy { border-color: rgba(6,182,212,.4); }
</style>
</head>
<body>
  <h1>📊 ثبت درصد</h1>
  <p class="sub">صندوق مورد نظر را انتخاب کن</p>

  <button class="fund atie" onclick="openFund('gold4')">
    <span class="icon">🏦</span>
    <span class="meta">
      <span class="name">آتیه مفید (۴)</span>
      <span class="hint">صندوق بازنشستگی</span>
    </span>
    <span class="arrow">‹</span>
  </button>

  <button class="fund synergy" onclick="openFund('gold5')">
    <span class="icon">🏦</span>
    <span class="meta">
      <span class="name">سینرژی (۵)</span>
      <span class="hint">صندوق سینرژی</span>
    </span>
    <span class="arrow">‹</span>
  </button>

  <script>
    function openFund(dir) {
      location.href = dir + '/index.html';
    }
  </script>
</body>
</html>
