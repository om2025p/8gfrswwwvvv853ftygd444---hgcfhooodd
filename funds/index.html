<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WWW.com - وب‌سایت صندوق‌ها</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="../cloud-sync.js"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-dark: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(56, 189, 248, 0.25);
            --text-light: #f8fafc;
            --accent-cyan: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
        }

        /* هدر فوقانی با تب‌ها */
        .app-header {
            background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
            padding: 10px 12px 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        /* تب‌های دسته‌بندی سطح ۱ */
        .categories-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none; /* Firefox */
        }

        .categories-nav::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .cat-btn:active {
            transform: scale(0.96);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        }

        /* زیر-تب‌های وب‌سایت‌های دسته فعال سطح ۲ */
        .subtabs-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .subtabs-container::-webkit-scrollbar {
            display: none;
        }

        .site-tab-btn {
            flex: 1;
            min-width: 90px;
            padding: 8px 10px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: 700;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .site-tab-btn.active {
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.4);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .empty-cat-msg {
            font-size: 0.8rem;
            color: #94a3b8;
            padding: 6px 12px;
            width: 100%;
            text-align: center;
        }

        /* استایل مودال مدیریت */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            padding: 16px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.05rem;
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 3px;
            gap: 4px;
        }

        .modal-tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.82rem;
            color: #38bdf8;
            font-weight: 700;
        }

        .form-input, .form-select {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-select:focus {
            border-color: #38bdf8;
        }

        .form-submit-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s ease;
        }

        .form-submit-btn:active {
            transform: scale(0.98);
        }

        .manage-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .manage-item {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .manage-item-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .manage-item-actions {
            display: flex;
            gap: 6px;
        }

        .icon-action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 5px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .icon-action-btn.delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* محفظه اصلی وب‌ویوها */
        .webview-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
        }

        .webview-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .webview-wrapper.active {
            display: block;
        }

        .webview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* کارت جایگزین باز کردن مستقیم وب‌سایت */
        .fallback-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 24px;
            text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            gap: 16px;
        }

        .fallback-icon {
            font-size: 3.5rem;
            margin-bottom: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }

        .fallback-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
        }

        .fallback-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            max-width: 340px;
            line-height: 1.6;
        }

        .fallback-launch-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .fallback-launch-btn:active {
            transform: scale(0.96);
        }

        /* لودر و اسپینر */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 50;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

    </style>
</head>
<body>

    <!-- هدر بالای صفحه با دکمه‌های تب و ابزارها -->
    <header class="app-header">
        <div class="header-top">
            <div class="brand-title">
                <img src="icon-192.png" alt="WWW.com" class="brand-icon">
                <span>WWW.com</span>
            </div>
            <div class="header-actions">
                <button class="action-btn" id="manageBtn" title="مدیریت وب‌سایت‌ها و دسته‌ها">
                    ➕ مدیریت
                </button>
                <button class="action-btn" id="refreshBtn" title="بروزرسانی">
                    🔄
                </button>
                <button class="action-btn" id="openExternalBtn" title="باز کردن در مرورگر">
                    🌐 مرورگر
                </button>
            </div>
        </div>

        <!-- سطح ۱: تب‌های دسته‌ها -->
        <nav class="categories-nav" id="categoriesNav">
            <!-- به‌صورت پویا پر می‌شود -->
        </nav>

        <!-- سطح ۲: زیر-تب‌های وب‌سایت‌های دسته فعال -->
        <nav class="subtabs-container" id="subtabsNav">
            <!-- به‌صورت پویا پر می‌شود -->
        </nav>
    </header>

    <!-- محفظه اصلی وب‌ویوها -->
    <main class="webview-container" id="webviewContainer">
        <!-- لودر هوشمند -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">در حال بارگذاری وب‌سایت...</div>
        </div>
        <!-- محتوای وب‌سایت‌ها پویا رندر می‌شود -->
    </main>

    <!-- مودال مدیریت وب‌سایت‌ها و دسته‌بندی‌ها -->
    <div class="modal-overlay" id="manageModal">
        <div class="modal-card">
            <div class="modal-header">
                <span>⚙️ مدیریت وب‌سایت‌ها و دسته‌ها</span>
                <button class="modal-close-btn" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-tabs">
                    <button class="modal-tab-btn active" id="tabAddSiteBtn">➕ افزودن سایت</button>
                    <button class="modal-tab-btn" id="tabAddCatBtn">📂 افزودن دسته</button>
                    <button class="modal-tab-btn" id="tabManageListBtn">📜 لیست و حذف</button>
                </div>

                <!-- بخش افزودن سایت -->
                <div id="sectionAddSite" class="modal-section">
                    <form id="addSiteForm" style="display: flex; flex-direction: column; gap: 12px;">
                        <div class="form-group">
                            <label class="form-label">عنوان وب‌سایت:</label>
                            <input type="text" id="siteNameInput" class="form-input" placeholder="مثلاً: کارگزاری آگاه" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">آدرس وب‌سایت (URL):</label>
                            <input type="url" id="siteUrlInput" class="form-input" placeholder="https://..." required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">دسته‌بندی مربوطه:</label>
                            <select id="siteCategorySelect" class="form-select" required></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">نوع نمایش:</label>
                            <select id="siteTypeSelect" class="form-select" required>
                                <option value="card">کارت ورود مستقیم (پیشنهادی برای کارگزاری‌ها)</option>
                                <option value="iframe">نمایش درون‌برنامه‌ای (Iframe)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">آیکون / ایموجی (اختیاری):</label>
                            <input type="text" id="siteIconInput" class="form-input" placeholder="مثلاً: 🌐 یا 📊">
                        </div>
                        <button type="submit" class="form-submit-btn">💾 ذخیره وب‌سایت جدید</button>
                    </form>
                </div>

                <!-- بخش افزودن دسته -->
                <div id="sectionAddCat" class="modal-section" style="display: none;">
                    <form id="addCatForm" style="display: flex; flex-direction: column; gap: 12px;">
                        <div class="form-group">
                            <label class="form-label">نام دسته‌بندی جدید:</label>
                            <input type="text" id="catNameInput" class="form-input" placeholder="مثلاً: کارگزاری‌ها، بانک‌ها و..." required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">آیکون / ایموجی دسته:</label>
                            <input type="text" id="catIconInput" class="form-input" placeholder="مثلاً: 📂 یا 📊">
                        </div>
                        <button type="submit" class="form-submit-btn">💾 ایجاد دسته جدید</button>
                    </form>
                </div>

                <!-- بخش لیست و حذف -->
                <div id="sectionManageList" class="modal-section" style="display: none;">
                    <div style="font-size: 0.85rem; font-weight: 700; color: #38bdf8; margin-bottom: 6px;">📂 دسته‌ها:</div>
                    <div class="manage-list" id="manageCategoriesList"></div>

                    <div style="font-size: 0.85rem; font-weight: 700; color: #38bdf8; margin-top: 14px; margin-bottom: 6px;">🌐 وب‌سایت‌ها:</div>
                    <div class="manage-list" id="manageWebsitesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // کلیدهای ذخیره‌سازی محلی
        const STORAGE_CATS_KEY = 'portal_www_categories_v1';
        const STORAGE_SITES_KEY = 'portal_www_websites_v1';

        // دسته‌بندی‌های پیش‌فرض اولیه
        const DEFAULT_CATEGORIES = [
            { id: 'cat_funds', name: 'صندوق‌ها', icon: '🏦' },
            { id: 'cat_brokers', name: 'کارگزاری‌ها', icon: '📊' }
        ];

        // وب‌سایت‌های پیش‌فرض اولیه
        const DEFAULT_WEBSITES = [
            {
                id: 'site_1',
                catId: 'cat_funds',
                name: 'انرژی فارابی',
                url: 'https://energy.irfarabi.ir/',
                type: 'card',
                icon: '⚡',
                desc: 'جهت مشاهده سریع و کامل امکانات وب‌سایت انرژی فارابی، روی دکمه زیر کلیک کنید.'
            },
            {
                id: 'site_2',
                catId: 'cat_funds',
                name: 'کیان ۴',
                url: 'https://kianfunds4.ir/',
                type: 'card',
                icon: '📈',
                desc: 'جهت مشاهده مستقیم و کامل اطلاعات صندوق کیان ۴، روی دکمه زیر کلیک کنید.'
            },
            {
                id: 'site_3',
                catId: 'cat_funds',
                name: 'کیان ۹ (NAV)',
                url: 'https://kianfunds9.ir/reports/nav-trend?symbol=16',
                type: 'iframe',
                icon: '📊',
                desc: ''
            }
        ];

        function getCategories() {
            try {
                const data = localStorage.getItem(STORAGE_CATS_KEY);
                if (data) return JSON.parse(data);
            } catch (e) {
                console.error("Error reading categories:", e);
            }
            saveCategories(DEFAULT_CATEGORIES);
            return DEFAULT_CATEGORIES;
        }

        function saveCategories(cats) {
            localStorage.setItem(STORAGE_CATS_KEY, JSON.stringify(cats));
            if (window.EmaratCloudSync && window.EmaratCloudSync.push) {
                window.EmaratCloudSync.push();
            }
        }

        function getWebsites() {
            try {
                const data = localStorage.getItem(STORAGE_SITES_KEY);
                if (data) return JSON.parse(data);
            } catch (e) {
                console.error("Error reading websites:", e);
            }
            saveWebsites(DEFAULT_WEBSITES);
            return DEFAULT_WEBSITES;
        }

        function saveWebsites(sites) {
            localStorage.setItem(STORAGE_SITES_KEY, JSON.stringify(sites));
            if (window.EmaratCloudSync && window.EmaratCloudSync.push) {
                window.EmaratCloudSync.push();
            }
        }

        // وضعیت فعلی اپلیکیشن
        let categories = getCategories();
        let websites = getWebsites();
        let activeCatId = categories[0] ? categories[0].id : null;
        let activeSiteId = null;

        const categoriesNav = document.getElementById('categoriesNav');
        const subtabsNav = document.getElementById('subtabsNav');
        const webviewContainer = document.getElementById('webviewContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const refreshBtn = document.getElementById('refreshBtn');
        const openExternalBtn = document.getElementById('openExternalBtn');

        function showLoading(text) {
            loadingText.innerText = text || 'در حال بارگذاری...';
            loadingOverlay.style.opacity = '1';
            loadingOverlay.style.pointerEvents = 'auto';
        }

        function hideLoading() {
            loadingOverlay.style.opacity = '0';
            loadingOverlay.style.pointerEvents = 'none';
        }

        // رندر تب‌های دسته‌بندی اصلی (سطح ۱)
        function renderCategories() {
            categoriesNav.innerHTML = '';
            categories = getCategories();

            if (!activeCatId || !categories.some(c => c.id === activeCatId)) {
                activeCatId = categories[0] ? categories[0].id : null;
            }

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat.id === activeCatId ? 'active' : ''}`;
                btn.innerHTML = `<span>${cat.icon || '📁'}</span> <span>${cat.name}</span>`;
                btn.onclick = () => {
                    activeCatId = cat.id;
                    renderCategories();
                    renderSubtabs();
                };
                categoriesNav.appendChild(btn);
            });
        }

        // رندر زیر-تب‌های وب‌سایت‌های دسته فعال (سطح ۲)
        function renderSubtabs() {
            subtabsNav.innerHTML = '';
            websites = getWebsites();
            const filteredSites = websites.filter(s => s.catId === activeCatId);

            if (filteredSites.length === 0) {
                subtabsNav.innerHTML = `<div class="empty-cat-msg">هیچ وب‌سایتی در این دسته‌بندی تعریف نشده است. (از دکمه ➕ مدیریت اضافه کنید)</div>`;
                activeSiteId = null;
                renderWebview();
                return;
            }

            if (!activeSiteId || !filteredSites.some(s => s.id === activeSiteId)) {
                activeSiteId = filteredSites[0].id;
            }

            filteredSites.forEach(site => {
                const btn = document.createElement('button');
                btn.className = `site-tab-btn ${site.id === activeSiteId ? 'active' : ''}`;
                btn.innerHTML = `<span>${site.icon || '🌐'}</span> <span>${site.name}</span>`;
                btn.onclick = () => {
                    activeSiteId = site.id;
                    renderSubtabs();
                    renderWebview();
                };
                subtabsNav.appendChild(btn);
            });

            renderWebview();
        }

        // رندر محتوای وب‌ویو یا کارت برای وب‌سایت فعال
        function renderWebview() {
            // نگه داشتن لودر و پاکسازی سایر فرِیم‌ها
            const wrappers = webviewContainer.querySelectorAll('.webview-wrapper');
            wrappers.forEach(w => w.remove());

            if (!activeSiteId) {
                hideLoading();
                return;
            }

            const currentSite = websites.find(s => s.id === activeSiteId);
            if (!currentSite) {
                hideLoading();
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'webview-wrapper active';
            wrapper.id = `wrapper-${currentSite.id}`;

            if (currentSite.type === 'iframe') {
                showLoading(`در حال دریافت ${currentSite.name}...`);
                const iframe = document.createElement('iframe');
                iframe.className = 'webview-frame';
                iframe.src = currentSite.url;
                iframe.allow = 'fullscreen; autoplay; clipboard-write;';
                iframe.onload = () => hideLoading();
                iframe.onerror = () => hideLoading();
                wrapper.appendChild(iframe);
            } else {
                // کارت ورود مستقیم (Card Fallback)
                wrapper.innerHTML = `
                    <div class="fallback-card">
                        <div class="fallback-icon">${currentSite.icon || '🌐'}</div>
                        <div class="fallback-title">${currentSite.name}</div>
                        <div class="fallback-desc">
                            ${currentSite.desc || 'جهت مشاهده مستقیم و سریع سامانه، روی دکمه زیر کلیک کنید.'}
                        </div>
                        <a class="fallback-launch-btn" href="${currentSite.url}" target="_blank" rel="noopener noreferrer">
                            🚀 ورود به سامانه ${currentSite.name}
                        </a>
                    </div>
                `;
                hideLoading();
            }

            webviewContainer.appendChild(wrapper);
        }

        // دکمه تازه‌سازی
        refreshBtn.onclick = () => {
            if (activeSiteId) {
                const currentSite = websites.find(s => s.id === activeSiteId);
                if (currentSite) {
                    if (currentSite.type === 'iframe') {
                        renderWebview();
                    } else {
                        window.open(currentSite.url, '_blank');
                    }
                }
            }
        };

        // باز کردن مستقیم در مرورگر
        openExternalBtn.onclick = () => {
            if (activeSiteId) {
                const currentSite = websites.find(s => s.id === activeSiteId);
                if (currentSite) {
                    window.open(currentSite.url, '_blank');
                }
            }
        };

        // عناصر و توابع مودال مدیریت
        const manageBtn = document.getElementById('manageBtn');
        const manageModal = document.getElementById('manageModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        const tabAddSiteBtn = document.getElementById('tabAddSiteBtn');
        const tabAddCatBtn = document.getElementById('tabAddCatBtn');
        const tabManageListBtn = document.getElementById('tabManageListBtn');

        const sectionAddSite = document.getElementById('sectionAddSite');
        const sectionAddCat = document.getElementById('sectionAddCat');
        const sectionManageList = document.getElementById('sectionManageList');

        const addSiteForm = document.getElementById('addSiteForm');
        const addCatForm = document.getElementById('addCatForm');

        const siteCategorySelect = document.getElementById('siteCategorySelect');
        const manageCategoriesList = document.getElementById('manageCategoriesList');
        const manageWebsitesList = document.getElementById('manageWebsitesList');

        function openModal() {
            populateCategorySelect();
            renderManageLists();
            manageModal.classList.add('active');
        }

        function closeModal() {
            manageModal.classList.remove('active');
        }

        manageBtn.onclick = openModal;
        closeModalBtn.onclick = closeModal;

        manageModal.onclick = (e) => {
            if (e.target === manageModal) closeModal();
        };

        // سوئیچ بخش‌های مودال
        tabAddSiteBtn.onclick = () => {
            tabAddSiteBtn.classList.add('active');
            tabAddCatBtn.classList.remove('active');
            tabManageListBtn.classList.remove('active');
            sectionAddSite.style.display = 'block';
            sectionAddCat.style.display = 'none';
            sectionManageList.style.display = 'none';
        };

        tabAddCatBtn.onclick = () => {
            tabAddSiteBtn.classList.remove('active');
            tabAddCatBtn.classList.add('active');
            tabManageListBtn.classList.remove('active');
            sectionAddSite.style.display = 'none';
            sectionAddCat.style.display = 'block';
            sectionManageList.style.display = 'none';
        };

        tabManageListBtn.onclick = () => {
            tabAddSiteBtn.classList.remove('active');
            tabAddCatBtn.classList.remove('active');
            tabManageListBtn.classList.add('active');
            sectionAddSite.style.display = 'none';
            sectionAddCat.style.display = 'none';
            sectionManageList.style.display = 'block';
            renderManageLists();
        };

        function populateCategorySelect() {
            siteCategorySelect.innerHTML = '';
            categories = getCategories();
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = `${cat.icon || '📂'} ${cat.name}`;
                siteCategorySelect.appendChild(opt);
            });
        }

        // فرم ثبت وب‌سایت جدید
        addSiteForm.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('siteNameInput').value.trim();
            const url = document.getElementById('siteUrlInput').value.trim();
            const catId = siteCategorySelect.value;
            const type = document.getElementById('siteTypeSelect').value;
            const icon = document.getElementById('siteIconInput').value.trim() || '🌐';

            if (!name || !url || !catId) return;

            const newSite = {
                id: 'site_' + Date.now(),
                catId: catId,
                name: name,
                url: url,
                type: type,
                icon: icon,
                desc: ''
            };

            websites.push(newSite);
            saveWebsites(websites);

            addSiteForm.reset();
            closeModal();

            activeCatId = catId;
            activeSiteId = newSite.id;
            renderCategories();
            renderSubtabs();
        };

        // فرم ثبت دسته‌بندی جدید
        addCatForm.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('catNameInput').value.trim();
            const icon = document.getElementById('catIconInput').value.trim() || '📂';

            if (!name) return;

            const newCat = {
                id: 'cat_' + Date.now(),
                name: name,
                icon: icon
            };

            categories.push(newCat);
            saveCategories(categories);

            addCatForm.reset();
            populateCategorySelect();
            closeModal();

            activeCatId = newCat.id;
            renderCategories();
            renderSubtabs();
        };

        // رندر لیست جهت ویرایش و حذف
        function renderManageLists() {
            manageCategoriesList.innerHTML = '';
            manageWebsitesList.innerHTML = '';

            categories = getCategories();
            websites = getWebsites();

            categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'manage-item';
                item.innerHTML = `
                    <div class="manage-item-info">
                        <span>${cat.icon || '📂'}</span>
                        <span>${cat.name}</span>
                    </div>
                    <div class="manage-item-actions">
                        <button class="icon-action-btn edit">✏️ ویرایش</button>
                        <button class="icon-action-btn delete">🗑️ حذف</button>
                    </div>
                `;

                // دکمه ویرایش دسته‌بندی
                item.querySelector('.edit').onclick = () => {
                    const newName = prompt('نام جدید برای این دسته‌بندی را وارد کنید:', cat.name);
                    if (newName !== null && newName.trim() !== '') {
                        const newIcon = prompt('آیکون / ایموجی جدید (اختیاری):', cat.icon || '📂');
                        cat.name = newName.trim();
                        if (newIcon !== null && newIcon.trim() !== '') {
                            cat.icon = newIcon.trim();
                        }
                        saveCategories(categories);
                        populateCategorySelect();
                        renderManageLists();
                        renderCategories();
                        renderSubtabs();
                    }
                };

                // دکمه حذف دسته‌بندی
                item.querySelector('.delete').onclick = () => {
                    if (categories.length <= 1) {
                        alert('حداقل یک دسته‌بندی باید در برنامه وجود داشته باشد.');
                        return;
                    }
                    if (confirm(`آیا از حذف دسته «${cat.name}» و تمامی سایت‌های زیرمجموعه آن مطمئن هستید؟`)) {
                        categories = categories.filter(c => c.id !== cat.id);
                        websites = websites.filter(w => w.catId !== cat.id);
                        saveCategories(categories);
                        saveWebsites(websites);
                        populateCategorySelect();
                        renderManageLists();
                        renderCategories();
                        renderSubtabs();
                    }
                };
                manageCategoriesList.appendChild(item);
            });

            websites.forEach(site => {
                const parentCat = categories.find(c => c.id === site.catId);
                const item = document.createElement('div');
                item.className = 'manage-item';
                item.innerHTML = `
                    <div class="manage-item-info">
                        <span>${site.icon || '🌐'}</span>
                        <span>${site.name}</span>
                        <span style="font-size: 0.72rem; color: #94a3b8;">(${parentCat ? parentCat.name : 'بدون دسته'})</span>
                    </div>
                    <div class="manage-item-actions">
                        <button class="icon-action-btn edit">✏️ ویرایش</button>
                        <button class="icon-action-btn delete">🗑️ حذف</button>
                    </div>
                `;

                // دکمه ویرایش وب‌سایت
                item.querySelector('.edit').onclick = () => {
                    const newName = prompt('نام جدید برای وب‌سایت را وارد کنید:', site.name);
                    if (newName !== null && newName.trim() !== '') {
                        const newUrl = prompt('آدرس جدید وب‌سایت (URL):', site.url);
                        if (newUrl !== null && newUrl.trim() !== '') {
                            site.name = newName.trim();
                            site.url = newUrl.trim();
                            saveWebsites(websites);
                            renderManageLists();
                            renderCategories();
                            renderSubtabs();
                        }
                    }
                };

                // دکمه حذف وب‌سایت
                item.querySelector('.delete').onclick = () => {
                    if (confirm(`آیا از حذف وب‌سایت «${site.name}» مطمئن هستید؟`)) {
                        websites = websites.filter(w => w.id !== site.id);
                        saveWebsites(websites);
                        renderManageLists();
                        renderCategories();
                        renderSubtabs();
                    }
                };
                manageWebsitesList.appendChild(item);
            });
        }

        // راه‌اندازی اولیه
        document.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderSubtabs();
        });
    </script>
</body>
</html>
