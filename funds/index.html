<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WWW.com - وب‌سایت صندوق‌ها</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="../cloud-sync.js"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-dark: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(56, 189, 248, 0.25);
            --text-light: #f8fafc;
            --accent-cyan: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
        }

        /* هدر فوقانی با تب‌ها */
        .app-header {
            background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
            padding: 10px 12px 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        /* دکمه‌های تب‌ها */
        .tabs-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-btn.active {
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* محفظه اصلی وب‌ویوها */
        .webview-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
        }

        .webview-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .webview-wrapper.active {
            display: block;
        }

        .webview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* کارت جایگزین باز کردن مستقیم وب‌سایت */
        .fallback-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 24px;
            text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            gap: 16px;
        }

        .fallback-icon {
            font-size: 3.5rem;
            margin-bottom: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }

        .fallback-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
        }

        .fallback-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            max-width: 340px;
            line-height: 1.6;
        }

        .fallback-launch-btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .fallback-launch-btn:active {
            transform: scale(0.96);
        }

        /* لودر و اسپینر */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 50;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

    </style>
</head>
<body>

    <!-- هدر بالای صفحه با دکمه‌های تب و ابزارها -->
    <header class="app-header">
        <div class="header-top">
            <div class="brand-title">
                <img src="icon-192.png" alt="WWW.com" class="brand-icon">
                <span>WWW.com</span>
            </div>
            <div class="header-actions">
                <button class="action-btn" id="refreshBtn" title="بروزرسانی">
                    🔄 تازه‌سازی
                </button>
                <button class="action-btn" id="openExternalBtn" title="باز کردن در مرورگر">
                    🌐 مرورگر
                </button>
            </div>
        </div>

        <nav class="tabs-container">
            <button class="tab-btn active" data-tab="tab1" data-url="https://energy.irfarabi.ir/">
                انرژی فارابی
            </button>
            <button class="tab-btn" data-tab="tab2" data-url="https://kianfunds4.ir/">
                کیان ۴
            </button>
            <button class="tab-btn" data-tab="tab3" data-url="https://kianfunds9.ir/reports/nav-trend?symbol=16">
                کیان ۹ (NAV)
            </button>
        </nav>
    </header>

    <!-- محفظه اصلی وب‌ویوها -->
    <main class="webview-container">
        <!-- لودر هوشمند -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">در حال بارگذاری وب‌سایت...</div>
        </div>

        <!-- تب ۱: انرژی فارابی (حالت کارت ورودی مستقیم جهت ماندگاری و اطمینان از عملکرد) -->
        <div id="wrapper-tab1" class="webview-wrapper active">
            <div class="fallback-card">
                <div class="fallback-icon">⚡</div>
                <div class="fallback-title">صندوق انرژی فارابی</div>
                <div class="fallback-desc">
                    جهت مشاهده سریع و کامل امکانات وب‌سایت انرژی فارابی، روی دکمه زیر کلیک کنید.
                </div>
                <a class="fallback-launch-btn" href="https://energy.irfarabi.ir/" target="_blank" rel="noopener noreferrer">
                    🚀 ورود به سامانه انرژی فارابی
                </a>
            </div>
        </div>

        <!-- تب ۲: کیان ۴ -->
        <div id="wrapper-tab2" class="webview-wrapper">
            <div class="fallback-card">
                <div class="fallback-icon">📈</div>
                <div class="fallback-title">صندوق کیان ۴</div>
                <div class="fallback-desc">
                    جهت مشاهده مستقیم و کامل اطلاعات صندوق کیان ۴، روی دکمه زیر کلیک کنید.
                </div>
                <a class="fallback-launch-btn" href="https://kianfunds4.ir/" target="_blank" rel="noopener noreferrer">
                    🚀 ورود به سامانه کیان ۴
                </a>
            </div>
        </div>

        <!-- تب ۳: کیان ۹ (این وب‌سایت اجازه نمایش در آی‌فریم را می‌دهد) -->
        <div id="wrapper-tab3" class="webview-wrapper">
            <iframe id="frame-tab3" class="webview-frame" data-src="https://kianfunds9.ir/reports/nav-trend?symbol=16" allow="fullscreen; autoplay; clipboard-write;"></iframe>
        </div>
    </main>

    <script>
        const tabBtns = document.querySelectorAll('.tab-btn');
        const wrappers = {
            tab1: document.getElementById('wrapper-tab1'),
            tab2: document.getElementById('wrapper-tab2'),
            tab3: document.getElementById('wrapper-tab3')
        };
        const frameTab3 = document.getElementById('frame-tab3');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const refreshBtn = document.getElementById('refreshBtn');
        const openExternalBtn = document.getElementById('openExternalBtn');

        let currentTab = 'tab1';

        if (frameTab3) {
            frameTab3.addEventListener('load', () => {
                if (currentTab === 'tab3') {
                    hideLoading();
                }
            });
        }

        function showLoading(text) {
            loadingText.innerText = text || 'در حال بارگذاری...';
            loadingOverlay.style.opacity = '1';
            loadingOverlay.style.pointerEvents = 'auto';
        }

        function hideLoading() {
            loadingOverlay.style.opacity = '0';
            loadingOverlay.style.pointerEvents = 'none';
        }

        // سوئیچ سریع بین تب‌ها
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetTab = btn.getAttribute('data-tab');
                if (targetTab === currentTab) return;

                // به‌روزرسانی استایل دکمه فعال
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // نمایش محتوای تب انتخاب شده
                Object.keys(wrappers).forEach(key => {
                    if (key === targetTab) {
                        wrappers[key].classList.add('active');

                        if (key === 'tab3' && frameTab3) {
                            if (!frameTab3.src && frameTab3.getAttribute('data-src')) {
                                showLoading('در حال دریافت اطلاعات...');
                                frameTab3.src = frameTab3.getAttribute('data-src');
                            } else {
                                hideLoading();
                            }
                        } else {
                            hideLoading();
                        }
                    } else {
                        wrappers[key].classList.remove('active');
                    }
                });

                currentTab = targetTab;
            });
        });

        // دکمه تازه‌سازی (Refresh)
        refreshBtn.addEventListener('click', () => {
            if (currentTab === 'tab3' && frameTab3) {
                showLoading('در حال به روزرسانی...');
                frameTab3.src = frameTab3.src || frameTab3.getAttribute('data-src');
            } else {
                const activeBtn = document.querySelector('.tab-btn.active');
                if (activeBtn) {
                    window.open(activeBtn.getAttribute('data-url'), '_blank');
                }
            }
        });

        // باز کردن مستقیم در مرورگر
        openExternalBtn.addEventListener('click', () => {
            const activeBtn = document.querySelector('.tab-btn.active');
            if (activeBtn) {
                const targetUrl = activeBtn.getAttribute('data-url');
                window.open(targetUrl, '_blank');
            }
        });

        // مخفی‌سازی لودر پس از ۱ ثانیه
        setTimeout(() => {
            hideLoading();
        }, 1000);
    </script>
</body>
</html>
