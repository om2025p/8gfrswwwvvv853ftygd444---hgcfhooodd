<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>همگام‌ساز عمارت | ادغام تک‌لمسی به main</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #10b981;
            --bg-color: #0b1329;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0b1329 0%, #1e1b4b 50%, #0f172a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .back-link {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 22px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .badge-notice {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.86rem;
            line-height: 1.6;
            text-align: right;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }

        .input-field {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            direction: ltr;
            text-align: left;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .sync-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 18px 24px;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            margin-top: 6px;
        }

        .sync-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(16, 185, 129, 0.45);
        }

        .sync-btn:active {
            transform: scale(0.98);
        }

        .sync-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        .status-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px;
            font-size: 0.88rem;
            line-height: 1.6;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #94a3b8;
        }

        .status-box.success {
            border-color: #10b981;
            color: #34d399;
            background: rgba(6, 78, 59, 0.3);
        }

        .status-box.error {
            border-color: #ef4444;
            color: #f87171;
            background: rgba(127, 29, 29, 0.3);
        }

        .status-box.loading {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toggle-settings {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            align-self: center;
            padding: 4px 8px;
        }

        .toggle-settings:hover {
            color: #fff;
        }

        #settingsPanel {
            display: none;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 14px;
        }

        #settingsPanel.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <img src="icon-192.png" alt="همگام‌ساز">
                <div>
                    <h1>همگام‌ساز عمارت</h1>
                    <div style="font-size: 0.75rem; color: #94a3b8;">ادغام ۱ کلیکی به شاخه main</div>
                </div>
            </div>
            <a href="../index.html" class="back-link">🔙 بازگشت</a>
        </div>

        <!-- Main Card -->
        <div class="card">
            <div class="badge-notice">
                ✨ <strong>بدون نیاز به GitHub Actions:</strong> شاخه شما با یک لمس مستقیماً از طریق REST API گیت‌هاب وارد <code>main</code> می‌شود تا سایت در همان آدرس فوراً آپدیت شود.
            </div>

            <div class="input-group">
                <label class="input-label" for="branchInput">
                    <span>📌 نام شاخه مقصد برای ارسال به main:</span>
                    <span id="detectedBranchLabel" style="color: #38bdf8; font-size: 0.8rem;">در حال تشخیص...</span>
                </label>
                <input type="text" id="branchInput" class="input-field" placeholder="158" value="158">
            </div>

            <button id="btnSync" class="sync-btn" onclick="executeOneTapSync()">
                <span id="btnIcon">🚀</span>
                <span id="btnText">ادغام آنی در شاخه main (تک‌لمسی)</span>
            </button>

            <div id="statusBox" class="status-box">
                آماده برای همگام‌سازی ⚡
            </div>

            <button class="toggle-settings" onclick="toggleSettingsPanel()">
                ⚙️ تنظیمات توکن گیت‌هاب (یک‌بار تنظیم)
            </button>

            <div id="settingsPanel">
                <div class="input-group">
                    <label class="input-label" for="tokenInput">توکن شخصی گیت‌هاب (PAT Token):</label>
                    <input type="password" id="tokenInput" class="input-field" placeholder="github_pat_... یا ghp_...">
                </div>

                <div class="input-group">
                    <label class="input-label" for="repoInput">نام مخزن (Owner/Repo):</label>
                    <input type="text" id="repoInput" class="input-field" value="om2025p/8gfrswwwvvv853ftygd444---hgcfhooodd">
                </div>

                <button onclick="saveSettings()" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 10px; border-radius: 12px; font-weight: 700; cursor: pointer;">
                    💾 ذخیره تنظیمات
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_TOKEN = 'emarat_sync_gh_pat';
        const STORAGE_KEY_REPO = 'emarat_sync_gh_repo';
        const STORAGE_KEY_BRANCH = 'emarat_sync_last_branch';

        const branchInput = document.getElementById('branchInput');
        const tokenInput = document.getElementById('tokenInput');
        const repoInput = document.getElementById('repoInput');
        const statusBox = document.getElementById('statusBox');
        const btnSync = document.getElementById('btnSync');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const settingsPanel = document.getElementById('settingsPanel');
        const detectedBranchLabel = document.getElementById('detectedBranchLabel');

        function initApp() {
            // Load saved settings or fall back to known keys in portal
            const savedToken = localStorage.getItem(STORAGE_KEY_TOKEN) ||
                               localStorage.getItem('ai_enhancer_gh_token') ||
                               localStorage.getItem('restricted_gh_token') || '';
            const savedRepo = localStorage.getItem(STORAGE_KEY_REPO) || 'om2025p/8gfrswwwvvv853ftygd444---hgcfhooodd';
            const savedBranch = localStorage.getItem(STORAGE_KEY_BRANCH) || '158';

            tokenInput.value = savedToken;
            repoInput.value = savedRepo;
            branchInput.value = savedBranch;

            if (!savedToken) {
                settingsPanel.classList.add('show');
                statusBox.innerHTML = '⚠️ لطفاً ابتدا توکن گیت‌هاب (PAT) خود را در کادر تنظیمات وارد و ذخیره کنید.';
                statusBox.className = 'status-box';
            }

            detectLatestBranch();
        }

        function toggleSettingsPanel() {
            settingsPanel.classList.toggle('show');
        }

        function saveSettings() {
            const token = tokenInput.value.trim();
            const repo = repoInput.value.trim();

            if (!token) {
                alert('لطفاً توکن گیت‌هاب را وارد کنید.');
                return;
            }

            localStorage.setItem(STORAGE_KEY_TOKEN, token);
            localStorage.setItem(STORAGE_KEY_REPO, repo);
            settingsPanel.classList.remove('show');
            statusBox.innerHTML = '✅ تنظیمات توکن با موفقیت ذخیره شد. آماده کار!';
            statusBox.className = 'status-box success';
        }

        async function detectLatestBranch() {
            const token = tokenInput.value.trim() || localStorage.getItem(STORAGE_KEY_TOKEN);
            const repo = repoInput.value.trim() || 'om2025p/8gfrswwwvvv853ftygd444---hgcfhooodd';

            if (!token) {
                detectedBranchLabel.innerText = 'نیاز به توکن';
                return;
            }

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/branches?per_page=15`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (res.ok) {
                    const branches = await res.json();
                    const filtered = branches.filter(b => b.name !== 'main' && b.name !== 'gh-pages');
                    if (filtered.length > 0) {
                        detectedBranchLabel.innerText = `آخرین شاخه: ${filtered[0].name}`;
                        if (!branchInput.value || branchInput.value === '158') {
                            branchInput.value = filtered[0].name;
                        }
                    } else {
                        detectedBranchLabel.innerText = 'آماده';
                    }
                } else {
                    detectedBranchLabel.innerText = '';
                }
            } catch (e) {
                detectedBranchLabel.innerText = '';
            }
        }

        async function executeOneTapSync() {
            const token = tokenInput.value.trim() || localStorage.getItem(STORAGE_KEY_TOKEN);
            const repo = repoInput.value.trim() || 'om2025p/8gfrswwwvvv853ftygd444---hgcfhooodd';
            const branch = branchInput.value.trim();

            if (!token) {
                settingsPanel.classList.add('show');
                statusBox.innerHTML = '❌ لطفاً ابتدا توکن شخصی گیت‌هاب (PAT) را وارد و ذخیره نمایید.';
                statusBox.className = 'status-box error';
                return;
            }

            if (!branch) {
                statusBox.innerHTML = '❌ لطفاً نام شاخه را مشخص کنید.';
                statusBox.className = 'status-box error';
                return;
            }

            localStorage.setItem(STORAGE_KEY_BRANCH, branch);

            btnSync.disabled = true;
            btnIcon.innerHTML = '<span class="spinner"></span>';
            btnText.innerText = 'در حال ارسال دستور ادغام به سرور گیت‌هاب...';
            statusBox.innerHTML = `⏳ در حال ادغام شاخه <strong>${branch}</strong> در شاخه <strong>main</strong>...`;
            statusBox.className = 'status-box loading';

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/merges`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        base: 'main',
                        head: branch,
                        commit_message: `Emarat 1-Tap Sync: Merge ${branch} into main`
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.status === 201) {
                    btnIcon.innerText = '🎉';
                    btnText.innerText = 'ادغام با موفقیت کامل انجام شد!';
                    statusBox.innerHTML = `✅ <strong>موفقیت‌آمیز!</strong> شاخه <code>${branch}</code> با ۱ کلیک وارد <code>main</code> شد.<br>سایت ظرف چند ثانیه روی همان آدرس به‌روز خواهد شد. 🚀`;
                    statusBox.className = 'status-box success';
                } else if (response.status === 204) {
                    btnIcon.innerText = '👌';
                    btnText.innerText = 'شاخه از قبل کاملاً به‌روز است!';
                    statusBox.innerHTML = `ℹ️ شاخه <code>main</code> در حال حاضر تمام کدهای شاخه <code>${branch}</code> را دارد و تغییری برای ادغام وجود نداشت.`;
                    statusBox.className = 'status-box success';
                } else if (response.status === 409) {
                    btnIcon.innerText = '⚠️';
                    btnText.innerText = 'تداخل در ادغام (Merge Conflict)';
                    statusBox.innerHTML = `⚠️ تداخل فایل‌ها بین <code>${branch}</code> و <code>main</code> رخ داده است.`;
                    statusBox.className = 'status-box error';
                } else if (response.status === 404) {
                    btnIcon.innerText = '❌';
                    btnText.innerText = 'شاخه یا مخزن پیدا نشد!';
                    statusBox.innerHTML = `❌ شاخه <code>${branch}</code> یا مخزن یافت نشد. صحت نام را بررسی کنید.`;
                    statusBox.className = 'status-box error';
                } else {
                    btnIcon.innerText = '❌';
                    btnText.innerText = 'خطا در ارتباط با گیت‌هاب';
                    statusBox.innerHTML = `❌ خطا (${response.status}): ${data.message || 'مشکل در برقراری ارتباط با API'}`;
                    statusBox.className = 'status-box error';
                }
            } catch (err) {
                btnIcon.innerText = '❌';
                btnText.innerText = 'خطای شبکه یا اینترنت';
                statusBox.innerHTML = `❌ خطای ارتباط: ${err.message}`;
                statusBox.className = 'status-box error';
            } finally {
                setTimeout(() => {
                    btnSync.disabled = false;
                    btnIcon.innerText = '🚀';
                    btnText.innerText = 'ادغام آنی در شاخه main (تک‌لمسی)';
                }, 4000);
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').catch(err => console.error(err));
        }
    </script>
</body>
</html>
